<!doctype html>
<!--
  A series' page, second design: the owner's reference picture (Chicago Med) drawn at the application's own frames.
  It replaces series-show.html, which is kept for what it still says about the states it drew.

  What the reference has, and what this page does with it:

    - A rail down the start edge: the way back with the application's name, and the page's sections -- Overview,
      Seasons, Cast, Similar. A television writes the names; a handset keeps the icons only (56dp), as the
      television's names do not fit beside a hero in 385dp. Overview is the top of the page, and a press on a
      section scrolls the page to it. A section the provider has told nothing about is not in the rail.
    - The hero: the poster, the name, one row of facts (year, genre, rating, seasons), the plot in three lines
      (two on a handset) with the film page's "Show all" at the end of it when it is cut, and the buttons: Play
      -- "Continue S2 E5" for a show begun, "Play S1 E1" for one not -- and the favourite. Behind it, to the end
      side, the provider's wide picture of the show when it sent one, fading into the ground; none is made up.
    - The season chips, two lines each: the season, and how many episodes it holds (the catalogue knows).
      A television ends the row with an arrow that scrolls it; a handset scrolls by touch and shows the fade.
    - The episodes: number, the provider's still (16:9), "S01E01 - Name" and one line of its plot, and the running
      time in an outline at the end. The remote's row is violet with a lavender edge. Watched has a check on the
      still, part-watched a thin bar along its foot.

  What the reference has that this page does not, and why (asked of the owner, not decided here):

    - "Ongoing" in the facts: the providers do not send a status.
    - "Related" in the rail: nothing in the catalogue says what it would hold.
    - The "..." button: nothing is known that it would do.
    - Cast as photographs: the providers send names only, so the cast is a row of names.
    - Play is the application's blue, as on the film page; the reference's violet is the chosen state here (the
      season, the rail's section, the remote's row). One word from the owner turns it.

  One page, one column that scrolls under the rail. Left to right whatever the language, as the film's page is, for
  the same reason: the provider's words are mixed. The television is drawn in English, as the reference is; the
  handset in Arabic. Names and figures are examples.

    ?frame=<name>      one frame at its device size
    ?frame=sheet       every frame stacked with its caption, for review
-->

.poster{flex:none;border-radius:10px;border:1px solid var(--edgeSoft);overflow:hidden;position:relative;

.btn.s{background:var(--glass);border:1px solid var(--glassBorder);color:var(--ink)}
.ring{outline:2px solid var(--ring);outline-offset:2px}
.chips{display:flex;position:relative;overflow:hidden}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;background:var(--glass);border:1px solid var(--glassBorder);color:var(--ink);white-space:nowrap}
.chip b{font-weight:700;color:#fff}
.chip small{color:var(--muted)}
.chip.on{background:var(--violet);border-color:var(--violetEdge)}
.chip.on small{color:#EDE3FF}
.fadeEnd{position:absolute;right:0;top:0;bottom:0;background:linear-gradient(90deg,transparent,#14172e)}
.arrow{flex:none;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--glass);border:1px solid var(--glassBorder);color:var(--ink)}

.ep.on{background:rgba(111,76,255,.42);border:2px solid #B8A4FF}
.num{flex:none;text-align:center;font-weight:600;color:var(--ink)}
.th{flex:none;border-radius:8px;position:relative;overflow:hidden}
.th i{position:absolute;left:0;bottom:0;height:3px;background:var(--azure)}
.th .ck{position:absolute;right:4px;top:4px;width:17px;height:17px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:var(--ok)}
.th .ck svg{width:11px;height:11px}
.strip{background:linear-gradient(160deg,#10224f,#0b1535)}
.strip svg{position:absolute;inset:20%;width:60%;height:60%;opacity:.35;fill:none;stroke:#8FA7E0;stroke-width:1.5}
.etx{flex:1;min-width:0;display:flex;flex-direction:column}
.en{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
.pt{color:var(--ink);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
.dur{flex:none;border:1px solid rgba(255,255,255,.5);border-radius:6px;color:#fff;font-variant-numeric:tabular-nums}
.sk{border-radius:6px;background:var(--skel)}
.hd{font-weight:700;color:#fff}
.pill{display:inline-flex;align-items:center;border-radius:99px;background:var(--glass);border:1px solid var(--glassBorder);color:var(--ink);white-space:nowrap}
.card .cardp{border-radius:10px;border:1px solid var(--edgeSoft);position:relative;overflow:hidden}
.card .clab{color:var(--ink);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{background:var(--panel);border:1px solid var(--edgeSoft);border-radius:20px;padding:22px 26px;text-align:center}
</style>
</head>
<body>
<script>

function chips(M,tv,o){
  const list=o.seasons||SEASONS, ar=!tv;
  const cs=list.map(([n,c])=>`<div class="chip ar${n===(o.season||1)?' on':''}" style="height:${M.chipH}px;min-width:${M.chipW}px;padding:0 ${tv?14:12}px;gap:1px"><b style="font-size:${M.chipF}px">${ar?'الموسم '+n:'Season '+n}</b>${o.nocount?'':`<small style="font-size:${M.chipS}px">${ar?c+' حلقة':c+' Episodes'}</small>`}</div>`).join('');
  const more=list.length>(tv?7:7);
  return `<div style="display:flex;gap:10px;align-items:center;margin-top:${tv?16:12}px"><div class="chips" style="gap:${M.gap}px;flex:1;height:${M.chipH}px">${cs}${(more&&!tv)?`<div class="fadeEnd" style="width:46px"></div>`:''}</div>${(more&&tv)?`<div class="arrow" style="width:40px;height:${M.chipH}px">${ic('chev',22)}</div>`:''}</div>`;
}
function page(w,h,tv,o){
  const M=tv?MET.tv:MET.phone, ar=!tv;
  const eps=EP.map((e,i)=>o.plain?{...e,st:'n'}:e);
  const rows=eps.map(e=>row(e,M,o)).join('');
  const body=`${hero(M,tv,o)}${o.nochips?'':chips(M,tv,o)}<div class="list" style="margin-top:${tv?14:10}px">${rows}</div>`;
  return `${rail(M,tv,o)}<div class="scroll" style="left:${M.rail}px"><div style="position:relative;padding:${M.padT}px ${M.padR}px 0 ${M.pad}px;transform:translateY(-${o.scroll||0}px)">${art(M,tv,w,h,o)}<div style="position:relative;z-index:1">${body}</div></div></div>`;
}
function castFrame(w,h){
  const M=MET.phone;
  const names=['Noor Halabi','Tomás Reyes','Ingrid Voss','Daniel Okafor','Maria Salazar','Leo Park','Hanna Berg'];
  const pills=names.map(n=>`<span class="pill" style="height:32px;padding:0 14px;font-size:12.5px;margin:0 8px 8px 0">${n}</span>`).join('');
  const cards=['Dark Harbor','County General','Pulse','Ward 9','Corridors','North Wing'].map((t,i)=>{
    const [a,b]=HUES[i%HUES.length];
    return `<div class="card" style="flex:none;width:84px"><div class="cardp" style="width:84px;height:120px;background:linear-gradient(160deg,${a},${b})"></div><div class="clab" style="font-size:11px;margin-top:6px">${t}</div></div>`;}).join('');
  return `${rail(M,false,{at:'cast'})}<div class="scroll" style="left:${M.rail}px"><div style="padding:${M.padT+6}px ${M.padR}px 0 ${M.pad}px">
    <div class="hd ar" style="font-size:15px;margin-bottom:10px">الممثلون</div><div style="display:flex;flex-wrap:wrap;width:690px">${pills}</div>
    <div class="hd ar" style="font-size:15px;margin:10px 0 10px">مسلسلات مشابهة</div><div style="display:flex;gap:14px">${cards}</div></div></div>`;
}
function emptyFrame(){
  return `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><div class="panel" style="width:420px">
    <div class="ar" style="font-size:18px;font-weight:700;margin-bottom:8px">لا حلقات لهذا المسلسل</div>
    <div class="ar" style="font-size:13px;color:var(--ink);margin-bottom:18px">لم يرسل المزوّد حلقات لهذا المسلسل بعد.</div>
    <div class="btn s ring ar" style="height:48px;width:150px;margin:0 auto">رجوع</div></div></div>`;
}
const FR={
 'tv':[960,540,()=>page(960,540,true,{at:'info',focus:1})],
 'phone':[833,385,()=>page(833,385,false,{at:'info',focus:'play'})],
 'phone-seasons':[833,385,()=>page(833,385,false,{at:'seasons',focus:2,scroll:142})],
 'loading':[833,385,()=>page(833,385,false,{at:'info',focus:'play',loading:true,items:['info','seasons']})],
 'no-details':[833,385,()=>page(833,385,false,{at:'info',focus:'play',nodetails:true,playNew:true,noart:true,items:['info','seasons'],seasons:[[1,12],[2,12]].map(([n,c])=>[n,c]),nocount:false,plain:true})],
 'cast':[833,385,()=>castFrame(833,385)],
 'empty':[833,385,()=>emptyFrame()]
};
const CAP={
 'tv':'1. Television 960x540, drawn in English as the reference is. The rail names the sections; the hero is the poster, the name, the facts, the plot in three lines and the two buttons, over the provider\'s wide picture; ten seasons scroll under an arrow; the remote\'s row is violet with its lavender edge. A press on Play starts the episode to continue; the remote starts on Play (focus drawn on the first row here, as in the reference).',
 'phone':'2. Handset 833x385 in Arabic: the rail keeps its icons (56dp), the hero is compact (poster 88x132, the plot in two lines), the chips and the first rows of the list follow under it. Play is focused, as the remote or a switch starts there.',
 'phone-seasons':'3. The same page scrolled to Seasons (the rail\'s second icon, or a swipe): the hero has gone off the top and the episodes take the screen, five and a half of them. The rail\'s lit section follows the page.',
 'loading':'4. The details have not arrived: the poster, name, season chips with their counts, and the episode names are there (the catalogue holds them); quiet skeletons stand where the year, genre, rating, plot and episodes\' plots will be. Cast and Similar are not in the rail until they have something.',
 'no-details':'5. The provider sent no details (an M3U show): no wide picture, no year, genre, rating, plot, cast, plots or running times -- only what the catalogue holds. Play begins at S1 E1. Nothing is made up and no skeleton is left waiting.',
 'cast':'6. Cast and Similar (the rail\'s third and fourth icons): the cast is a row of names, as the providers send names only; Similar is the shows filed under the same category in the viewer\'s own catalogue.',
 'empty':'7. A show with no episodes: the application\'s own empty state, with a way back.'
};
const q=new URLSearchParams(location.search), f=q.get('frame')||'sheet';
function draw(n){const [w,h,fn]=FR[n];return `<div class="screen" style="width:${w}px;height:${h}px">${fn()}</div>`;}
if(f==='sheet'){document.body.className='sheet';document.body.innerHTML=Object.keys(FR).map(n=>`<div class="cap">${CAP[n]}</div>${draw(n)}`).join('');}
else document.body.innerHTML=draw(f);
</script>
