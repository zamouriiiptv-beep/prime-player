<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Castivio — Live, Movies, Series</title>
<style>
/* ============================================================================
   Castivio — the three browse screens, running.

   Not a picture of the screens: the screens. Arrow keys and Enter move a real
   focus, a category press really loads its channels, the rail really switches
   section, and everything is drawn from the data at the bottom of this file.

   ---------------------------------------------------------------------------
   One design, three form factors

   1920x1080 is the reference and the priority — at that size every measurement
   below is exactly the approved mockup. But this build is for Android as a
   whole, so the same markup has to hold on a phone in a hand, and the shape of
   that is already decided in UI_ARCHITECTURE.md §3.4 rather than invented here:

       television   rail + categories + channels + what is on   (three panes)
       tablet       rail + categories + channels                 (two panes)
       phone        bottom bar + a row of category chips + one pane

   The third pane is the first to go because it is the only one that is a
   readout rather than a control — every fact in it is also on the channel row.
   On the phone the rail becomes a bottom bar, which is invariant 4's "one rail,
   one bottom bar" and not a second navigation pattern.

   ---------------------------------------------------------------------------
   How the sizes work

   Everything is authored in dp, exactly as the mockup was, by making 1rem equal
   one dp: `html { font-size: calc(var(--s) * 1px) }`. So `46rem` below is 46dp,
   and at a 1920-wide television --s is 2 and it lands on 92 physical pixels.
   One number, one meaning, and no second set of values to keep in step.

   ---------------------------------------------------------------------------
   Posters take real images

   `.art` is an image container with a neutral placeholder behind it. No
   gradients stand in for artwork: give an item a `poster` URL in the data and
   it appears, and until then the placeholder is honestly a placeholder rather
   than a coloured rectangle pretending to be a film.
   ========================================================================= */

:root{
  --s:2;                              /* px per dp. Set by fit() at runtime. */

  /* ground — near-black, violet-biased. Not a coloured field. */
  --ground:#0A0918; --surface:#14122A; --raised:#1C1940; --line:#262246;
  /* identity, unchanged from :core:design */
  --violet:#9B6BFF; --violet-wash:rgba(155,107,255,.16);
  --blue:#4C9BFF; --blue-wash:rgba(76,155,255,.14);
  /* status */
  --live:#FF3B5C; --amber:#FFB020;
  /* text — 7:1 and better on this ground */
  --ink:#F4F4FA; --ink-2:#B8B8CE; --ink-3:#7A7A98; --ink-4:#4A4A66;

  --r-sm:8rem; --r-md:12rem; --r-lg:16rem; --r-pill:999px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(var(--s) * 1px)}
body{
  background:var(--ground);color:var(--ink);
  font-family:"Liberation Sans","DejaVu Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;height:100vh;height:100dvh;
}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;text-align:start;cursor:pointer}
::-webkit-scrollbar{width:0;height:0}
*{scrollbar-width:none}

/* ------------------------------------------------------------------ focus */
/* A ring, a fill and a lift — three signals, so the focus survives a
   colour-blind viewer, a washed-out panel and a photograph of the screen.
   `outline` rather than `border`, so nothing reflows when focus arrives. */
.f{outline:2rem solid var(--violet);outline-offset:-1rem;
  background:var(--violet-wash);
  box-shadow:0 0 0 4rem rgba(155,107,255,.14), 0 10rem 26rem rgba(0,0,0,.6)}
@media (prefers-reduced-motion:no-preference){
  .nav,.cat,.chan,.card,.chip{transition:background-color 120ms ease-out}
}

/* =============================================================== the shell */
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}

/* ------------------------------------------------------------------- rail */
/* Fixed width, always labelled, never animated. It is the one part of the
   screen in the same place in every section, which is what lets the remote's
   LEFT key mean one thing everywhere. */
.rail{
  width:176rem;flex:0 0 auto;background:var(--surface);
  border-inline-end:1px solid var(--line);
  padding:26rem 14rem;display:flex;flex-direction:column;gap:3rem;
}
.brand{display:flex;align-items:center;gap:8rem;padding:0 8rem;margin-bottom:22rem}
.brand svg{width:20rem;height:20rem;flex:0 0 auto}
.brand b{font-size:15rem;font-weight:700;letter-spacing:.13em;color:var(--violet)}
.nav{
  display:flex;align-items:center;gap:11rem;width:100%;
  height:40rem;padding:0 10rem;border-radius:var(--r-sm);
  color:var(--ink-3);font-size:13.5rem;position:relative;
}
.nav svg{width:19rem;height:19rem;flex:0 0 auto;fill:currentColor}
.nav[aria-current="page"]{background:var(--violet-wash);color:var(--ink);font-weight:600}
.nav[aria-current="page"]::before{
  content:"";position:absolute;inset-inline-start:0;top:9rem;bottom:9rem;width:3rem;
  border-radius:var(--r-pill);background:var(--violet);
}
.rail .spacer{flex:1}
.rail .foot{font-size:10.5rem;color:var(--ink-4);padding:0 10rem}

/* ------------------------------------------------------------------ stage */
.stage{flex:1;min-width:0;display:flex;flex-direction:column;
  padding:26rem 28rem 24rem 24rem}
.head{display:flex;align-items:baseline;gap:11rem;margin-bottom:16rem}
.head h1{font-size:22rem;font-weight:700;letter-spacing:-.01em}
.head .count{font-size:12.5rem;color:var(--ink-3)}
.head .right{margin-inline-start:auto;display:flex;align-items:center;gap:10rem;
  font-size:12rem;color:var(--ink-2)}
.pill{display:flex;align-items:center;gap:6rem;padding:4rem 11rem;
  border-radius:var(--r-pill);background:var(--raised);border:1px solid var(--line);
  font-size:11.5rem}
.dot{width:6rem;height:6rem;border-radius:50%;background:var(--live);flex:0 0 auto}

/* ------------------------------------------------------------------ panes */
.panes{display:flex;gap:14rem;flex:1;min-height:0}
.pane{display:flex;flex-direction:column;min-height:0}
.pane-title{font-size:10rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-4);margin-bottom:8rem;padding:0 2rem;flex:0 0 auto}
.scroll{overflow-y:auto;flex:1;min-height:0;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){.scroll{scroll-behavior:auto}}

/* categories — the same pane in all three sections */
.cats{width:196rem;flex:0 0 auto}
.cat{display:flex;align-items:center;width:100%;height:40rem;padding:0 11rem;
  border-radius:var(--r-sm);font-size:13rem;color:var(--ink-2)}
.cat .n{margin-inline-start:auto;font-size:11.5rem;color:var(--ink-4)}
.cat[aria-selected="true"]{background:var(--raised);color:var(--ink);font-weight:600}
.cat[aria-selected="true"] .n{color:var(--ink-2)}

/* chips — the phone's categories, the same list turned on its side */
.chips{display:none;gap:8rem;overflow-x:auto;padding-bottom:12rem;flex:0 0 auto}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:7rem;height:36rem;
  padding:0 14rem;border-radius:var(--r-pill);background:var(--surface);
  border:1px solid var(--line);color:var(--ink-2);font-size:13rem;white-space:nowrap}
.chip .n{font-size:11rem;color:var(--ink-4)}
.chip[aria-selected="true"]{background:var(--raised);color:var(--ink);font-weight:600;
  border-color:var(--violet)}

/* ----------------------------------------------------------- live: channels */
/* Two lines, not one. A channel name and what is on it will not both fit on a
   line this wide, and the half that gets truncated is the half that answers the
   question. Stacked, both are whole, and 46dp still clears the D-pad minimum. */
.chans{flex:1;min-width:0}
.chan{display:flex;align-items:center;gap:12rem;width:100%;height:46rem;
  padding:0 12rem;border-radius:var(--r-sm);color:var(--ink-2)}
.chan .no{font-size:11.5rem;font-weight:700;color:var(--blue);
  background:var(--blue-wash);padding:3rem 7rem;border-radius:var(--r-sm);
  min-width:50rem;text-align:center;flex:0 0 auto}
.chan .body{flex:1;min-width:0}
.chan .line{display:flex;align-items:center;gap:7rem}
.chan .nm{font-size:13.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan .pg{font-size:11rem;color:var(--ink-4);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:2rem}
.chan .q{font-size:9rem;font-weight:700;color:var(--ink-3);border:1px solid var(--line);
  padding:1rem 4rem;border-radius:4rem;flex:0 0 auto}
.chan[data-playing="true"]{background:var(--raised);color:var(--ink)}
.chan[data-playing="true"] .pg{color:var(--ink-2)}

/* ----------------------------------------------------------- live: on now */
.onnow{width:222rem;flex:0 0 auto}
.still{height:125rem;border-radius:var(--r-md);position:relative;overflow:hidden;
  background:var(--raised);flex:0 0 auto}
.still .tag{position:absolute;inset-inline-start:9rem;top:9rem;display:flex;
  align-items:center;gap:5rem;background:rgba(6,6,14,.76);padding:3rem 9rem;
  border-radius:var(--r-pill);font-size:10rem;font-weight:600;letter-spacing:.04em}
.still .res{position:absolute;inset-inline-end:9rem;bottom:9rem;font-size:10rem;
  color:var(--ink-2);background:rgba(6,6,14,.76);padding:2rem 7rem;border-radius:var(--r-sm)}
.prog{margin-top:13rem}
.prog .t{font-size:14rem;font-weight:700;line-height:1.25}
.prog .bar{display:flex;align-items:center;gap:8rem;margin:8rem 0 7rem;
  font-size:10.5rem;color:var(--ink-3)}
.track{flex:1;height:3rem;border-radius:2rem;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--violet)}
.prog .d{font-size:11.5rem;color:var(--ink-3);line-height:1.45}
.next{margin-top:13rem;padding-top:11rem;border-top:1px solid var(--line)}
.next .lbl{font-size:9.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4)}
.next .t{font-size:12.5rem;color:var(--ink-2);margin-top:4rem}

/* --------------------------------------------------- movies & series: grid */
/* `align-items:start` and a stated row height, both deliberately. A grid item
   stretches to its row by default, and a stretched card let the poster swallow
   the space the title stands in. The row is stated rather than derived so every
   row is the same height whether a title wraps to one line or two. */
.gridwrap{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(var(--cols,5),1fr);gap:13rem;
  align-content:start;align-items:start;grid-auto-rows:195rem}
.card{width:100%;border-radius:var(--r-md)}
.art{aspect-ratio:2/3;border-radius:var(--r-md);position:relative;overflow:hidden;
  background:var(--raised);display:grid;place-items:center}
.art img{width:100%;height:100%;object-fit:cover;display:block;
  grid-area:1/1;position:relative;z-index:1}
/* The placeholder. Sits under the image, so a real poster simply covers it. */
.art .ph{grid-area:1/1;width:34%;height:34%;opacity:.13;fill:var(--ink)}
.art .badge{position:absolute;inset-inline-start:6rem;top:6rem;font-size:9rem;
  font-weight:700;background:rgba(6,6,14,.78);color:var(--ink-2);padding:2rem 6rem;
  border-radius:5rem;z-index:2}
.art .seasons{position:absolute;inset-inline-end:6rem;bottom:6rem;font-size:9.5rem;
  font-weight:700;background:rgba(6,6,14,.8);color:var(--ink);padding:2rem 7rem;
  border-radius:var(--r-pill);z-index:2}
.art .resume{position:absolute;inset-inline:0;bottom:0;height:3rem;
  background:rgba(0,0,0,.5);z-index:2}
.art .resume i{display:block;height:100%;background:var(--amber)}
.card .nm{font-size:12rem;color:var(--ink-2);margin-top:7rem;line-height:1.32;
  height:32rem;overflow:hidden}
.card .meta{font-size:10.5rem;color:var(--ink-4)}
.card[data-on="true"] .nm{color:var(--ink);font-weight:600}

/* ------------------------------------------------------------ empty state */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8rem;color:var(--ink-3);text-align:center;padding:24rem}
.empty b{font-size:15rem;color:var(--ink-2);font-weight:600}
.empty span{font-size:12rem;max-width:280rem;line-height:1.5}

/* ========================================================== tablet: two panes */
/* The third pane goes first because it is the only one that is a readout: every
   fact in it is already on the channel row. */
body[data-mode="tablet"] .onnow{display:none}

/* ============================================== phone: one pane, bottom bar */
body[data-mode="phone"] .app{flex-direction:column}
body[data-mode="phone"] .rail{
  width:100%;flex:0 0 auto;order:2;flex-direction:row;gap:0;
  border-inline-end:0;border-top:1px solid var(--line);
  padding:6rem 4rem calc(6rem + env(safe-area-inset-bottom));
}
body[data-mode="phone"] .brand,
body[data-mode="phone"] .rail .spacer,
body[data-mode="phone"] .rail .foot,
body[data-mode="phone"] .cats,
body[data-mode="phone"] .onnow{display:none}
body[data-mode="phone"] .nav{
  flex:1;flex-direction:column;gap:3rem;height:auto;padding:6rem 2rem;
  font-size:9.5rem;justify-content:center;
}
body[data-mode="phone"] .nav svg{width:20rem;height:20rem}
body[data-mode="phone"] .nav[aria-current="page"]::before{display:none}
/* Five destinations fit a phone's bottom bar; the rest live behind the fifth.
   Six was tried and the labels started truncating in German. */
body[data-mode="phone"] .nav[data-overflow="true"]{display:none}
body[data-mode="phone"] .stage{order:1;padding:calc(14rem + env(safe-area-inset-top)) 14rem 8rem}
body[data-mode="phone"] .head{margin-bottom:12rem}
body[data-mode="phone"] .head h1{font-size:19rem}
body[data-mode="phone"] .head .count{display:none}
body[data-mode="phone"] .chips{display:flex}
body[data-mode="phone"] .panes{flex-direction:column;gap:0}
body[data-mode="phone"] .pane-title{display:none}
body[data-mode="phone"] .chan{height:52rem}
body[data-mode="phone"] .chan .nm{font-size:14rem}
body[data-mode="phone"] .chan .pg{font-size:11.5rem}
body[data-mode="phone"] .grid{--cols:3;gap:11rem;grid-auto-rows:184rem}
</style>
</head>

<div class="app">

      <div class="right">
        <span class="pill" id="mode"></span>
        <span class="num" id="clock"></span>
      </div>
    </header>

    <div class="chips" id="chips" role="tablist" aria-label="Categories"></div>

    <div class="panes">
      <section class="pane cats" aria-label="Categories">
        <div class="pane-title">Categories</div>
        <div class="scroll" id="cats" role="listbox"></div>
      </section>

      <section class="pane chans" id="contentPane" aria-live="polite">
        <div class="pane-title" id="contentTitle"></div>
        <div class="scroll" id="content"></div>
      </section>

      <aside class="pane onnow" id="onnowPane" aria-label="On now">
        <div class="pane-title">On now</div>
        <div id="onnow"></div>
      </aside>
    </div>
  </main>
</div>

/* Sections the provider does not carry are still destinations. UI_ARCHITECTURE
   §3.4: they are never hidden, and the screen says whose gap it is. */
const EMPTY = {
  home:    {title:'Home',       total:'', why:'Home is not part of this prototype.'},
  radio:   {title:'Radio',      total:'', why:'Nova IPTV carries no radio stations.'},
  fav:     {title:'Favourites', total:'', why:'Nothing has been marked as a favourite yet.'},
  search:  {title:'Search',     total:'', why:'Search is not part of this prototype.'},
  settings:{title:'Settings',   total:'', why:'Settings is not part of this prototype.'},
};

/* =========================================================================== */

const $ = id => document.getElementById(id);
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};
const svg = (path, size) =>
  `<svg viewBox="0 0 24 24" ${size ? `width="${size}" height="${size}"` : ''} aria-hidden="true"><path d="${path}"/></svg>`;

const state = {
  section:'live',
  cat:4,               // UK Documentary, as in the approved design
  playing:28128,       // the channel the On now panel is describing
  column:'content',    // 'rail' | 'cats' | 'content'
  mode:'tv',
};

/* --------------------------------------------------------------- the scale */
/* One number decides both the form factor and the size of a dp. 1920x1080 is
   the reference: there --s is exactly 2, and every measurement in the CSS lands
   on the pixel the mockup was approved at. */
function fit(){
  const w = window.innerWidth, h = window.innerHeight;
  let mode, s;
  if (w >= 1100 && w / h >= 1.4) {          // television, and a desktop window
    mode = 'tv';
    s = Math.min(w / 960, h / 540);
  } else if (w >= 700) {                     // tablet, either way up
    mode = 'tablet';
    s = Math.min(w / 800, h / 600, 1.5);
  } else {                                   // phone
    mode = 'phone';
    s = Math.max(0.85, Math.min(w / 412, 1.25));
  }
  document.documentElement.style.setProperty('--s', s.toFixed(4));
  // Written every time, not only on a change. It starts equal to the initial
  // state, so a "change only" write left the television with no data-mode at
  // all -- which worked only because television is the unqualified default, and
  // would stop working the day anyone wrote a [data-mode="tv"] rule.
  state.mode = mode;
  document.body.dataset.mode = mode;
  columns();
}

/* The grid's column count is the one thing that cannot come from a media query,
   because the pane it lives in is what got narrower, not the window. */
function columns(){
  const grid = document.querySelector('.grid');
  if (!grid) return;
  grid.style.setProperty('--cols', state.mode === 'phone' ? 3 : state.mode === 'tablet' ? 4 : 5);
}

/* ----------------------------------------------------------------- the rail */
function drawRail(){
  const rail = $('rail');
  rail.replaceChildren();

  const brand = el('div','brand',
    `<svg viewBox="0 0 24 24" fill="#9B6BFF" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7z" opacity=".35"/><path d="M12 6.5 7 9.3v5.4l5 2.8 5-2.8V9.3z"/></svg><b>CASTIVIO</b>`);
  rail.append(brand);

  RAIL.forEach(item => {
    if (item.foot) rail.append(el('div','spacer'));
    const b = el('button','nav', svg(ICON[item.icon]) + `<span>${item.label}</span>`);
    b.dataset.id = item.id;
    b.dataset.overflow = item.overflow ? 'true' : 'false';
    if (item.id === state.section) b.setAttribute('aria-current','page');
    b.addEventListener('click', () => { open(item.id); focusTo('content'); });
    rail.append(b);
  });

  rail.append(el('div','foot','Nova IPTV · 338 days'));
}

/* --------------------------------------------------------------- the screen */
function section(){ return DATA[state.section] || null; }
function categories(){ const s = section(); return s ? s.categories : []; }
function category(){ return categories()[state.cat] || null; }

function draw(){
  const s = section();
  const empty = EMPTY[state.section];

  $('title').textContent = s ? s.title : empty.title;
  $('count').textContent = s ? s.total : '';

  const badge = $('mode');
  badge.replaceChildren();
  if (s) {
    if (s.badge.live) badge.append(el('i','dot'));
    badge.append(document.createTextNode(s.badge.text));
    badge.style.display = '';
  } else {
    badge.style.display = 'none';
  }

  drawRail();
  drawCats();
  drawContent();
  drawOnNow();
  columns();
}

function drawCats(){
  const cats = $('cats'), chips = $('chips');
  cats.replaceChildren(); chips.replaceChildren();
  const list = categories();
  document.querySelector('.cats').style.display = list.length ? '' : 'none';

  list.forEach((c, i) => {
    const pick = () => { state.cat = i; drawContent(); drawOnNow(); focusTo('content'); };

    const b = el('button','cat', `<span>${c.name}</span><span class="n num">${c.count.toLocaleString('en')}</span>`);
    b.setAttribute('role','option');
    b.setAttribute('aria-selected', i === state.cat ? 'true' : 'false');
    b.addEventListener('click', pick);
    cats.append(b);

    const chip = el('button','chip', `<span>${c.name}</span><span class="n num">${c.count.toLocaleString('en')}</span>`);
    chip.setAttribute('role','tab');
    chip.setAttribute('aria-selected', i === state.cat ? 'true' : 'false');
    chip.addEventListener('click', pick);
    chips.append(chip);
  });

  // The chip row is the phone's category pane, and a pane that opens scrolled
  // away from the selected item is a pane that looks like it selected nothing.
  const sel = chips.children[state.cat];
  if (sel) sel.scrollIntoView({block:'nearest', inline:'center'});
}

function drawContent(){
  const box = $('content'), cat = category(), s = section();
  box.replaceChildren();

  if (!s) {
    $('contentTitle').textContent = '';
    box.append(el('div','empty',
      `<b>${EMPTY[state.section].title}</b><span>${EMPTY[state.section].why}</span>`));
    return;
  }

  $('contentTitle').textContent = state.section === 'live'
    ? `${cat.name} · ${cat.count.toLocaleString('en')} channels`
    : `${cat.name} · ${cat.count.toLocaleString('en')} titles`;

  if (state.section === 'live') {
    cat.channels.forEach(c => box.append(channelRow(c)));
  } else {
    const grid = el('div','grid');
    cat.items.forEach(item => grid.append(card(item)));
    box.append(grid);
  }
  // Selecting a category also re-marks the selected chip and pane row.
  [...$('cats').children].forEach((n,i) => n.setAttribute('aria-selected', i === state.cat));
  [...$('chips').children].forEach((n,i) => n.setAttribute('aria-selected', i === state.cat));
}

function channelRow(c){
  const b = el('button','chan',
    `<span class="no num">${c.no}</span>
     <span class="body">
       <span class="line"><span class="nm">${c.nm}</span>${c.q ? `<span class="q">${c.q}</span>` : ''}</span>
       <span class="pg">${c.pg} · ${c.from} – ${c.to}</span>
     </span>`);
  b.dataset.no = c.no;
  b.dataset.playing = c.no === state.playing ? 'true' : 'false';
  b.addEventListener('click', () => play(c.no));
  return b;
}

function card(item){
  const b = el('button','card');
  const art = el('div','art');
  if (item.poster) {
    const img = el('img');
    img.src = item.poster; img.alt = '';
    img.addEventListener('error', () => img.remove());
    art.append(img);
  }
  art.insertAdjacentHTML('afterbegin',
    `<svg class="ph" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON.movies}"/></svg>`);
  if (item.watched) art.append(el('span','badge','WATCHED'));
  if (item.seasons) art.append(el('span','seasons num', item.seasons === 1 ? '1 season' : `${item.seasons} seasons`));
  if (item.resume) art.insertAdjacentHTML('beforeend',
    `<span class="resume"><i style="width:${Math.round(item.resume*100)}%"></i></span>`);

  b.append(art);
  b.append(el('div','nm', item.t));
  b.append(el('div','meta num', item.sub || (item.run ? `${item.y} · ${item.run}` : `${item.y}`)));
  b.addEventListener('click', () => { /* detail is a later screen; selection only */ });
  return b;
}

function drawOnNow(){
  const pane = $('onnowPane'), box = $('onnow');
  if (state.section !== 'live') { pane.style.display = 'none'; return; }
  pane.style.display = '';
  const cat = category();
  const c = cat.channels.find(x => x.no === state.playing) || cat.channels[0];
  box.replaceChildren();
  box.insertAdjacentHTML('beforeend', `
    <div class="still">
      <div class="tag"><i class="dot"></i>LIVE</div>
      <div class="res num">1024 × 576</div>
    </div>
    <div class="prog">
      <div class="t">${c.pg}</div>
      <div class="bar">
        <span class="num">${c.from}</span>
        <span class="track"><i style="width:${progress(c)}%"></i></span>
        <span class="num">${c.to}</span>
      </div>
      <div class="d">${c.desc}</div>
    </div>
    <div class="next">
      <div class="lbl">Next · ${c.to}</div>
      <div class="t">${c.next}</div>
    </div>`);
}

/* Where the programme has got to, from the clock, so the bar is never a guess. */
function progress(c){
  const mins = t => { const [h,m] = t.split(':').map(Number); return h*60 + m; };
  const now = new Date(), at = now.getHours()*60 + now.getMinutes();
  const a = mins(c.from), b = mins(c.to);
  if (b <= a || at <= a) return 0;
  return Math.max(0, Math.min(100, Math.round((at - a) / (b - a) * 100)));
}

function play(no){
  state.playing = no;
  [...$('content').children].forEach(n => {
    if (n.dataset) n.dataset.playing = n.dataset.no === String(no) ? 'true' : 'false';
  });
  drawOnNow();
}

function open(id){
  state.section = id;
  state.cat = 0;
  if (id === 'live') state.playing = DATA.live.categories[0].channels[0].no;
  draw();
}

/* ====================================================================== D-pad */
/* Three columns, and the panes are the columns. LEFT and RIGHT move between
   them, UP and DOWN move inside one. The On now panel is not in the rotation:
   it is a readout with nothing to press, and a focus stop that does nothing is
   a stop that makes every journey past it longer. */

function items(column){
  if (column === 'rail')    return [...$('rail').querySelectorAll('.nav')]
                                   .filter(n => getComputedStyle(n).display !== 'none');
  if (column === 'cats')    return state.mode === 'phone'
                                   ? [...$('chips').children] : [...$('cats').children];
  return [...$('content').querySelectorAll('.chan, .card')];
}

function focusTo(column, index){
  const list = items(column);
  if (!list.length) {
    if (column !== 'rail') return focusTo('rail');
    return;
  }
  state.column = column;
  const i = Math.max(0, Math.min(index == null ? indexIn(list) : index, list.length - 1));
  list[i].focus({preventScroll:true});
  list[i].scrollIntoView({block:'nearest', inline:'nearest'});
}

/* Where the focus should land when a column is entered: the selected row if the
   column has one, otherwise the first. Arriving somewhere arbitrary is how a
   remote starts to feel unpredictable. */
function indexIn(list){
  const sel = list.findIndex(n =>
    n.getAttribute('aria-selected') === 'true' ||
    n.getAttribute('aria-current') === 'page' ||
    n.dataset.playing === 'true');
  return sel < 0 ? 0 : sel;
}

function current(){
  const list = items(state.column);
  return {list, i: list.indexOf(document.activeElement)};
}

/* The grid is the one place UP and DOWN move by a row rather than by one. */
function gridCols(){
  const grid = document.querySelector('.grid');
  if (!grid) return 1;
  return getComputedStyle(grid).gridTemplateColumns.split(' ').length;
}

document.addEventListener('keydown', e => {
  const key = e.key;
  const nav = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' ','Escape','Backspace'];
  if (!nav.includes(key)) return;

  const {list, i} = current();
  const inGrid = state.column === 'content' && document.querySelector('.grid');
  const cols = inGrid ? gridCols() : 1;
  const horizontal = state.mode === 'phone' && state.column === 'cats';

  let handled = true;
  switch (key) {
    case 'ArrowDown':
      if (horizontal) { focusTo('content'); break; }
      focusTo(state.column, i < 0 ? 0 : Math.min(i + cols, list.length - 1));
      break;

    case 'ArrowUp':
      if (horizontal) break;
      if (state.column === 'content' && i - cols < 0 && state.mode === 'phone') { focusTo('cats'); break; }
      focusTo(state.column, Math.max(i - cols, 0));
      break;

    case 'ArrowRight':
      if (horizontal) { focusTo('cats', Math.min(i + 1, list.length - 1)); break; }
      if (inGrid && i % cols < cols - 1 && i + 1 < list.length) { focusTo('content', i + 1); break; }
      if (state.column === 'rail') focusTo(items('cats').length ? 'cats' : 'content');
      else if (state.column === 'cats') focusTo('content');
      else handled = false;
      break;

    case 'ArrowLeft':
      if (horizontal) { focusTo('cats', Math.max(i - 1, 0)); break; }
      if (inGrid && i % cols > 0) { focusTo('content', i - 1); break; }
      if (state.column === 'content') focusTo(items('cats').length ? 'cats' : 'rail');
      else if (state.column === 'cats') focusTo('rail');
      else handled = false;
      break;

    case 'Enter': case ' ':
      if (document.activeElement && document.activeElement.click) document.activeElement.click();
      break;

    case 'Escape': case 'Backspace':
      focusTo('rail');
      break;
  }
  if (handled) e.preventDefault();
});

/* Touch and a mouse move the focus too, so the highlight is never somewhere the
   finger is not. */
document.addEventListener('focusin', e => {
  const n = e.target;
  if (n.closest('#rail')) state.column = 'rail';
  else if (n.closest('#cats, #chips')) state.column = 'cats';
  else if (n.closest('#content')) state.column = 'content';
});
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('button');
  if (b) b.focus({preventScroll:true});
});

/* The focus ring is drawn by us rather than by the browser, so that it is the
   same shape on a television, a tablet and a phone. */
const style = document.createElement('style');
style.textContent = `
  .nav:focus,.cat:focus,.chan:focus,.card:focus,.chip:focus{outline:none}
  .nav:focus-visible,.cat:focus-visible,.chan:focus-visible,
  .card:focus-visible,.chip:focus-visible{
    outline:2rem solid var(--violet);outline-offset:-1rem;
    background:var(--violet-wash);
    box-shadow:0 0 0 4rem rgba(155,107,255,.14), 0 10rem 26rem rgba(0,0,0,.6);
  }
  .card:focus-visible{outline-offset:3rem;background:transparent;
    box-shadow:0 0 0 4rem rgba(155,107,255,.14), 0 10rem 26rem rgba(0,0,0,.6)}
  .card:focus-visible .nm{color:var(--ink);font-weight:600}`;
document.head.append(style);

function clock(){
  const d = new Date();
  $('clock').textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

window.addEventListener('resize', fit);
fit();
draw();
clock();
setInterval(clock, 20000);
focusTo('content');
</script>
</body>
</html>
