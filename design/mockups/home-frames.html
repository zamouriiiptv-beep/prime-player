<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Castivio — Home at four frames</title>
<style>
/* ============================================================================
   Home, as `HomeScreen.kt` now composes it, at all four frames.

   ## This page runs the screen's own arithmetic

   Every band below is produced by the same expression the code uses — the frame
   table from `CastivioFrame`, the stage measured out of the surface, the
   disclaimer dropped when what is left would take a card under its floor. The
   frames are laid out by that arithmetic rather than drawn by eye, so if a band
   does not add up to its stage this page says so instead of looking fine.

   ## What changed, and why

   | On the device | Here |
   |---|---|
   | 2×2 of 188dp cards on a 393dp handset, half the screen past the fold | every band measured out of the stage; nothing scrolls |
   | four coloured rectangles standing in for artwork | the section's glyph on its own hue, from the theme's disc recipe |
   | a 60dp bottom bar eating a sixth of a landscape phone | the rail, on every frame |
   | content drawn under the system's side navigation | `safeDrawing`, not `statusBars` |

   The card turns with the shape it is given: one row of four on a set or a
   tablet and the plate sits above the name; two rows of two on a handset and the
   plate sits beside it. One card, two aspects.
   ========================================================================= */
@font-face{font-family:"Castivio Sans";font-weight:400;src:url("../../core/design/src/main/res/font/inter_regular.ttf") format("truetype")}
@font-face{font-family:"Castivio Sans";font-weight:600;src:url("../../core/design/src/main/res/font/inter_semibold.ttf") format("truetype")}
@font-face{font-family:"Castivio Sans";font-weight:700;src:url("../../core/design/src/main/res/font/inter_bold.ttf") format("truetype")}
@font-face{font-family:"Castivio Arabic";font-weight:400;src:url("../../core/design/src/main/res/font/plex_arabic_regular.ttf") format("truetype")}
@font-face{font-family:"Castivio Arabic";font-weight:600;src:url("../../core/design/src/main/res/font/plex_arabic_semibold.ttf") format("truetype")}
@font-face{font-family:"Castivio Arabic";font-weight:700;src:url("../../core/design/src/main/res/font/plex_arabic_bold.ttf") format("truetype")}

:root{
  --white:#FFFFFF;
  --strong:#F2F2F8;      /* onBackgroundStrong */
  --text:#E8E8F4;        /* onBackground      */
  --variant:#C9C9DA;     /* onBackgroundVariant */
  --muted:#A6A6BF;       /* onBackgroundMuted */
  --violet:#9B6BFF;      /* Violet50 / hueViolet */
  --azure:#4C9BFF;       /* Azure50  / hueAzure  */
  --green:#3DD68C;       /* Success  / hueGreen  */
  --amber:#FFB020;       /* Amber    / hueAmber  */
  --primary:#6FB2FF;     /* Azure60  */
  --danger:#FF5A5A;
  --glass-hi:rgba(255,255,255,.078);
  --glass-lo:rgba(255,255,255,.039);
  --edge:rgba(126,140,255,.28);
  --rim:inset 0 1px 0 rgba(255,255,255,.08);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#07070E}
body{font-family:"Castivio Sans","Castivio Arabic","Noto Sans",sans-serif;
  color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}

.page{padding:22px 20px 40px}
.rail-note{margin:0 auto 10px;direction:rtl}
.rail-note h2{font-size:17px;font-weight:700;color:#F2F0FF;line-height:1.4}
.rail-note p{font-size:12.5px;line-height:1.7;color:#9C9CBC;margin-top:3px;
  font-variant-numeric:tabular-nums}
.foot{max-width:1000px;margin:26px auto 0;direction:rtl;
  font-size:12.5px;line-height:1.9;color:#77779A}
.foot b{color:#B9B9D4}
.foot .miss{color:var(--amber)}

.frame{position:relative;overflow:hidden;margin:0 auto 28px;border-radius:6px}
.frame canvas.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.shell{position:absolute;inset:0;display:flex}

/* --------------------------------------------------------------- the rail */
.rail{flex:0 0 auto;align-self:flex-start;
  background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));
  border:1px solid var(--edge);box-shadow:var(--rim)}
.rail .item{display:flex;align-items:center}
.rail .bar{border-radius:99px;background:transparent}
.rail .item.on .bar{background:var(--primary)}
.rail svg{display:block;color:var(--muted)}
.rail .item.on svg{color:var(--primary)}

/* -------------------------------------------------------------- the stage */
.stage{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}

/* physical, in both directions — the lockup sits where every other
   screen's header puts it */
.head{flex:0 0 auto;display:flex;align-items:center;direction:ltr}
.lockup{display:flex;flex-direction:column;justify-content:center;flex:0 0 auto}
.mark-row{display:flex;align-items:center;direction:ltr}
.mark{display:block;filter:drop-shadow(0 2px 9px rgba(96,72,255,.5))}
.word{font-family:"Castivio Sans",sans-serif;font-weight:700;line-height:1;
  letter-spacing:.05em;
  background-image:linear-gradient(180deg,#FFFFFF 0%,#D8D8EC 52%,#9C9CC4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--violet);font-weight:600;line-height:1.35;white-space:nowrap;direction:rtl;text-align:left}

.lic{flex:0 0 auto;display:flex;align-items:center;
  background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo))}
.lic svg{flex:0 0 auto;display:block}
.lic .k{color:var(--muted);line-height:1.3;white-space:nowrap;direction:rtl;text-align:left}
.lic .v{font-weight:700;line-height:1.3;white-space:nowrap;direction:rtl;text-align:left}

.grow{flex:1 1 auto}
.themechip{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:var(--glass-lo);border:1px solid var(--edge);
  color:var(--variant)}
.clock{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;direction:ltr}
.clock b{color:var(--strong);font-weight:700;line-height:1.15;
  font-variant-numeric:tabular-nums}
.clock span{color:var(--muted);line-height:1.35;white-space:nowrap}

/* -------------------------------------------------------------- the cards */
.cards{flex:0 0 auto;display:flex;flex-direction:column}
.cardrow{display:flex}
.card{flex:1 1 0;min-width:0;display:flex;
  background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));
  border:1px solid var(--edge);box-shadow:var(--rim)}
.card.focus{border-color:var(--primary);
  box-shadow:0 0 0 1px var(--primary),0 0 26px rgba(46,107,255,.36),var(--rim)}
.card.stack{flex-direction:column;align-items:center}
.card.wide{flex-direction:row;align-items:center}
.plate{flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.card.stack .plate{width:100%;flex:1 1 auto}
.labels{min-width:0;display:flex;flex-direction:column;justify-content:center}
.card.stack .labels{width:100%;text-align:center}
.card.wide .labels{flex:1 1 auto;text-align:start}
.labels .n{color:var(--strong);font-weight:600;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.labels .c{line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ------------------------------------------------------------ the actions */
.acts{flex:0 0 auto;display:flex}
.act{flex:1 1 0;min-width:0;display:flex;align-items:center;
  background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));
  border:1px solid var(--edge);box-shadow:var(--rim)}
.act svg{flex:0 0 auto;display:block;color:var(--violet)}
.act .tx{min-width:0;display:flex;flex-direction:column;justify-content:center}
.act b{color:var(--text);font-weight:600;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act span{color:var(--muted);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* -------------------------------------------------- the strip and the line */
.strip{flex:0 0 auto;display:flex;align-items:center;
  background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));
  border:1px solid var(--edge);box-shadow:var(--rim)}
.fact{flex:1 1 0;min-width:0;display:flex;align-items:center}
.fact svg{flex:0 0 auto;display:block}
.fact span{color:var(--variant);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legal{flex:0 0 auto;display:flex;align-items:center}
.legal svg{flex:0 0 auto;display:block;color:var(--violet)}
.legal span{color:var(--muted);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>

<div class="page" id="out"></div>
<div class="foot" id="foot"></div>

<script>
/* ------------------------------------------------------------------ icons */
var K = 'fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"';
function svg(d, w, sw) {
  return '<svg viewBox="0 0 24 24" width="' + w + '" height="' + w + '" ' + K +
         ' stroke-width="' + (sw || 1.8) + '">' + d + '</svg>';
}
var P = {
  live:'<rect x="2.4" y="4.6" width="19.2" height="13.4" rx="2.4"/><path d="M8.4 21.4h7.2"/><path d="M10.2 9.2v4.6l4.2-2.3z"/>',
  movie:'<rect x="2.6" y="7.4" width="18.8" height="12.4" rx="2.2"/><path d="M3.4 7.4l3-4.2 3.4 4.2M10.4 7.4l3-4.2 3.4 4.2M17.4 7.4l2.6-3.6"/>',
  series:'<rect x="2.4" y="6.6" width="19.2" height="13.2" rx="2.6"/><path d="M8.2 2.8L12 6.6l3.8-3.8"/><path d="M9.4 13.4l1.9 1.9 3.5-3.9"/>',
  radio:'<circle cx="12" cy="12.6" r="2.6"/><path d="M8 8.6a5.6 5.6 0 0 0 0 8M16 8.6a5.6 5.6 0 0 1 0 8"/><path d="M5.1 5.6a9.8 9.8 0 0 0 0 14M18.9 5.6a9.8 9.8 0 0 1 0 14"/>',
  check:'<circle cx="12" cy="12" r="9.2"/><path d="M7.9 12.3l2.8 2.8L16.2 9.6"/>',
  cal:'<rect x="3.2" y="5" width="17.6" height="15.8" rx="3"/><path d="M8 2.8v4.4M16 2.8v4.4M3.2 10.4h17.6"/>',
  add:'<path d="M3 6.5h12M3 12h12M3 17.5h8"/><path d="M18 13.5v7M14.5 17h7"/>',
  search:'<circle cx="11" cy="11" r="6.6"/><path d="M15.8 15.8L20.6 20.6"/>',
  badge:'<path d="M12 2.8l7.4 2.8v5.9c0 4.5-3.1 8.6-7.4 9.7-4.3-1.1-7.4-5.2-7.4-9.7V5.6z"/><path d="M9.2 12.1l2 2 3.6-4"/>',
  gear:'<circle cx="12" cy="12" r="3.1"/><path d="M12 2.6v2.6M12 18.8v2.6M21.4 12h-2.6M5.2 12H2.6M18.6 5.4l-1.8 1.8M7.2 16.8l-1.8 1.8M18.6 18.6l-1.8-1.8M7.2 7.2 5.4 5.4"/>',
  chip:'<rect x="6.6" y="6.6" width="10.8" height="10.8" rx="2"/><path d="M9.6 3v3.6M14.4 3v3.6M9.6 17.4V21M14.4 17.4V21M3 9.6h3.6M3 14.4h3.6M17.4 9.6H21M17.4 14.4H21"/>',
  lock:'<rect x="4.6" y="10.2" width="14.8" height="10.2" rx="2.4"/><path d="M8.2 10.2V7.8a3.8 3.8 0 0 1 7.6 0v2.4"/>',
  shield:'<path d="M12 2.8l7.4 2.8v5.9c0 4.5-3.1 8.6-7.4 9.7-4.3-1.1-7.4-5.2-7.4-9.7V5.6z"/><path d="M12 8.6v4.4M12 16.2h.01"/>',
  home:'<path d="M3.6 10.4 12 3.4l8.4 7v9.2a1.4 1.4 0 0 1-1.4 1.4H5a1.4 1.4 0 0 1-1.4-1.4z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.4v2.2M12 19.4v2.2M21.6 12h-2.2M4.6 12H2.4M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6M18.8 18.8l-1.6-1.6M6.8 6.8 5.2 5.2"/>',
  lib:'<rect x="3" y="6" width="14" height="12" rx="2"/><path d="M20 8v10a2 2 0 0 1-2 2H7"/>'
};

/* --------------------------------------------------- the frame table, as-is
 *
 * `CastivioFrame.Television/Tablet/Phone/ShortPhone`, transcribed. No number
 * here is chosen by this page; changing one means changing `Frame.kt`.
 */
var FRAMES = {
  tv:    { name:'Television', W:960,  H:540, edge:46,  top:24,  bot:22,  header:54, headGap:26, brand:40, chip:44, chipPad:11, bandTop:22, radius:20, fsTitle:26, fsLabel:15.8, fsBody:13.5, fsChip:13,   target:56, rail:8 },
  tab:   { name:'Tablet',     W:1280, H:800, edge:140, top:160, bot:140, header:52, headGap:26, brand:34, chip:40, chipPad:12, bandTop:24, radius:20, fsTitle:22, fsLabel:15,   fsBody:13,   fsChip:12.5, target:48, rail:8 },
  phone: { name:'Phone',      W:873,  H:393, edge:32,  top:15,  bot:11,  header:42, headGap:24, brand:31, chip:36, chipPad:12, bandTop:10, radius:17, fsTitle:20, fsLabel:14.7, fsBody:13,   fsChip:12,   target:48, rail:8 },
  short: { name:'ShortPhone', W:800,  H:360, edge:26,  top:11,  bot:8,   header:36, headGap:20, brand:28, chip:34, chipPad:11, bandTop:8,  radius:16, fsTitle:19, fsLabel:14.1, fsBody:12.5, fsChip:11.5, target:48, rail:8 }
};

var WIDE_STAGE = 1000;   // the tablet frame's own content block
var MIN_CARD = 92;       // the floor the disclaimer gives way to
var WORD_RATIO = 0.8;
var ICON_MD = 20, ICON_SM = 16, ICON_LG = 26;

/* The rail, measured the way `CastivioNavRail` builds it: an indicator, a gap,
   an icon, the item's padding, then the card's. */
/* Nothing stands beside the stage any more: `CastivioShell` is a frame around
   content, and navigation lives on Home itself. */
function railWidth(f) { return 0; }

/* `Plan.of`, transcribed. */
function plan(f, isTv) {
  var width = f.W - railWidth(f);
  var fourAcross = true;                       /* four in a row, on every frame */
  var showLicence = isTv || width >= WIDE_STAGE;
  var rows = 1;
  var gap = f.bandTop;
  var stage = f.H - f.top - f.bot;
  var header = f.header + f.fsChip;
  var fixed = header + f.target + f.chip;
  var withLine = stage - fixed - f.chip - gap * 4;
  var without = stage - fixed - gap * 3;
  var showLine = (withLine - gap * (rows - 1)) / rows >= MIN_CARD;
  var band = showLine ? withLine : without;
  return {
    width: width, fourAcross: fourAcross, showLicence: showLicence, columns: 4, rows: rows,
    header: header, card: (band - gap * (rows - 1)) / rows, showLine: showLine,
    stage: stage,
  };
}

/* ------------------------------------------------------------- the backdrop
 * `paintBackdrop` from `Backdrop.kt`, transcribed. */
var DEEP = { stops:['#141031','#1B1038','#0A1E3D'], warm:'#6E4BD8', warmA:0.30,
             cool:'#2E6BFF', coolA:0.26, mote:'#B4D6FF', mesh:'#4C9BFF' };

function rgba(hex, a) {
  var n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
}
function paintBackdrop(cv, w, h) {
  var dpr = 2; cv.width = w * dpr; cv.height = h * dpr;
  var c = cv.getContext('2d'); c.scale(dpr, dpr);
  var lin = c.createLinearGradient(0, 0, w, h);
  DEEP.stops.forEach(function (s, i) { lin.addColorStop(i / (DEEP.stops.length - 1), s); });
  c.fillStyle = lin; c.fillRect(0, 0, w, h);
  glow(c, w * 0.05, h, w * 0.55, DEEP.warm, DEEP.warmA);
  glow(c, w * 0.95, h * 0.30, w * 0.52, DEEP.cool, DEEP.coolA);
  mesh(c, w, h, DEEP.mesh);
  motes(c, w, h, DEEP.mote);
}
function glow(c, cx, cy, r, color, alpha) {
  var g = c.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, rgba(color, alpha)); g.addColorStop(1, rgba(color, 0));
  c.fillStyle = g; c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();
}
function mesh(c, w, h, color) {
  var horizon = h * 0.40, lines = 16; c.lineWidth = 1.2;
  for (var i = 0; i <= lines; i++) {
    var t = i / lines, y = horizon + (h - horizon) * (t * t), amp = 7 + 44 * t;
    c.strokeStyle = rgba(color, 0.025 + 0.07 * t);
    c.beginPath();
    for (var s = 0; s <= 64; s++) {
      var p = s / 64, x = w * p, yy = y + amp * Math.sin(p * 11 + i * 0.6);
      if (s === 0) c.moveTo(x, yy); else c.lineTo(x, yy);
    }
    c.stroke();
  }
}
function motes(c, w, h, tint) {
  var seed = 7;
  function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
  for (var i = 0; i < 13; i++) {
    var bx = rnd(), by = rnd(); rnd();
    var r = 1.4 + rnd() * 2.2, ph = rnd();
    var tw = 0.25 + 0.55 * Math.abs(Math.sin((0.2 + ph) * 2 * Math.PI));
    c.fillStyle = rgba(tint, 0.20 * tw);
    c.beginPath(); c.arc(w * bx, h * by, r, 0, Math.PI * 2); c.fill();
  }
}

/* ---------------------------------------------------------------- the data */
var SECTIONS = [
  { k:'live',   hue:'--azure',  name:'البث المباشر', count:'1٬661 قناة',   fetched:true  },
  { k:'movie',  hue:'--violet', name:'الأفلام',      count:'لم يُحمَّل بعد', fetched:false },
  { k:'series', hue:'--green',  name:'المسلسلات',    count:'لم يُحمَّل بعد', fetched:false },
  { k:'radio',  hue:'--amber',  name:'الراديو',      count:'لم يُحمَّل بعد', fetched:false }
];
var GLYPH = { live:P.live, movie:P.movie, series:P.series, radio:P.radio };
var ACTIONS = [
  { i:P.add,    t:'تغيير الاشتراك', d:'Salmimaroc' },
  { i:P.search, t:'بحث',            d:null },
  { i:P.badge,  t:'الترخيص واللغة', d:null },
  { i:P.gear,   t:'الإعدادات',      d:null }
];
var RAIL_TV = [P.home, P.live, P.movie, P.series, P.radio, P.lib, P.search, P.gear];
var RAIL_PH = [P.home, P.live, P.lib, P.search, P.gear];

/* ------------------------------------------------------------ the drawing */
function px(v) { return v + 'px'; }

function build(key, isTv) {
  var f = FRAMES[key], p = plan(f, isTv);

  var frame = document.createElement('div');
  frame.className = 'frame';
  frame.id = 'f-' + key;
  frame.style.width = px(f.W);
  frame.style.height = px(f.H);

  var cv = document.createElement('canvas');
  cv.className = 'bg';
  frame.appendChild(cv);

  var shell = document.createElement('div');
  shell.className = 'shell';
  /* `CastivioShell` pads the rail, not the content box — the stage gets the
     whole height. Padding the shell instead is what made this page report an
     overflow the screen does not have. */
  frame.appendChild(shell);

  /* the stage */
  var stage = document.createElement('div');
  stage.className = 'stage';
  stage.style.padding = px(f.top) + ' ' + px(f.edge) + ' ' + px(f.bot);
  stage.style.gap = px(f.bandTop);
  shell.appendChild(stage);

  /* 1. the header */
  var head = document.createElement('div');
  head.className = 'head';
  head.style.height = px(p.header);
  head.style.gap = px(f.headGap);
  var lic = p.showLicence ? [
    { i:P.check, k:'الترخيص',  v:'تجربة',      c:'--green'  },
    { i:P.cal,   k:'ينتهي في', v:'16 سبتمبر 2026', c:'--violet' }
  ] : [];
  head.innerHTML =
    '<div class="lockup">' +
      '<div class="mark-row" style="gap:' + px(f.brand * 0.32) + '">' +
        '<img class="mark" src="../../core/design/src/main/res/drawable-nodpi/castivio_mark.png" ' +
             'style="width:' + px(f.brand) + ';height:' + px(f.brand) + '" alt="">' +
        '<span class="word" style="font-size:' + px(f.fsTitle * WORD_RATIO) + '">CASTIVIO</span>' +
      '</div>' +
      '<span class="tag" style="font-size:' + px(f.fsChip) + '">مشغّل IPTV متميّز</span>' +
    '</div>' +
    lic.map(function (l) {
      return '<div class="lic" style="height:' + px(f.chip + f.chipPad) +
             ';border-radius:' + px(f.radius / 2) + ';padding:0 ' + px(f.chipPad) +
             ';gap:' + px(f.chipPad / 2) + '">' +
               '<span style="color:var(' + l.c + ')">' + svg(l.i, ICON_MD) + '</span>' +
               '<span style="display:flex;flex-direction:column">' +
                 '<span class="k" style="font-size:' + px(f.fsChip) + '">' + l.k + '</span>' +
                 '<span class="v" style="font-size:' + px(f.fsLabel) + ';color:var(' + l.c + ')">' + l.v + '</span>' +
               '</span></div>';
    }).join('') +
    '<div class="grow"></div>' +
    '<div class="clock">' +
      '<b style="font-size:' + px(f.fsTitle) + '">21:36</b>' +
      '<span style="font-size:' + px(f.fsChip) + '">9 سبتمبر 2026</span>' +
    '</div>' +
    /* the trailing end of the header, where every other screen puts it */
    '<span class="themechip" style="width:' + px(f.chip) + ';height:' + px(f.chip) + '">' +
      svg(P.sun, f.fsChip * 1.3, 1.8) + '</span>';
  stage.appendChild(head);

  /* 2. the cards */
  var cards = document.createElement('div');
  cards.className = 'cards';
  cards.style.gap = px(f.bandTop);
  var groups = [];
  for (var i = 0; i < SECTIONS.length; i += p.columns) {
    groups.push(SECTIONS.slice(i, i + p.columns));
  }
  cards.innerHTML = groups.map(function (g) {
    return '<div class="cardrow" style="height:' + px(p.card) + ';gap:' + px(f.bandTop) + '">' +
      g.map(function (s, j) {
        var first = s.k === 'live';
        var plate =
          '<span class="plate" style="border-radius:' + px(f.radius / 2) +
          ';background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(' + s.hue + ') 34%, transparent), color-mix(in srgb, var(' + s.hue + ') 8%, transparent))' +
          ';border:1px solid color-mix(in srgb, var(' + s.hue + ') 46%, transparent)' +
          (p.fourAcross ? '' : ';height:' + px(p.card - f.chipPad * 2) + ';width:' + px(p.card - f.chipPad * 2)) +
          ';color:var(' + s.hue + ')">' + svg(GLYPH[s.k], f.brand, 1.6) + '</span>';
        var labels =
          '<span class="labels" style="gap:' + px(2) + '">' +
            '<span class="n" style="font-size:' + px(f.fsLabel) + '">' + s.name + '</span>' +
            '<span class="c" style="font-size:' + px(f.fsBody) + ';color:' +
              (s.fetched ? 'var(' + s.hue + ')' : 'var(--primary)') + '">' + s.count + '</span>' +
          '</span>';
        return '<div class="card ' + (p.fourAcross ? 'stack' : 'wide') + (first ? ' focus' : '') +
               '" style="border-radius:' + px(f.radius) + ';padding:' + px(f.chipPad) +
               ';gap:' + px(p.fourAcross ? f.chipPad / 2 : f.chipPad) + '">' + plate + labels + '</div>';
      }).join('') + '</div>';
  }).join('');
  stage.appendChild(cards);

  /* 3. the actions */
  var acts = document.createElement('div');
  acts.className = 'acts';
  acts.style.height = px(f.target);
  acts.style.gap = px(f.bandTop);
  acts.innerHTML = ACTIONS.map(function (a) {
    return '<div class="act" style="border-radius:' + px(f.radius / 2) +
           ';padding:0 ' + px(f.chipPad) + ';gap:' + px(f.chipPad / 2) + '">' +
             svg(a.i, ICON_MD) +
             '<span class="tx">' +
               '<b style="font-size:' + px(f.fsChip) + '">' + a.t + '</b>' +
               (a.d ? '<span style="font-size:' + px(f.fsBody) + '">' + a.d + '</span>' : '') +
             '</span></div>';
  }).join('');
  stage.appendChild(acts);

  /* 4. the device strip */
  var strip = document.createElement('div');
  strip.className = 'strip';
  strip.style.height = px(f.chip);
  strip.style.borderRadius = px(f.radius / 2);
  strip.style.padding = '0 ' + px(f.chipPad);
  strip.style.gap = px(f.headGap);
  var facts = [
    { i:P.chip,   t:'MAC: BE:DB:CA:CC:A2:4B', c:'--muted' },
    { i:P.lock,   t:'الجهاز: مُفعَّل',        c:'--green' },
    { i:P.shield, t:'الإصدار 1.0.0',          c:'--muted' }
  ];
  strip.innerHTML = facts.map(function (x) {
    return '<span class="fact" style="gap:' + px(f.chipPad / 2) + '">' +
             '<span style="color:var(' + x.c + ')">' + svg(x.i, ICON_SM) + '</span>' +
             '<span style="font-size:' + px(f.fsBody) + '">' + x.t + '</span></span>';
  }).join('');
  stage.appendChild(strip);

  /* 5. the disclaimer, when the arithmetic left room for it */
  if (p.showLine) {
    var legal = document.createElement('div');
    legal.className = 'legal';
    legal.style.height = px(f.chip);
    legal.style.gap = px(f.chipPad / 2);
    legal.innerHTML = svg(P.shield, ICON_SM) +
      '<span style="font-size:' + px(f.fsBody) + '">Castivio مشغّل وسائط. لا يوفّر قنوات ولا أفلامًا ولا اشتراكات — أنت من يضيفها.</span>';
    stage.appendChild(legal);
  }

  return { frame: frame, f: f, p: p };
}

/* ------------------------------------------------------------------- page */
(function () {
  var out = document.getElementById('out');
  var order = [['tv', true], ['tab', false], ['phone', false], ['short', false]];
  var built = [];

  order.forEach(function (o) {
    var b = build(o[0], o[1]);
    var note = document.createElement('div');
    note.className = 'rail-note';
    note.style.width = px(b.f.W);
    note.innerHTML = '<h2>' + b.f.name + ' — ' + b.f.W + '×' + b.f.H + 'dp</h2>' +
      '<p>' + (b.p.fourAcross ? 'أربع بطاقات في صفّ واحد' : 'بطاقتان × صفّان') +
      ' · ارتفاع البطاقة ' + b.p.card.toFixed(1) + 'dp · عرض المسرح ' + b.p.width + 'dp · ' +
      (b.p.showLine ? 'سطر التنويه ظاهر' : 'سطر التنويه يسقط — الحساب لم يترك له مكانًا') + '</p>';
    out.appendChild(note);
    out.appendChild(b.frame);
    built.push(b);
  });

  built.forEach(function (b) {
    paintBackdrop(b.frame.querySelector('canvas.bg'), b.f.W, b.f.H);
  });

  /* Measured, not reasoned. */
  var bad = [];
  built.forEach(function (b) {
    var stage = b.frame.querySelector('.stage');
    var over = stage.scrollHeight - stage.clientHeight;
    if (over > 1) bad.push(b.f.name + ' overflows by ' + Math.round(over));
    b.frame.querySelectorAll('.n,.c,.act b,.act span,.fact span,.legal span,.lic .v').forEach(function (n) {
      if (n.scrollWidth - n.clientWidth > 0.5) {
        bad.push(b.f.name + ' clipped: ' + n.textContent.trim().slice(0, 22));
      }
      if (n.getBoundingClientRect().height < 4) {
        bad.push(b.f.name + ' collapsed: ' + n.textContent.trim().slice(0, 22));
      }
    });
  });

  document.getElementById('foot').innerHTML =
    '<b>هذه الصفحة تشغّل حساب الشاشة نفسه:</b> جدول <b>CastivioFrame</b> كما هو، والمسرح مقسوم ' +
    'بالتعبير ذاته الموجود في <b>Plan.of</b>. الأرقام تحت كل إطار مُحسوبة لا مرسومة.<br>' +
    '<b>ما أُصلح:</b> البطاقات صارت مقاسة من المسرح لا بأرقام ثابتة (كانت 188dp على هاتف ارتفاعه 393) · ' +
    'المربّعات الملوّنة التي كانت تتظاهر بأنها أغلفة استُبدلت بلوحة رمز القسم بلونه من وصفة ' +
    '<b>disc</b> في الثيم · شريط التنقّل السفلي أُزيل ووُحّد على الـ<b>rail</b> في كل الإطارات · ' +
    'و<b>safeDrawing</b> بدل <b>statusBars</b> حتى لا يُرسم المحتوى تحت تنقّل النظام الجانبي.<br>' +
    '<b class="miss">لم أغيّر:</b> Frame tokens، ولا ألوان النظام، ولا الـBackdrop، ولا الـLazy Loading، ولا طبقة البيانات.<br>' +
    '<b>الفحص:</b> ' + (bad.length ? bad.join(' · ') : 'لا تجاوز، لا قصّ، لا عنصر بارتفاع صفر في الإطارات الأربعة.');

  console.log(JSON.stringify({
    frames: built.map(function (b) {
      return { name: b.f.name, four: b.p.fourAcross, card: +b.p.card.toFixed(1),
               width: b.p.width, legal: b.p.showLine };
    }),
    problems: bad,
  }));
})();
</script>
</body>
</html>
