<!doctype html>
<!--
  Home, with a section's load drawn inside its own card. Drawn before code.

  The loading gate goes: pressing a section on Home loads that section, and only that
  section, while the viewer stays on Home and watches its card. One load at a time; a
  second press waits its turn. A section that has never loaded opens when its load ends;
  one being refreshed keeps opening with what it already has.

  Geometry is castivioMetrics() (Metrics.kt) evaluated for the frame's size and laid out
  the way HomeScreen.kt lays it out: stage, header, board (rail 0.166 · stack 0.327 ·
  hero 0.472, gaps bandTop), footer. Colours are Color.kt tokens; the state marks follow
  UI_ARCHITECTURE.md §5.1 -- working is amber and says a word, done is the success
  green with a tick, a failure is the danger red with a sentence. Figures are examples.

    ?frame=<name>               one frame at its device size (833x385 phone, 960x540 TV)
    ?frame=sheet&set=a|b|c|d    frames stacked with their captions, for review; d is how
                                a refresh went, said on its own rail card
    &lang=en                    left to right, in English
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Home — loading in the cards</title>
<style>
:root{
  --deep:#141031; --violet10:#1B1038; --azure10:#0A1E3D;
  --azure40:#2E6BFF; --azure50:#4C9BFF; --azure60:#6FB2FF; --violet40:#6E4BD8; --violet50:#9B6BFF;
  --success:#3DD68C; --amber:#FFB020; --danger:#FF5A5A;
  --white:#FFFFFF; --silver:#C9C9DA; --muted:#A6A6BF; --faint:#6E6E8A;
  --glassLow:rgba(255,255,255,.059); --glassMid:rgba(255,255,255,.078);
  --edgeCard:rgba(126,140,255,.28); --edgeQuiet:rgba(160,163,215,.20);
  --track:rgba(255,255,255,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05040E;color:var(--white);font-family:"Noto Sans Arabic","DejaVu Sans",sans-serif}
body.sheet{padding:20px;width:max-content}
svg{display:block;flex:none}

/* ---------- the four backdrop layers, as paintBackdrop draws them ---------- */
.screen{position:relative;overflow:hidden}
.bd{position:absolute;inset:0;overflow:hidden}
.bd .ramp{position:absolute;inset:0;background:linear-gradient(to bottom right,var(--deep) 0%,var(--violet10) 50%,var(--azure10) 100%)}
.bd .warm,.bd .cool{position:absolute;border-radius:50%}
.bd .warm{background:radial-gradient(circle closest-side,rgba(110,75,216,.30),rgba(110,75,216,0));
  inset-inline-start:calc(5% - 229px);top:calc(100% - 229px);width:458px;height:458px}
.bd .cool{background:radial-gradient(circle closest-side,rgba(46,107,255,.26),rgba(46,107,255,0));
  inset-inline-start:calc(95% - 216px);top:calc(30% - 216px);width:433px;height:433px}
.bd .mesh{position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(105deg,rgba(76,155,255,.05) 0 1.2px,transparent 1.2px 34px)}

/* ---------- the stage, header and footer: context, drawn as they ship ---------- */
.stage{position:absolute;inset:0;padding:var(--stage) var(--edge);display:flex;flex-direction:column;gap:var(--group)}
.head{height:var(--header);flex:none;display:flex;align-items:center;gap:var(--headGap);direction:ltr}
.brand{display:flex;align-items:center;gap:8px;flex:none}
.mark{width:var(--brand);height:var(--brand);border-radius:28%;background:linear-gradient(135deg,var(--azure50),var(--violet40))}
.word{font-size:calc(var(--fsLabel) * 1.12);letter-spacing:.34em;font-weight:700}
.terms{flex:1;min-width:0;display:flex;gap:var(--chipPad);direction:inherit}
.term{flex:1;min-width:0;height:calc(var(--header) - 2px);border-radius:7px;border:1px solid;
  background:linear-gradient(to bottom,var(--glassMid),var(--glassLow));display:flex;align-items:center;gap:6px;padding:0 var(--chipPad)}
.term .k{width:calc(var(--fsBody) * 1.5);height:calc(var(--fsBody) * 1.5);border-radius:50%;flex:none}
.term .lbl{font-size:calc(var(--fsChip) * .95);color:var(--muted);white-space:nowrap;line-height:1.25}
.term .val{font-size:var(--fsBody);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.25}
.term.p{border-color:rgba(61,214,140,.30)} .term.p .k{background:var(--success)} .term.p .val{color:var(--success)}
.term.l{border-color:rgba(46,107,255,.30)} .term.l .k{background:var(--azure40)} .term.l .val{color:var(--azure50)}
.clock{flex:none;text-align:right}
.clock .t{font-size:calc(var(--fsTitle) * 1.02);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.clock .d{font-size:var(--fsChip);color:var(--muted);font-variant-numeric:tabular-nums}
.chipbtn{height:var(--chip);border-radius:calc(var(--chip) / 2);flex:none;border:1px solid var(--edgeQuiet);
  background:var(--glassLow);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--silver);font-size:var(--fsChip)}
.chipbtn.round{width:var(--chip)} .chipbtn.pill{padding:0 var(--chipPad)}

.board{flex:1;min-height:0;display:flex;gap:var(--band)}
.rail{flex:166 166 0;min-width:0;display:flex;flex-direction:column;gap:var(--railgap)}
.stack{flex:327 327 0;min-width:0;display:flex;flex-direction:column;gap:var(--item)}
.util{flex:1;min-height:0;border-radius:calc(var(--radius) / 2);border:1px solid var(--edgeQuiet);
  background:linear-gradient(to bottom,var(--glassMid),var(--glassLow));
  display:flex;align-items:center;gap:calc(var(--chipPad) * .7);padding:0 var(--chipPad);font-size:var(--fsChip);color:var(--silver);white-space:nowrap}
.util svg{width:16px;height:16px;fill:var(--violet50)} .util.quit svg{fill:#FF9B9B}
/* A refresh says how it went on its own card: a failure in the failure red until the next
   press -- which is the retry -- with what to do under it; an answer in the success green
   for a few seconds, as a section's card says it has just loaded. */
.util.bad{border-color:rgba(255,90,90,.55);background:linear-gradient(to bottom,rgba(255,90,90,.12),rgba(255,90,90,.04))}
.util.bad svg{fill:var(--danger)}
.util .ucol{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.util .ubad{color:var(--danger)}
.util.good{border-color:rgba(61,214,140,.55);background:linear-gradient(to bottom,rgba(61,214,140,.13),rgba(61,214,140,.04))}
.util.good svg{fill:var(--success)} .util .ugood{color:var(--success)}
.util .usub{font-size:calc(var(--fsChip) * .85);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.foot{flex:none;display:flex;flex-direction:column;gap:var(--foot)}
.facts{display:flex;gap:var(--chipPad)}
.fact{flex:1;min-width:0;height:var(--chip);border-radius:calc(var(--radius) / 2);border:1px solid var(--edgeQuiet);background:var(--glassLow);
  display:flex;align-items:center;justify-content:center;gap:6px;padding:0 var(--chipPad);font-size:var(--fsChip);color:var(--muted);white-space:nowrap}
.fact svg{width:15px;height:15px}
.fact .v{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;color:var(--silver)}
.disc{display:flex;align-items:center;justify-content:center;gap:calc(var(--chipPad) / 2);font-size:calc(var(--fsChip) * .92);color:var(--faint);white-space:nowrap}
.disc svg{width:14px;height:14px;fill:var(--violet50)}

/* ---------- the subject: the four section cards ---------- */
.card{position:relative;border:1px solid var(--edgeCard);background:linear-gradient(to bottom,var(--glassMid),var(--glassLow));overflow:hidden}
/* Focused: lift, ring, glow -- InteractiveGlassCard's focus, in focusRing and focusGlow. */
.card.focus{transform:scale(1.03);z-index:5;border-color:var(--azure60);
  box-shadow:0 0 0 1.5px var(--azure60),0 0 18px rgba(46,107,255,.45)}
/* Just finished: the success green on the edge and a breath of it on the glass, for a few seconds. */
.card.ok{border-color:rgba(61,214,140,.55);
  background:linear-gradient(to bottom,rgba(61,214,140,.13),rgba(61,214,140,.04))}

.hero{flex:472 472 0;min-width:0;border-radius:var(--radius)}
.hero .wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:64%;width:auto;opacity:.18}
.hcol{position:absolute;inset:var(--chipPad);display:flex;flex-direction:column;justify-content:flex-end}
.hname{font-size:var(--fsLabel);font-weight:700;line-height:1.3}
.hs{font-size:var(--fsBody);line-height:1.4}
.hcount{font-size:calc(var(--fsTitle) * 1.26);font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.hcap{font-size:calc(var(--fsChip) * .95);color:var(--muted);line-height:1.4;margin-top:3px}

.line{flex:1;min-height:0;border-radius:calc(var(--radius) / 2);display:flex;align-items:center;gap:var(--chipPad);padding:0 var(--chipPad)}
.line .licon{width:20px;height:20px}
.lcol{flex:1;min-width:0}
.lname{font-size:var(--fsLabel);font-weight:700;line-height:1.3;white-space:nowrap}
.ls{font-size:var(--fsBody);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}

.srow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:var(--fsBody);line-height:1.4}
.wordmark{display:flex;align-items:center;gap:4px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wordmark svg,.ls svg{width:1.05em;height:1.05em}
.val{flex:none;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--silver)}
.dbg{flex:none;white-space:nowrap;font-size:calc(var(--fsChip) * .95);color:var(--faint);font-variant-numeric:tabular-nums}
.amber{color:var(--amber)} .amber svg{fill:var(--amber)}
.good{color:var(--success)} .good svg{fill:var(--success)}
.bad{color:var(--danger)} .bad svg{fill:var(--danger)}
.quiet{color:var(--muted)} .quiet svg{fill:var(--muted)}
.hint{color:var(--azure60)}
.primary{color:var(--azure50)}

/* the bar: a hairline under the words, never a timer. 4dp on the panel, 3dp on a line. */
.trk{position:relative;height:3px;border-radius:2px;background:var(--track);overflow:hidden;margin-top:4px}
.hero .trk{height:4px;margin-top:6px}
.fill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:inherit}
.fill.amber{background:var(--amber)} .fill.good{background:var(--success)} .fill.hue{background:var(--hue)}
/* No denominator: a segment that travels the track. With the motion level at none it stands
   still, and the count beside the words carries the progress alone. */
.seg{position:absolute;inset-block:0;inset-inline-start:24%;width:36%;border-radius:inherit;
  background:linear-gradient(90deg,rgba(255,176,32,0),var(--amber) 30%,var(--amber) 70%,rgba(255,176,32,0))}
.seg.hue{background:linear-gradient(90deg,rgba(76,155,255,0),var(--azure50) 30%,var(--azure50) 70%,rgba(76,155,255,0))}

/* ---------- the review sheet ---------- */
.blk{margin-bottom:22px}
.cap{width:var(--w);font-size:12.5px;line-height:1.75;color:#C9C9DA;margin-bottom:8px}
.cap b{color:#fff} .cap .n{color:var(--azure60);font-weight:700}
.cap .a{color:var(--amber)} .cap .g{color:var(--success)} .cap .r{color:var(--danger)}
.pair{display:flex;gap:16px}
.pair .lab{font-size:12px;font-weight:700;margin-bottom:6px;color:var(--azure60)}
.notes{width:833px;font-size:12.5px;line-height:1.9;color:#C9C9DA;margin-top:4px}
.notes b{color:#fff}
</style>
</head>

/** castivioMetrics(width, height, isTv), as Metrics.kt computes it, plus HomeScreen's Rhythm. */
function metrics(w, h) {
  const f = (axis, of, min, max) => Math.min(max, Math.max(min, axis * of));
  const m = {
    edge: f(w, 61.3 / 1280, 24, 72), header: f(h, 72 / 720, 40, 88), headGap: f(w, 34.7 / 1280, 12, 40),
    brand: f(h, 53.3 / 720, 28, 60), chip: f(h, 58.7 / 720, 32, 64), chipPad: f(w, 14.7 / 1280, 8, 18),
    band: f(h, 29.3 / 720, 8, 32), radius: f(h, 26.7 / 720, 14, 28),
    fsTitle: f(h, 34.7 / 720, 18, 36), fsLabel: f(h, 21.1 / 720, 13, 22), fsBody: f(h, 18 / 720, 12, 19), fsChip: f(h, 17.3 / 720, 11, 18),
  };
  const item = m.band * 0.764;
  return Object.assign(m, {stage: item, group: m.band * 1.274, item, railgap: item / 2, foot: m.band * 0.509});
}

const fmt = (n, lang) => n.toLocaleString('en-US');
const unit = (T, sec, n, lang) => T.unit[sec].replace('%s', fmt(n, lang));
let gradientId = 0;

function heroCard(sec, s, T, lang, opts = {}) {
  const id = 'g' + (++gradientId);
  const hue = HUE[sec];
  const classes = ['card', 'hero'];
  if (s.focus) classes.push('focus');
  if (s.k === 'done') classes.push('ok');
  let body = '';
  switch (s.k) {
    case 'unfetched': body = `<div class="hs primary">${T.notFetched}</div>`; break;
    case 'counted': body = `<div class="hcount" style="color:${hue}">${unit(T, sec, s.n, lang)}</div>`; break;
    case 'empty': body = `<div class="hs quiet">${T.none[sec]}</div>`; break;
    case 'loading': {
      const word = s.hint ? `<span class="wordmark hint">${T.opensWhenDone}</span>`
                          : `<span class="wordmark amber">${T.loadingLive}</span>`;
      const seg = opts.referenceColours ? 'seg hue' : 'seg';
      body = `<div class="srow">${word}<span class="val">${unit(T, sec, s.n, lang)}</span></div>
              <div class="trk"><div class="${seg}"></div></div>
              <div class="hcap">${T.fromProvider}</div>`;
      break;
    }
    case 'done':
      body = `<div class="srow"><span class="wordmark good">${svg('check')}${T.done}</span>${s.secs ? `<span class="dbg">${T.seconds.replace('%s', s.secs)} · debug</span>` : ''}</div>
              <div class="hcount" style="color:${hue}">${unit(T, sec, s.n, lang)}</div>
              <div class="trk"><div class="fill good" style="width:100%"></div></div>`;
      break;
    case 'refresh':
      body = `<div class="hcount" style="color:${hue}">${unit(T, sec, s.n, lang)}</div>
              <div class="srow"><span class="wordmark amber">${svg('refresh')}${T.refreshing}</span></div>
              <div class="trk"><div class="seg"></div></div>`;
      break;
    case 'failed':
      body = `<div class="srow"><span class="wordmark bad">${svg('alert')}${T.failedLive}</span></div>
              <div class="hcap" style="color:var(--silver)">${T.retry}</div>`;
      break;
  }
  return `<div class="${classes.join(' ')}" style="--hue:${hue}">
    <svg class="wm" viewBox="0 0 24 24"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${hue}"/><stop offset="1" stop-color="#9B6BFF"/></linearGradient></defs>
      <path d="${ICON[GLYPH[sec]]}" fill="url(#${id})"/></svg>
    <div class="hcol"><div class="hname">${T[sec]}</div>${body}</div>
  </div>`;
}

function lineCard(sec, s, T, lang) {
  const hue = HUE[sec];
  const classes = ['card', 'line'];
  if (s.focus) classes.push('focus');
  if (s.k === 'done') classes.push('ok');
  let body = '';
  switch (s.k) {
    case 'unfetched': body = `<div class="ls primary">${T.notFetched}</div>`; break;
    case 'counted': body = `<div class="ls" style="color:${hue}">${unit(T, sec, s.n, lang)}</div>`; break;
    case 'empty': body = `<div class="ls quiet">${T.none[sec]}</div>`; break;
    case 'queued': body = `<div class="ls quiet">${svg('clock')}${T.queued}</div>`; break;
    case 'loading': {
      const word = s.hint ? `<span class="wordmark hint">${T.opensWhenDone}</span>`
                          : `<span class="wordmark amber">${T.loading}</span>`;
      body = `<div class="srow">${word}<span class="val">${s.pct}%</span></div>
              <div class="trk"><div class="fill amber" style="width:${s.pct}%"></div></div>`;
      break;
    }
    case 'done':
      body = `<div class="srow"><span class="wordmark good">${svg('check')}${unit(T, sec, s.n, lang)}</span></div>
              <div class="trk"><div class="fill good" style="width:100%"></div></div>`;
      break;
    // Two halves on the status row, as a load's word and figure are: the full "press to try
    // again" did not fit beside the icon on a phone's line and lost its last word.
    case 'failed':
      body = `<div class="srow"><span class="wordmark bad">${svg('alert')}${T.failed}</span><span class="val">${T.retryShort}</span></div>`;
      break;
  }
  return `<div class="${classes.join(' ')}">
    ${svg(GLYPH[sec], `class="licon" style="fill:${hue}"`)}
    <div class="lcol"><div class="lname">${T[sec]}</div>${body}</div>
  </div>`;
}

function board(fr) {
  const lang = fr.lang || LANG;
  const T = STR[lang];
  const tv = fr.dev === 'tv';
  const w = tv ? 960 : 833, h = tv ? 540 : 385;
  const m = metrics(w, h);
  const vars = Object.entries(m).map(([k, v]) => `--${k}:${v.toFixed(2)}px`).join(';');
  const rail = T.rail.map((label, i) => {
    const icon = ['refresh', 'playlist', 'sparkle', 'settings', 'power'][i];
    if (i === 0 && fr.railFault) {
      return `<div class="util bad">${svg('alert')}<div class="ucol"><span class="ubad">${T.refreshFailed}</span><span class="usub">${T.retryRail}</span></div></div>`;
    }
    if (i === 0 && fr.railDone) {
      return `<div class="util good">${svg('check')}<div class="ucol"><span class="ugood">${T.refreshDone}</span></div></div>`;
    }
    return `<div class="util${i === 4 ? ' quit' : ''}">${svg(icon)}${label}</div>`;
  }).join('');
  const st = fr.cards;
  return `<div class="screen" dir="${lang === 'ar' ? 'rtl' : 'ltr'}" lang="${lang}" style="width:${w}px;height:${h}px;${vars}">
    <div class="bd"><div class="ramp"></div><div class="warm"></div><div class="cool"></div><div class="mesh"></div></div>
    <div class="stage">
      <div class="head">
        <div class="brand"><div class="mark"></div><div class="word">CASTIVIO</div></div>
        <div class="terms" dir="${lang === 'ar' ? 'rtl' : 'ltr'}">
          <div class="term p"><div class="k"></div><div><div class="lbl">${T.provider}</div><div class="val">22/12/2026</div></div></div>
          <div class="term l"><div class="k"></div><div><div class="lbl">${T.licence}</div><div class="val">07/10/2027</div></div></div>
        </div>
        <div class="clock"><div class="t">09:55</div><div class="d">16/10/2026</div></div>
        <div class="chipbtn round">${svg('sun', 'style="width:16px;height:16px;fill:#C9C9DA"')}</div>
        <div class="chipbtn pill">${svg('globe', 'style="width:15px;height:15px;fill:#C9C9DA"')}${T.language}</div>
      </div>
      <div class="board">
        <div class="rail">${rail}</div>
        <div class="stack">${['movies', 'series', 'radio'].map(sec => lineCard(sec, st[sec], T, lang)).join('')}</div>
        ${heroCard('live', st.live, T, lang)}
      </div>
      <div class="foot">
        <div class="facts">
          <div class="fact">${svg('lockOpen', 'style="fill:#3DD68C"')}<span>${T.device}</span><span class="v" style="color:#3DD68C">${T.activated}</span></div>
          <div class="fact">${svg('chip', 'style="fill:#A6A6BF"')}<span>${T.mac}</span><span class="v">00:1A:79:12:34:56</span></div>
          <div class="fact">${svg('key', 'style="fill:#FFB020"')}<span>${T.key}</span><span class="v" style="color:#FFB020">123456</span></div>
        </div>
        <div class="disc">${svg('info')}<span>${T.disclaimer}</span></div>
      </div>
    </div>
  </div>`;
}

// ------------------------------------------------------------------ the frames
const U = {k: 'unfetched'};
const SETTLED = {live: {k: 'counted', n: 54130}, movies: {k: 'counted', n: 12640}, series: {k: 'counted', n: 2318}, radio: {k: 'counted', n: 1083}};

    cap: '<span class="n">١ — الضغط على البث المباشر.</span> تُحمَّل القنوات وحدها، والمشاهد باقٍ في Home يرى البطاقة. رد Xtream الواحد لا يذكر عدد القنوات قبل نهايته، فلا نسبة مئوية: <b>العدد يتزايد</b> و<span class="a">الشريط يتحرك</span>.'},
  'queued': {cards: {live: {k: 'loading', n: 41870}, movies: U, series: U, radio: {k: 'queued', focus: true}},
    cap: '<span class="n">٢ — الضغط على الراديو أثناء تحميل القنوات.</span> تحميل واحد في كل مرة: الراديو ينتظر دوره، ولا يعيد تحميل القنوات.'},
  'live-done': {cards: {live: {k: 'done', n: 54130, secs: 34}, movies: U, series: U, radio: {k: 'loading', pct: 60}},
    cap: '<span class="n">٣ — اكتملت القنوات.</span> <span class="g">✓ «اكتمل التحميل»</span> لثوانٍ، ثم تعود البطاقة إلى شكلها العادي؛ زمن التحميل يظهر في نسخة debug وحدها. الراديو بدأ دوره: فئاته معروفة العدد، فنسبته حقيقية.'},
  'movies': {cards: {live: {k: 'counted', n: 54130}, movies: {k: 'loading', pct: 48}, series: U, radio: {k: 'counted', n: 1083}},
    cap: '<span class="n">٤ — بعد ثوانٍ.</span> القنوات والراديو بعدّهما المعتاد. الأفلام تُحمَّل فئةً فئة، فنسبتها حقيقية.'},
  'pressed': {cards: {live: {k: 'counted', n: 54130}, movies: {k: 'loading', pct: 63, hint: true, focus: true}, series: U, radio: {k: 'counted', n: 1083}},
    cap: '<span class="n">٥ — الضغط على قسم لم يكتمل تحميله الأول.</span> لا يُفتح نصف مكتمل: يبقى المشاهد في Home، والبطاقة تقول «يُفتح عند اكتمال التحميل» لثانيتين، ثم تعود إلى التقدم.'},
  'fail-empty': {cards: {live: {k: 'counted', n: 54130}, movies: {k: 'empty'}, series: {k: 'failed', focus: true}, radio: {k: 'counted', n: 1083}},
    cap: '<span class="n">٦ — فارغ وفاشل.</span> اكتمل بلا شيء: «لا أفلام»، الجملة الحالية. فشل: <span class="r">«تعذّر التحميل»</span> و«اضغط للإعادة» — لا إعادة تلقائية، والضغط هو الإعادة.'},
  'refresh': {cards: {live: {k: 'refresh', n: 54130, focus: true}, movies: {k: 'counted', n: 12640}, series: {k: 'counted', n: 2318}, radio: {k: 'counted', n: 1083}},
    cap: '<span class="n">٧ — تحديث قسم له محتوى.</span> العدد يبقى، والكلمة <span class="a">«جارٍ التحديث…»</span> والشريط تحته؛ والقسم يُفتح أثناء التحديث بما لديه.'},
  'movies-en': {lang: 'en', cards: {live: {k: 'counted', n: 54130}, movies: {k: 'loading', pct: 48}, series: U, radio: {k: 'counted', n: 1083}},
    cap: '<span class="n">٨ — الإطار ٤ بالإنجليزية، من اليسار إلى اليمين.</span>'},
  'refresh-failed': {railFault: 'release', cards: SETTLED,
    cap: '<span class="n">١١ — تحديث لم يصله جواب.</span> يُكتب الفشل على زر «تحديث» نفسه، بالأحمر وبعلامة التعجّب، كما يكتب كل قسم فشله على بطاقته: <span class="r">«تعذّر التحديث»</span> و«اضغط للإعادة» — كما تقول البطاقات «تعذّر التحميل». الجملة الكاملة، «لم يردّ مزوّدك. حاول بعد قليل.»، يقرؤها قارئ الشاشة. لا شيء يُغطّى، والتذييل كما هو. يبقى حتى الضغطة التالية، وهي نفسها إعادة المحاولة.'},
  'refresh-done': {railDone: true, cards: SETTLED,
    cap: '<span class="n">١٢ — تحديث أجاب عنه المزوّد.</span> <span class="g">✓ «تم التحديث»</span> لثلاث ثوانٍ، كما تقول بطاقة القسم «اكتمل التحميل»، ثم يعود الزر «تحديث». جواب لم يتغيّر لا يحرّك شيئًا في الترويسة، فلولا هذا لبدا الضغط كأنه لم يفعل شيئًا.'},
  'refresh-failed-en': {lang: 'en', railFault: 'release', cards: SETTLED,
    cap: '<span class="n">١٣ — الإطار ١١ بالإنجليزية.</span>'},
  'refresh-failed-tv': {dev: 'tv', railFault: 'release', cards: SETTLED,
    cap: '<span class="n">١٤ — الإطار ١١ على التلفاز، 960×540.</span>'},
  'tv': {dev: 'tv', cards: {live: {k: 'done', n: 54130}, movies: U, series: U, radio: {k: 'loading', pct: 60, focus: true}},
    cap: '<span class="n">٩ — الإطار ٣ على التلفاز، 960×540.</span> التركيز على الراديو بالريموت.'},
};
const SETS = {a: ['press-live', 'queued', 'live-done', 'movies'], b: ['pressed', 'fail-empty', 'refresh'], c: ['movies-en', 'tv', 'compare'],
  d: ['refresh-failed', 'refresh-done', 'refresh-failed-en', 'refresh-failed-tv']};

function compare() {
  // Two panels at the phone's own panel size: the reference's colours, and the state language's.
  const m = metrics(833, 385);
  const vars = Object.entries(m).map(([k, v]) => `--${k}:${v.toFixed(2)}px`).join(';');
  const width = (833 - 2 * m.edge - 2 * m.band) * 472 / 965;
  const height = 385 - 2 * m.stage - m.header - 2 * m.group - (m.chip + m.foot + 17.6);
  const T = STR.ar;
  const one = (label, opts) => `<div><div class="lab">${label}</div>
    <div class="screen" dir="rtl" style="width:${width}px;height:${height}px;display:flex;${vars}">
      <div class="bd"><div class="ramp"></div></div>
      ${heroCard('live', {k: 'loading', n: 24310}, T, 'ar', opts)}</div></div>`;
  return `<div class="pair" dir="rtl">${one('أ — بلون القسم، كما في المرجع', {referenceColours: true})}${one('ب — بالكهرماني، لون «جارٍ العمل» في التطبيق', {})}</div>`;
}
const COMPARE_CAP = '<span class="n">١٠ — لون الشريط.</span> المرجع لوّن الشريط بلون القسم. قاعدة التطبيق (§5.1) تخصّص لكل لون معنى واحدًا: الكهرماني «جارٍ العمل»، والأخضر النجاح، والأحمر الفشل، والأزرق والبنفسجي للتنقل. رسمتُ «ب»؛ واختيار «أ» يعني تغيير القاعدة نفسها عن قصد.';

const params = new URLSearchParams(location.search);
const LANG = params.get('lang') || 'ar';
const frame = params.get('frame') || 'sheet';
if (frame === 'sheet') {
  document.body.classList.add('sheet');
  const set = SETS[params.get('set') || 'a'];
  document.body.innerHTML = set.map(name => {
    if (name === 'compare') return `<div class="blk"><div class="cap" dir="rtl" style="--w:833px">${COMPARE_CAP}</div>${compare()}</div>`;
    const fr = FRAMES[name];
    const w = fr.dev === 'tv' ? 960 : 833;
    return `<div class="blk"><div class="cap" dir="rtl" style="--w:${w}px">${fr.cap}</div>${board(fr)}</div>`;
  }).join('') + (params.get('set') === 'c' ? `<div class="notes" dir="rtl">
    <b>الحركة.</b> مع مستوى الحركة «بلا»، الشريط الذي لا يعرف مجموعه يقف ثابتًا، والعدد بجانب الكلمة يحمل التقدم وحده.<br>
    <b>M3U.</b> يُنزَّل الملف مرة واحدة ويُحفظ على الجهاز، فيتقدم الشريط بنسبة حقيقية (المقروء من حجم الملف)، والأقسام التالية تُقرأ منه دون تنزيل جديد.<br>
    <b>قارئ الشاشة.</b> البطاقة تُقرأ كاملة: «البث المباشر، جارٍ تحميل القنوات، 24,310 قناة».</div>` : '');
} else if (frame === 'compare') {
  document.body.innerHTML = compare();
} else {
  document.body.innerHTML = board(FRAMES[frame]);
}
</script>
