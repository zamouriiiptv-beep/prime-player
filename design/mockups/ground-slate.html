<!doctype html>
<html lang="ar" dir="rtl" data-frame="tv">
<head>
<meta charset="utf-8">
<title>Castivio — الأرضية: سليت</title>
<style>
/* ============================================================================
   Castivio — the ground, and nothing else.

   One screen (the source choice, at the 960x540 set frame) drawn three times on
   three grounds, so the only variable on the page is the thing being judged.

   ## Why the screen is repeated rather than switched by a control

   A toggle shows one ground at a time and asks the eye to remember the other,
   which is exactly the comparison an eye is worst at. Three frames in one
   viewport is the whole question in a single glance -- and it is what caught the
   real finding: the reference players do not differ from Castivio mainly in hue,
   they differ in how far a card stands off its ground.

   ## The three

   | | ground | card | L* ground | L* card | lift |
   |---|---|---|---|---|---|
   | Void (shipping) | #08071A | #141031 | 2.51 | 6.69 | 4.18 |
   | Slate 247       | #17152A | #28253F | 8.00 | 16.17 | 8.17 |
   | Slate 235       | #13152D | #242642 | 7.81 | 16.28 | 8.47 |

   For reference, measured off the screenshots the user found: Hot Player is
   7.96 -> 16.39 (lift 8.43) and TiviMate 6.98 -> 16.78 (lift 9.81). Both slates
   are built to sit in that band on Castivio's own hue rather than on theirs --
   copying #0F172A exactly would make this screen Hot Player's screen.

   ## What is NOT being changed here, deliberately

   The four hues, the type scale, every dp of geometry, the badge, the focus
   ring, the contour mesh. If any of those looks different between the three
   frames below, it is a bug in this file and not a proposal.

   The one derived thing that must move with the ground is the disc: a hue at
   34% over near-black reads, and the same 34% over a mid ground puts the azure
   glyph at 2.95:1 and the violet at 2.57:1 inside their own discs. So the
   slates draw the disc at 24% and pull the glyph 16% toward white, which
   measures 4.21 / 3.72 / 5.23 / 5.28 -- all past the 3:1 a glyph owes.
   ========================================================================= */
@font-face{font-family:"Castivio Sans";font-weight:400;src:url("../../core/design/src/main/res/font/inter_regular.ttf") format("truetype")}
@font-face{font-family:"Castivio Sans";font-weight:500;src:url("../../core/design/src/main/res/font/inter_medium.ttf") format("truetype")}
@font-face{font-family:"Castivio Sans";font-weight:600;src:url("../../core/design/src/main/res/font/inter_semibold.ttf") format("truetype")}
@font-face{font-family:"Castivio Sans";font-weight:700;src:url("../../core/design/src/main/res/font/inter_bold.ttf") format("truetype")}
@font-face{font-family:"Castivio Arabic";font-weight:400;src:url("../../core/design/src/main/res/font/plex_arabic_regular.ttf") format("truetype")}
@font-face{font-family:"Castivio Arabic";font-weight:500;src:url("../../core/design/src/main/res/font/plex_arabic_medium.ttf") format("truetype")}
@font-face{font-family:"Castivio Arabic";font-weight:600;src:url("../../core/design/src/main/res/font/plex_arabic_semibold.ttf") format("truetype")}
@font-face{font-family:"Castivio Arabic";font-weight:700;src:url("../../core/design/src/main/res/font/plex_arabic_bold.ttf") format("truetype")}

:root{
  --word-ratio:.80;
  --white:#FFFFFF;
  --text:#EDEDF6;
  --text-2:#CFCFE4;
  --text-3:#A9A9C6;

  /* The four hues, identical on all three grounds. This is the point. */
  --h-m3u:#A86BFF;
  --h-xtream:#4C9BFF;
  --h-users:#3FD9A0;
  --h-local:#FFA13A;

  --edge-quiet:rgba(160,163,215,.20);
  --rim:inset 0 1px 0 rgba(255,255,255,.12);
  --lift:0 10px 26px rgba(3,2,12,.52);
  --focus:#6FB2FF;

  /* the set frame, at its real dp geometry */
  --W:960px; --H:540px;
  --edge:46px; --top:24px; --bottom:22px;
  --header:54px; --head-gap:26px; --brand:40px; --fs-title:26px;
  --back:44px; --back-pad:11px; --fs-back:13px;
  --band-top:22px; --grid-gap:18px; --card-max:168px;
  --card-pad:16px; --card-gap:16px; --disc:72px; --chev:24px;
  --fs-card:15.8px; --fs-desc:13.5px; --fs-badge:13px; --desc-lines:4;
  --radius:20px;
  --trust:40px; --trust-gap:14px; --trust-disc:26px;
  --fs-trust:13px;
}

/* ------------------------------------------------------------ the grounds */
/* Everything a ground owns, and nothing a ground does not: four gradient
   stops, two glow strengths, a card's two fills, and the disc's two numbers. */

.g-void{
  --sky0:#05040E; --sky1:#07061A; --sky2:#0B0826; --sky3:#150C3C;
  --glow-warm:.60; --glow-cool:.28; --glow-third:.24;
  --card-hi:rgba(36,29,92,.80); --card-lo:rgba(15,11,44,.74);
  --card-edge:var(--edge-quiet);
  --rec-hi:rgba(58,34,124,.78); --rec-lo:rgba(22,14,58,.74);
  --disc-top:34%; --disc-foot:8%; --disc-ink:0%;
  --mesh-a:.34; --mesh-b:.20;
}
.g-s247{
  --sky0:#151328; --sky1:#17152A; --sky2:#1A1730; --sky3:#201B3C;
  --glow-warm:.30; --glow-cool:.15; --glow-third:.13;
  --card-hi:#2B2843; --card-lo:#25223A;
  --card-edge:rgba(178,176,214,.20);
  --rec-hi:#3A2F5C; --rec-lo:#2C2547;
  --disc-top:24%; --disc-foot:9%; --disc-ink:16%;
  --mesh-a:.34; --mesh-b:.20;
}
.g-s235{
  --sky0:#111327; --sky1:#13152D; --sky2:#161933; --sky3:#1B1F3F;
  --glow-warm:.28; --glow-cool:.16; --glow-third:.12;
  --card-hi:#262845; --card-lo:#22243D;
  --card-edge:rgba(172,180,214,.20);
  --rec-hi:#33325F; --rec-lo:#28294A;
  --disc-top:24%; --disc-foot:9%; --disc-ink:16%;
  --mesh-a:.34; --mesh-b:.20;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
body{font-family:"Castivio Sans","Castivio Arabic","Noto Sans",sans-serif;
  color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}

/* ------------------------------------------------------------ the caption */
.rail{width:var(--W);margin:0 auto;padding:26px 0 8px;direction:rtl}
.rail:first-of-type{padding-top:18px}
.rail h2{font-size:17px;font-weight:700;color:#F2F0FF;line-height:1.4}
.rail p{font-size:13px;line-height:1.6;color:#9C9CBC;margin-top:3px;
  font-variant-numeric:tabular-nums}
.rail .sw{display:inline-block;width:11px;height:11px;border-radius:3px;
  margin-inline-end:8px;vertical-align:-1px;border:1px solid rgba(255,255,255,.22)}
.foot{width:var(--W);margin:0 auto;padding:30px 0 60px;direction:rtl;
  font-size:12.5px;line-height:1.75;color:#77779A}

/* ------------------------------------------------------------- the screen */
.frame{position:relative;width:var(--W);height:var(--H);overflow:hidden;
  margin:0 auto;background:var(--sky0)}
.backdrop{position:absolute;inset:0;
  background:
    radial-gradient(74% 96% at 4% 116%,
      rgba(126,62,255,var(--glow-warm)) 0%,
      rgba(102,48,220,calc(var(--glow-warm) * .38)) 38%,
      rgba(70,30,170,0) 70%),
    radial-gradient(46% 60% at 100% 6%,
      rgba(38,84,220,var(--glow-cool)) 0%, rgba(38,84,220,0) 66%),
    radial-gradient(38% 52% at 84% 92%,
      rgba(88,46,210,var(--glow-third)) 0%, rgba(88,46,210,0) 68%),
    linear-gradient(178deg, var(--sky0) 0%, var(--sky1) 26%, var(--sky2) 58%, var(--sky3) 100%);
}
.contours{position:absolute;left:0;right:0;bottom:0;height:62%;opacity:.8}

.stage{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:var(--top) var(--edge) var(--bottom)}

.header{flex:0 0 auto;height:var(--header);direction:ltr;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;
  column-gap:var(--head-gap)}
html[dir="rtl"] .header .title,
html[dir="rtl"] .header .back{direction:rtl}
.wordmark{grid-column:1;grid-row:1;justify-self:start;direction:ltr;
  display:flex;align-items:center;gap:calc(var(--brand) * .32)}
.wordmark span{font-family:"Castivio Sans",sans-serif;font-weight:700;line-height:1;
  font-size:calc(var(--fs-title) * var(--word-ratio));
  letter-spacing:calc(var(--fs-title) * var(--word-ratio) * .25);
  margin-inline-end:calc(var(--fs-title) * var(--word-ratio) * -.25);
  background-image:linear-gradient(97deg,#A86BFF 0%,#7B4BEE 30%,#3D6BFF 70%,#3A9BFF 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 16px rgba(124,75,255,.42))}
.brand{flex:0 0 auto;width:var(--brand);height:var(--brand);display:block;
  filter:drop-shadow(0 2px 7px rgba(0,0,0,.5))}
.title{grid-column:2;grid-row:1;justify-self:center;min-width:0;max-width:100%;
  white-space:nowrap;overflow:hidden;
  font-size:var(--fs-title);line-height:1.35;font-weight:700;color:var(--white)}
.back{grid-column:3;grid-row:1;justify-self:end;
  display:flex;align-items:center;gap:8px;height:var(--back);
  padding:0 var(--back-pad);border-radius:999px;flex:0 0 auto;white-space:nowrap;
  font-size:var(--fs-back);line-height:1.45;color:var(--text-2);
  background:rgba(255,255,255,.045);border:1px solid var(--edge-quiet)}
.back svg{width:calc(var(--fs-back) * 1.25);height:calc(var(--fs-back) * 1.25);
  flex:0 0 auto;color:var(--text-2)}
html[dir="rtl"] .back svg{transform:scaleX(-1)}

.band{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  padding-top:var(--band-top);gap:var(--trust-gap)}
.grid{flex:1 1 auto;min-height:0;display:grid;
  grid-template-columns:1fr 1fr;gap:var(--grid-gap);
  grid-template-rows:repeat(2, minmax(0, var(--card-max)));
  align-content:center;justify-content:stretch}

.card{position:relative;display:flex;align-items:center;gap:var(--card-gap);
  min-width:0;padding:var(--card-pad);border-radius:var(--radius);
  background:linear-gradient(180deg,var(--card-hi) 0%,var(--card-lo) 100%);
  border:1px solid var(--card-edge);
  box-shadow:var(--rim), var(--lift)}

.disc{flex:0 0 auto;width:var(--disc);height:var(--disc);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:color-mix(in srgb, #FFFFFF var(--disc-ink), var(--hue));
  background:radial-gradient(128% 128% at 30% 18%,
    color-mix(in srgb, var(--hue) var(--disc-top), transparent),
    color-mix(in srgb, var(--hue) var(--disc-foot), transparent));
  border:1px solid color-mix(in srgb, var(--hue) 46%, transparent);
  box-shadow:0 0 22px color-mix(in srgb, var(--hue) 22%, transparent), var(--rim)}
.disc svg{width:50%;height:50%}

.body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
.head{display:flex;align-items:center;gap:9px;min-width:0}
.head b{font-size:var(--fs-card);line-height:1.3;font-weight:700;color:var(--white);
  min-width:0;white-space:nowrap}
.d{font-size:var(--fs-desc);line-height:1.5;color:var(--text-2);
  display:-webkit-box;-webkit-line-clamp:var(--desc-lines);-webkit-box-orient:vertical;overflow:hidden}
.d .hint{color:var(--text-3)}
.chev{flex:0 0 auto;width:var(--chev);height:var(--chev);color:var(--text-3);
  display:flex;align-items:center;justify-content:center}
html[dir="ltr"] .chev svg{transform:scaleX(-1)}

.badge{flex:0 0 auto;display:flex;align-items:center;gap:5px;
  padding:2px 9px;border-radius:999px;white-space:nowrap;
  font-size:var(--fs-badge);font-weight:700;color:var(--white);
  background:linear-gradient(180deg,rgba(146,90,255,.42),rgba(80,44,190,.30));
  border:1px solid rgba(178,132,255,.46)}
.badge svg{width:calc(var(--fs-badge) * 1.05);height:calc(var(--fs-badge) * 1.05);
  color:#D9C3FF}
.card.rec{background:linear-gradient(180deg,var(--rec-hi) 0%,var(--rec-lo) 100%);
  border-color:rgba(178,132,255,.85);
  box-shadow:0 0 0 1px rgba(178,132,255,.45), 0 0 30px rgba(150,90,255,.42),
             var(--rim), var(--lift)}
.card.focus{border-color:var(--focus);
  box-shadow:0 0 0 2px var(--focus), 0 0 26px rgba(111,178,255,.34),
             var(--rim), 0 16px 34px rgba(3,2,12,.62)}

.trust{flex:0 0 var(--trust);display:flex;align-items:center;
  border-radius:var(--radius);padding:0 calc(var(--trust) * .22);
  background:transparent}
.cell{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:10px;
  padding:0 calc(var(--trust) * .16)}
.cell + .cell{border-inline-start:1px solid rgba(160,163,215,.12)}
.cell .ic{flex:0 0 auto;width:var(--trust-disc);height:var(--trust-disc);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:color-mix(in srgb, #FFFFFF var(--disc-ink), var(--hue));
  background:color-mix(in srgb, var(--hue) 10%, transparent);
  border:1px solid color-mix(in srgb, var(--hue) 26%, transparent)}
.cell .ic svg{width:52%;height:52%}
.cell .tx{min-width:0;display:flex;align-items:center}
.cell .tx b{font-size:var(--fs-trust);line-height:1.3;font-weight:600;color:var(--text-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>

<div id="out"></div>

<template id="screen">
  <div class="frame">
    <div class="backdrop"></div>
    <svg class="contours" viewBox="0 0 960 330" preserveAspectRatio="none" fill="none">
      <g stroke="#8E6BFF" stroke-width="1" class="mesh-a">
        <path d="M-20 236 C 120 198, 250 272, 386 244 C 512 218, 618 152, 760 150 C 852 149, 926 168, 990 190"/>
        <path d="M-20 260 C 128 222, 258 294, 398 266 C 528 240, 630 174, 772 172 C 862 171, 932 190, 990 212"/>
        <path d="M-20 284 C 136 246, 266 316, 410 288 C 544 262, 642 196, 784 194 C 872 193, 938 212, 990 234"/>
        <path d="M-20 212 C 112 174, 242 250, 374 222 C 496 196, 606 130, 748 128 C 842 127, 920 146, 990 168"/>
        <path d="M-20 188 C 104 150, 234 228, 362 200 C 480 174, 594 108, 736 106 C 832 105, 914 124, 990 146"/>
      </g>
      <g stroke="#5FA0FF" stroke-width="1" class="mesh-b">
        <path d="M-20 140 C  88 104, 218 186, 338 158 C 448 132, 570  68, 712  66 C 812  65, 902  84, 990 106"/>
        <path d="M-20 116 C  80  80, 210 164, 326 136 C 432 110, 558  46, 700  44 C 802  43, 896  62, 990  84"/>
      </g>
    </svg>

    <div class="stage">
      <div class="header">
        <div class="wordmark"><img class="brand" src="../../core/design/src/main/res/drawable-nodpi/castivio_mark.png" alt=""><span>CASTIVIO</span></div>
        <h1 class="title">اختر طريقة الإضافة</h1>
        <div class="back"><span data-icon="chevron"></span><span>رجوع</span></div>
      </div>

      <div class="band">
        <div class="grid">
          <div class="card focus" style="--hue:var(--h-xtream)">
            <span class="disc" data-icon="server"></span>
            <span class="body">
              <span class="head"><b>Xtream Codes</b></span>
              <span class="d">عنوان سيرفر واسم مستخدم وكلمة مرور. <span class="hint">دعم كامل لميزات Xtream.</span></span>
            </span>
            <span class="chev" data-icon="chevron"></span>
          </div>

          <div class="card rec" style="--hue:var(--h-m3u)">
            <span class="disc" data-icon="link"></span>
            <span class="body">
              <span class="head"><b>قائمة M3U</b>
                <span class="badge"><span data-icon="spark"></span><span>الأسرع</span></span></span>
              <span class="d">أضف رابط قائمة التشغيل بصيغة M3U. <span class="hint">رابط واحد طويل يُرسل عادةً بالبريد.</span></span>
            </span>
            <span class="chev" data-icon="chevron"></span>
          </div>

          <div class="card" style="--hue:var(--h-local)">
            <span class="disc" data-icon="screen"></span>
            <span class="body">
              <span class="head"><b>تشغيل فيديو من الجهاز</b></span>
              <span class="d">تشغيل ملف فيديو محفوظ على الجهاز. <span class="hint">دعم جميع الصيغ الشائعة.</span></span>
            </span>
            <span class="chev" data-icon="chevron"></span>
          </div>

          <div class="card" style="--hue:var(--h-users)">
            <span class="disc" data-icon="users"></span>
            <span class="body">
              <span class="head"><b>قائمة المستخدمين</b></span>
              <span class="d">أضف وبدّل بين اشتراكات Xtream وM3U. <span class="hint">إدارة سهلة لجميع اشتراكاتك.</span></span>
            </span>
            <span class="chev" data-icon="chevron"></span>
          </div>
        </div>

        <div class="trust">
          <div class="cell" style="--hue:var(--h-m3u)"><span class="ic" data-icon="shield"></span>
            <span class="tx"><b>آمن وخاص</b></span></div>
          <div class="cell" style="--hue:var(--h-xtream)"><span class="ic" data-icon="gauge"></span>
            <span class="tx"><b>سريع ومستقر</b></span></div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
var K = 'fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"';
var ICON = {
  chevron:'<svg viewBox="0 0 24 24" '+K+' stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg>',
  link:'<svg viewBox="0 0 24 24" '+K+' stroke-width="1.9">'+
       '<path d="M10.2 13.8a4.4 4.4 0 0 0 6.2 0l2.6-2.6a4.4 4.4 0 0 0-6.2-6.2l-1.3 1.3"/>'+
       '<path d="M13.8 10.2a4.4 4.4 0 0 0-6.2 0L5 12.8a4.4 4.4 0 0 0 6.2 6.2l1.3-1.3"/></svg>',
  server:'<svg viewBox="0 0 24 24" '+K+' stroke-width="1.8">'+
       '<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/>'+
       '<path d="M7 7.5h.01"/><path d="M10.5 7.5h.01"/><path d="M7 16.5h.01"/><path d="M10.5 16.5h.01"/></svg>',
  users:'<svg viewBox="0 0 24 24" '+K+' stroke-width="1.8">'+
       '<circle cx="9.5" cy="8" r="3.4"/><path d="M3.4 19.4a6.1 6.1 0 0 1 12.2 0"/>'+
       '<path d="M16.4 5.2a3.4 3.4 0 0 1 0 5.9"/><path d="M18 14.4a6.1 6.1 0 0 1 2.6 5"/></svg>',
  screen:'<svg viewBox="0 0 24 24" '+K+' stroke-width="1.8">'+
       '<rect x="2.6" y="4" width="18.8" height="13" rx="2.4"/><path d="M8.5 21h7"/>'+
       '<path d="M10.4 8.4v4.2l3.8-2.1z"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.2 2 5 13h5l-1.2 9L19 11h-5.4z"/></svg>',
  shield:'<svg viewBox="0 0 24 24" '+K+' stroke-width="1.9">'+
       '<path d="M12 3l7 2.6v5.6c0 4.3-2.9 8.1-7 9.2-4.1-1.1-7-4.9-7-9.2V5.6z"/><path d="M9 12.2l2.1 2.1L15.2 10"/></svg>',
  gauge:'<svg viewBox="0 0 24 24" '+K+' stroke-width="1.9">'+
       '<path d="M4 18a9 9 0 1 1 16 0"/><path d="M12 18l4.2-5"/><circle cx="12" cy="18" r="1.1"/></svg>'
};

var GROUNDS = [
  { cls:'g-void', sw:'#08071A', name:'الحالي — Void',
    note:'الأرضية #08071A · البطاقة #141031 · L* 2.51 ← 6.69 · ارتفاع البطاقة 4.18' },
  { cls:'g-s247', sw:'#17152A', name:'المقترح أ — سليت بنفسجي (247°)',
    note:'الأرضية #17152A · البطاقة #28253F · L* 8.00 ← 16.17 · ارتفاع البطاقة 8.17' },
  { cls:'g-s235', sw:'#13152D', name:'المقترح ب — سليت محايد (235°)',
    note:'الأرضية #13152D · البطاقة #242642 · L* 7.81 ← 16.28 · ارتفاع البطاقة 8.47' }
];

(function () {
  var out = document.getElementById('out');
  var tpl = document.getElementById('screen');

  GROUNDS.forEach(function (g) {
    var rail = document.createElement('div');
    rail.className = 'rail';
    rail.innerHTML = '<h2><span class="sw" style="background:' + g.sw + '"></span>' +
      g.name + '</h2><p>' + g.note + '</p>';
    out.appendChild(rail);

    var node = tpl.content.cloneNode(true);
    var frame = node.querySelector('.frame');
    frame.classList.add(g.cls);
    // The mesh is a ground token, and the first render proved why: dropped to
    // .20 on the slates -- reasoning from "a lighter page needs less" -- the
    // horizon vanished, because a light stroke on a lighter ground has *less*
    // contrast, not more. Held at the void's own .34/.20, the signature
    // survives the move. Reasoned wrong, measured right.
    frame.querySelector('.mesh-a').setAttribute('opacity', 'var(--mesh-a)');
    frame.querySelector('.mesh-b').setAttribute('opacity', 'var(--mesh-b)');
    out.appendChild(node);
  });

  document.querySelectorAll('[data-icon]').forEach(function (n) {
    n.innerHTML = ICON[n.dataset.icon];
  });

  /* The title yields and nothing else does — the header rule, applied per
     frame, so all three measure the same and the ground stays the only
     variable on the page. */
  document.querySelectorAll('.frame').forEach(function (f) {
    var t = f.querySelector('.title');
    var size = parseFloat(getComputedStyle(t).fontSize), floor = size * 0.55, guard = 0;
    while (t.scrollWidth > t.clientWidth + 0.5 && size > floor && guard++ < 40) {
      size *= 0.94; t.style.fontSize = size + 'px';
    }
    f.querySelectorAll('.head b').forEach(function (b) {
      var s = parseFloat(getComputedStyle(b).fontSize), fl = s * 0.78, g2 = 0;
      while (b.scrollWidth > b.clientWidth + 0.5 && s > fl && g2++ < 40) {
        s *= 0.95; b.style.fontSize = s + 'px';
      }
    });
    function baselineOf(el) {
      var p = document.createElement('span');
      p.style.cssText = 'display:inline-block;width:0;height:0;overflow:hidden';
      el.appendChild(p); var y = p.getBoundingClientRect().bottom; el.removeChild(p);
      return y;
    }
    var w = f.querySelector('.wordmark span');
    t.style.position = 'relative';
    t.style.top = (baselineOf(w) - baselineOf(t)) + 'px';
  });

  var foot = document.createElement('div');
  foot.className = 'foot';
  foot.innerHTML =
    'للمقارنة، مقيسة من لقطات التطبيقات: <b>Hot&nbsp;Player</b> ‏#0F172A ← #1E293B ' +
    '(‏L* 7.96 ← 16.39، ارتفاع 8.43) و<b>TiviMate</b> ‏#121619 ← #262A2D ' +
    '(‏L* 6.98 ← 16.78، ارتفاع 9.81).<br>' +
    'الألوان الأربعة والخطوط وكل مقاس في هذه الصفحة متطابقة في الإطارات الثلاثة. ' +
    'الشيء الوحيد المشتق الذي يتحرك مع الأرضية هو القرص: 34% على الأسود، و24% ' +
    'مع سحب الأيقونة 16% نحو الأبيض على السليت — وإلا نزل الأزرق إلى 2.95:1 ' +
    'والبنفسجي إلى 2.57:1 داخل قرصيهما.';
  out.appendChild(foot);

  /* Measured, not reasoned: if a card overflows here it overflows on a device. */
  var over = [];
  document.querySelectorAll('.card').forEach(function (c, i) {
    var body = c.querySelector('.body');
    var need = body.scrollHeight + 2 * parseFloat(getComputedStyle(c).paddingTop);
    if (need - c.getBoundingClientRect().height > 0.5) over.push('card ' + i + ' overflows');
    var d = c.querySelector('.d');
    if (d.scrollHeight - d.clientHeight > 1) over.push('card ' + i + ' desc clamped');
  });
  console.log(JSON.stringify({ frames: document.querySelectorAll('.frame').length, overflow: over }));
})();
</script>
