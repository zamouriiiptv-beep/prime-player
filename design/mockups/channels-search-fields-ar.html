<!DOCTYPE html>
<!-- The channels board's two search fields: the band's (channels) and the rail's (bouquets), as they are and as they are meant to be.
     Phone geometry, 833x385dp, one px per dp; rendered at 2x. Not the app: a drawing of how the screen is meant to look.
       **What changes is the pill's inside, and only that:**
         - the mark and the words sit further from the pill's ends -- 13dp, where the band's field has 5 (`controlPadH` at this width,
           its floor) and the rail's 8 (`railPadH`, its floor): a mark and a hint against the edge of a pill read as clipped;
         - the rail's field takes the band's direction rule: the mark at the left and the words starting from the end the language
           starts from -- on the right in Arabic -- where it has been drawing them against the mark whatever the language;
         - both hints are phrased as a noun, "البحث في القنوات" and "البحث في الباقات" (they were "ابحث في ..."): each says what its
           field searches and nothing it does not. The rail's: it searches the bouquets' names and says so, and it
           has room -- about 70dp of the 135dp the words have in a 180dp field at this size.
       `?frame=sheet` is the default: both screens, then the three pills close up (zoomed 2x) with their captions. -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>خانتا البحث — لوحة القنوات</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05040E;color:#fff;font-family:"Inter","DejaVu Sans",system-ui,sans-serif;width:833px}
.cap{padding:14px 20px 8px;font-size:13px;line-height:1.7;color:#cfd0ea;direction:rtl}
.cap b{color:#fff}
.cap em{font-style:normal;color:#ffc15a}
.screen{position:relative;width:833px;height:385px;overflow:hidden;direction:ltr;background:linear-gradient(140deg,#1c1a41 0%,#141a3b 55%,#0f1d3b 100%)}
.abs{position:absolute}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ar{direction:rtl;unicode-bidi:plaintext}
.top{left:0;top:0;width:833px;height:42px;background:rgba(6,9,20,.78)}
.logo{left:58px;top:10px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:17px}
.logo i{display:block;width:22px;height:22px;border-radius:50%;background:conic-gradient(#e0407a,#6a4cff,#2c9cff,#e0407a)}
.crumb{left:233px;top:6px;font-size:11px;color:#a58cff;direction:rtl}
.crumb span{display:block;color:#e0e1f4;margin-top:1px;font-size:11px;direction:ltr;text-align:left}
.clock{right:21px;top:6px;text-align:center;font-weight:700;font-size:19px;line-height:1}
.clock small{display:block;font-size:9.5px;font-weight:400;color:#c3c4e2;margin-top:2px}
.frame{left:44px;top:42px;width:781px;height:335px;border-radius:10px;border:1px solid rgba(110,100,170,.45);background:rgba(255,255,255,.012)}
/* the two fields */
.pill{display:flex;align-items:center;gap:6px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);direction:ltr}
.pill .tx{flex:1;min-width:0;font-size:10.5px;color:#aeb0cc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;unicode-bidi:plaintext}
.pill .tx.l{text-align:left;direction:rtl}
.pill svg{color:#aeb0cc}
/* rail */
.rt{position:absolute;left:52px;font-size:13px;font-weight:700;white-space:nowrap}
.rr{position:absolute;left:48px;width:180px;height:35px;border-radius:7px;padding:3px 4px 0 4px;font-size:13px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr small{display:block;font-size:10.5px;color:#d3d4ea;margin-top:1px;font-weight:400}
.rr.sel{background:#9b6bff;color:#fff}
.list{left:239px;width:297px;top:46px;height:327px;border-radius:10px;background:rgba(35,35,61,.75);border:1px solid #393651;overflow:hidden}
.list .hd{text-align:center;font-weight:700;font-size:13.5px;position:absolute;left:0;right:0;top:11px;color:#e6e6f6}
.lr{position:absolute;left:12px;right:12px;height:27px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.lr .no{width:30px;height:17px;border-radius:3px;background:rgba(255,255,255,.06);border:1px solid #4a4764;font-size:12px;text-align:center;line-height:15px;flex:none}
.lr .lg{width:14px;height:14px;border-radius:50%;flex:none}
.ck{display:block;border-radius:50%;border:1.6px solid #a3a5bf;flex:none;margin-left:auto;width:11px;height:11px}
.pv{left:543px;top:46px;width:277px;height:157px;border-radius:9px;background:linear-gradient(160deg,#c9a56a,#6f9a5a 55%,#d6b574);overflow:hidden}
.info{left:543px;top:207px;width:277px;height:97px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid #2f3952;padding:5px 6px;font-size:10.5px}
.info .t{display:flex;align-items:center;gap:6px;font-weight:700;font-size:11px;height:22px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:3px}
.acts{left:543px;top:329px;width:277px;height:48px;display:flex;gap:5px}
.acts div{flex:1;border-radius:7px;background:#2b334a;border:1px solid #3a4560}
.acts div.on{background:#1b1038;border-color:#5a4a8c}
.tag{position:absolute;left:6px;top:4px;font-size:9px;background:#ff5b6b;color:#fff;border-radius:4px;padding:1px 5px;direction:rtl;z-index:5}
.tag.ok{background:#1fc89a;color:#052018}
/* the close-ups */
.zoom{padding:4px 24px 0;direction:ltr}
.zoom .nm{font-size:11px;color:#cfd0ea;direction:rtl;margin:12px 0 6px;line-height:1.5}
.zoom .nm b{color:#fff}
.zoom .z{zoom:2;background:linear-gradient(140deg,#1c1a41,#141a3b);padding:8px 10px;border-radius:6px;display:inline-block}
.zoom .z.bar{display:block}
</style></head><body>
<script>
const MAG='<svg width="12" height="12" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>';
const MAG_R='<svg width="13" height="13" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>';
const BOUQ=[["FR| FRANCE 4K",28,1],["FR| FRANCE VIP RAW",214],["FR| FRANCE SPORT VIP RAW",143],["FR| FRANCE FHD",173],["FR| FRANCE HD",200],["FR| FRANCE LQ",122]];
const LIST=[[2,"FR| TF1 4K","#2e56d6"],[3,"FR| FRANCE 2 4K","#e23a4a","FHD"],[4,"FR| FRANCE 3 4K","#3a86ff"],[5,"FR| FRANCE 4 4K","#a35bff","FHD"],[6,"FR| FRANCE 5 4K","#2ecb7a"],[7,"FR| M6 4K","#f0f0f0"],[8,"FR| ARTE 4K","#ff8a3c"],[9,"FR| W9 4K","#3a86ff"],[10,"FR| C8 4K","#7a7a8a"],[11,"FR| TF1 SERIES 4K","#3a86ff"]];

/* the two fields: [inset, where the words start, the rail's text] */
function headPill(mode){
  const inset = mode==='now'?5:13;
  return `<div class="abs pill" style="left:380px;top:11px;width:179px;height:21px;padding:0 ${inset}px">${MAG}<span class="tx ar" style="text-align:right">${mode==='now'?'ابحث في القنوات':'البحث في القنوات'}</span></div>`;
}
function railPill(mode,text,top,wide){
  if(mode==='now') return `<div class="abs pill" style="left:48px;top:${top}px;width:180px;height:27px;padding:0 8px">${MAG_R}<span class="tx ar l" style="text-align:left">ابحث في الباقات</span></div>`;
  return `<div class="abs pill" style="left:48px;top:${top}px;width:180px;height:27px;padding:0 13px">${MAG_R}<span class="tx ar" style="text-align:right">${text}</span></div>`;
}
function screen(mode,text){
  let r='';
  const y0=170;
  BOUQ.forEach(([n,c,sel],i)=>{r+=`<div class="rr ${sel?'sel':''}" style="top:${y0+i*35}px">${n}<small class="ar" style="text-align:left">المجموع: ${c}</small></div>`});
  let l='<div class="hd">##### FRANCE 4K #####</div>';
  LIST.forEach(([no,nm,col,tag],i)=>{l+=`<div class="lr" style="top:${36+i*27.5}px"><span class="no">${no}</span><i class="lg" style="background:${col}"></i><span>${nm}</span>${tag?'<span style="margin-left:auto;font-size:9.5px;color:#9b6bff">FHD</span><i class="ck" style="margin-left:6px"></i>':'<i class="ck"></i>'}</div>`});
  return `<div class="screen"><div class="abs top"></div><div class="abs logo"><i></i>Castivio</div>
  <div class="abs crumb ar">البث المباشر<span>FR| FRANCE 4K</span></div>${headPill(mode)}
  <div class="abs clock">09:08<small>5-11-2026</small></div><div class="abs frame"></div>
  ${railPill(mode,text,46)}
  <div class="rt ar" style="top:84px">كل القنوات</div><div class="rt ar" style="top:110px">المفضلة</div><div class="rt ar" style="top:136px">شوهدت مؤخرًا</div>
  <div class="abs" style="left:52px;width:172px;top:162px;height:1px;background:rgba(255,255,255,.2)"></div>
  ${r}<div class="abs list">${l}</div><div class="abs pv"></div>
  <div class="abs info"><div class="t"><span>FR| FRANCE 4 4K</span></div><div style="font-size:11.5px;font-weight:700;margin:3px 0">Un jour, une question</div></div>
  <div class="abs acts"><div></div><div class="on"></div><div></div><div></div><div></div></div>
  <span class="tag ${mode==='now'?'':'ok'}">${mode==='now'?'الآن':'المقترح'}</span></div>`;
}
const A='البحث في الباقات';
const pill=(w,inset,text,align,mark)=>`<div class="pill" style="width:${w}px;height:${mark}px;padding:0 ${inset}px">${MAG_R}<span class="tx ar" style="text-align:${align}">${text}</span></div>`;
const q=new URLSearchParams(location.search), frame=q.get('frame')||'sheet';
let html='';
if(frame==='now') html=screen('now'); else if(frame==='new') html=screen('new',A); else {
 html+=`<div class="cap"><b>١ — الآن:</b> المفتاح والعبارة ملاصقان لحافّتَي الخانة (٥dp في خانة القنوات و٨dp في خانة الباقات)، وفي خانة الباقات تبدأ العبارة من جهة المفتاح لا من جهة اللغة.</div>`+screen('now');
 html+=`<div class="cap"><b>٢ — المقترح:</b> <em>١٣dp</em> من كل حافّة في الخانتين، والعبارة في الاثنتين تبدأ من جهة اللغة (يمين العربية) والمفتاح عن اليسار. نص خانة الباقات «البحث في الباقات» (بدل «ابحث في الباقات»)؛ وخانة القنوات «البحث في القنوات» (بدل «ابحث في القنوات»).</div>`+screen('new',A);
 html+=`<div class="cap"><b>٣ — الخانات عن قرب (×٢):</b></div><div class="zoom">`;
 html+=`<div class="nm ar"><b>خانة القنوات — الآن</b> (٥dp)</div><div class="z">${pill(179,5,'ابحث في القنوات','right',21)}</div>`;
 html+=`<div class="nm ar"><b>خانة القنوات — المقترح</b> (١٣dp)</div><div class="z">${pill(179,13,'البحث في القنوات','right',21)}</div>`;
 html+=`<div class="nm ar"><b>خانة الباقات — الآن</b> (٨dp والعبارة بجانب المفتاح)</div><div class="z">${pill(180,8,'ابحث في الباقات','left',27)}</div>`;
 html+=`<div class="nm ar"><b>خانة الباقات — المقترح</b> (١٣dp والعبارة من جهة اللغة)</div><div class="z">${pill(180,13,A,'right',27)}</div>`;
 html+='</div><div style="height:16px"></div>';
}
document.write(html);
</script>
</body></html>
