<!DOCTYPE html>
<!-- The radio with a second source beside the subscription's: a directory of the world's stations, by country.
     Phone geometry, 833x385dp, one px per dp; rendered at 2x. Not the app: a drawing of how the screen is meant to look.
     Station names, counts and countries are examples.
       **What the owner asked for:** the subscription's radio stays exactly as it is, and a worldwide radio is added next to it, as other players
       have one -- country bouquets, any station in the world, whatever the subscription carries.
       **What is drawn (the proposal):**
         - a switch at the head of the rail, two ends: "My subscription" at the start (the reader's right) and "World" beside it. It changes what the
           rail lists and where the stations come from, and nothing else on the board: the band, the order control, the picture that says radio and
           the plate of what is playing are the board's own in both. A television reaches it with Up from the first rail row, a phone by touch.
         - in **World** the rail lists, after the three fixed entries (Most listened, Favourites, Recently played), the countries -- by their name in
           the reader's language, with the number of stations as the bouquets have theirs -- and its field filters the countries.
         - the stations of a country are rows exactly like the subscription's, in the order the directory ranks them (most listened first), with the
           station's rate and format on the second line. On the lists that mix countries (Most listened, Favourites, Recently played, a search) the
           second line is the country instead, as it is the bouquet in the subscription's.
         - **Favourites and Recently played are the radio's, and hold stations of both sources**: a station of the world that was liked is here beside the
           subscription's, and says which country it is of.
         - the field in the band searches the world's stations as the viewer types (120 ms, as everywhere), in World, and the subscription's in the other.
         - three states of the list the subscription's radio never had, because its list is on the device: **loading** (rows the shape of the rows to
           come, and the country list's own line), **nothing found** and **unreachable** (the sentence and a Retry that does what the rail's refresh does).
         - the directory's name stands at the foot of the rail, quietly: it is a community directory, and the application says whose it is.
       `?frame=sheet` is the default. -->

<script>
const I={
 search:'<svg width="12" height="12" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
 sort:'<svg width="12" height="12" viewBox="0 0 24 24"><path d="M4 7h10M4 12h6M4 17h10M17 9v8M14 14l3 3 3-3"/></svg>',
 prev:'<svg width="17" height="17" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>',
 next:'<svg width="17" height="17" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>',
 pause:'<svg width="22" height="22" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>',
 heart:'<svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.5-7 10-7 10z"/></svg>',
 timer:'<svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l3 2M9 3h6"/></svg>',
 up:'<svg width="14" height="14" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',
 pic:'<svg width="12" height="12" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>'};
const EQ='<span class="eq"><i style="height:5px"></i><i style="height:9px"></i><i style="height:6px"></i></span>';
const LG={m1:['#e8512b','M1','#fff'],hit:['#f4c430','HIT','#7a1d1d'],chada:['#2a7ede','CH','#fff'],mars:['#1f3c88','MARS','#fff'],cap:['#1f9d6a','CAP','#fff'],atl:['#6a4cff','ATL','#fff'],bbc:['#bb1919','BBC','#fff'],npr:['#222','NPR','#fff'],rfi:['#d52b1e','RFI','#fff'],r538:['#222','538','#8f3fe6'],nrj:['#e0407a','NRJ','#fff']};
const lg=(k)=>{ if(!k) return `<span class="lg none">${I.pic}</span>`; const [bg,t,c]=LG[k]; return `<span class="lg" style="background:${bg};color:${c}">${t}</span>`; };
const radioArt=`<svg width="150" height="120" viewBox="0 0 150 120">
  <g stroke-width="3.5" style="color:#4c9bff" opacity=".9"><path d="M22 52c-8 6-8 22 0 28M12 44c-14 11-14 37 0 48"/></g>
  <g stroke-width="3.5" style="color:#9b6bff" opacity=".9"><path d="M128 52c8 6 8 22 0 28M138 44c14 11 14 37 0 48"/></g>
  <path d="M44 36l50-22" stroke="#cfd0ea" stroke-width="3"/>
  <rect x="34" y="34" width="82" height="62" rx="12" fill="#1c1840" stroke="#8f78ff" stroke-width="3"/>
  <circle cx="60" cy="65" r="17" fill="#141031" stroke="#4c9bff" stroke-width="3"/>
  <path d="M52 58h16M52 65h16M52 72h16" stroke="#4c9bff" stroke-width="2.4"/>
  <circle cx="98" cy="52" r="5" fill="#9b6bff" stroke="none"/><circle cx="98" cy="75" r="5" fill="#4c9bff" stroke="none"/>
  <path d="M86 63h24" stroke="#8f78ff" stroke-width="3"/></svg>`;

/* examples */
const COUNTRIES=[['المغرب',105],['الجزائر',64],['تونس',48],['مصر',152],['السعودية',87],['الإمارات',60],['السنغال',57],['فرنسا',1180],['هولندا',412],['تركيا',690]];
const MA=[['Medi 1 Radio','m1','128 kbps · MP3'],['Hit Radio','hit','128 kbps · AAC'],['Chada FM','chada','96 kbps · MP3'],['Radio Mars','mars','128 kbps · MP3'],['Cap Radio','cap','64 kbps · AAC'],['Atlantic Radio','atl','128 kbps · MP3'],['MFM Radio',null,'128 kbps · MP3'],['Radio Aswat',null,'96 kbps · AAC'],['Med Radio',null,'128 kbps · MP3'],['Radio Plus Agadir',null,'64 kbps · MP3']];
const TOP=[['BBC World Service','bbc','المملكة المتحدة'],['NPR News','npr','الولايات المتحدة'],['RFI Monde','rfi','فرنسا'],['Radio 538','r538','هولندا'],['NRJ','nrj','فرنسا'],['Medi 1 Radio','m1','المغرب'],['Hit Radio','hit','المغرب'],['إذاعة القرآن الكريم',null,'السعودية'],['Chada FM','chada','المغرب'],['Radio Mars','mars','المغرب']];
const GENRES=[['News',310],['Pop',900],['Rock',520],['Quran',280],['Jazz',210],['Classical',190]];
const FAV=[['Medi 1 Radio','m1','المغرب',1],['BBC World Service','bbc','المملكة المتحدة',1],['Radio Mars','mars','تستريح — تعذّر تشغيلها مؤخرًا',1,1]];
const FOUND=[['Medi 1 Radio','m1','المغرب'],['Medi 1 Afrique',null,'المغرب'],['Medina FM',null,'تونس'],['Media Radio',null,'مصر'],['Medi Radio Marrakech',null,'المغرب'],['Mediterranean FM',null,'فرنسا']];

function rows(list, o){
  let l='';
  list.forEach((s,i)=>{
    const [nm,lk,line,fav,dim]=s;
    const focus = i===o.focus, sounding = i===o.sounding;
    l+=`<div class="lr ${focus?'focus':''}" style="top:${4+i*33}px;${dim?'opacity:.5':''}"><span class="no">${i+1}</span>${lg(lk)}<span class="nm"><b>${nm}</b><small class="${/[\u0600-\u06FF]/.test(line)?'rtl':''}">${line}</small></span>${sounding?`<span class="disc"><svg width="8" height="8" viewBox="0 0 24 24" style="fill:#052018;stroke:none"><path d="M8 5v14l11-7z"/></svg></span>${EQ}`:''}<span class="heart ${fav?'on':''}">${I.heart}</span></div>`;
  });
  return l;
}
function rail(world, sel, opts){
  opts=opts||{};
  let r=`<div class="abs seg" style="left:48px;top:46px;width:180px"><span class="${world?'':'on'}">اشتراكي</span><span class="${world?'on':''}">العالم</span></div>`;
  r+=`<div class="abs pill ${opts.typed?'on':''}" style="left:48px;top:73px;width:180px;height:24px;padding:0 13px">${I.search}<span class="ar" style="flex:1;text-align:right">${world?(opts.genres?'البحث في الأنواع':'البحث في الدول'):'البحث في الباقات'}</span></div>`;
  const fixed = world?['الأكثر استماعًا','المفضلة','استمع مؤخرًا',opts.genres?'الدول':'الأنواع']:['جميع المحطات','المفضلة','استمع مؤخرًا'];
  let y=103;
  fixed.forEach((n,i)=>{r+=`<div class="rr ${sel===i?'sel':''}" style="top:${y}px;height:25px;padding-top:5px">${n}</div>`; y+=27;});
  y+=3;
  r+=`<div class="abs" style="left:52px;width:172px;top:${y}px;height:1px;background:rgba(255,255,255,.2)"></div>`; y+=5;
  if(world){
    if(opts.saved){ r+=`<div class="rr" style="top:${y}px;height:25px;padding-top:5px;color:#aeb0cc">من القائمة المحفوظة</div>`; y+=27; }
    (opts.genres?GENRES:COUNTRIES).slice(opts.from||0).forEach(([n,c],i)=>{ if(y>308) return; const s=sel===10+i+(opts.from||0); r+=`<div class="rr ${s?'sel':''}" style="top:${y}px;height:33px">${n}<small>المجموع: ${c}</small></div>`; y+=35; });
    r+=`<div class="attr">الدليل: radio-browser.info</div>`;
  } else {
    [['NL| RADIO LIVE',248],['TR| RADIO MIX',740]].forEach(([n,c])=>{ r+=`<div class="rr" style="top:${y}px;height:33px">${n}<small>المجموع: ${c}</small></div>`; y+=35; });
  }
  return r;
}
function band(crumb, search, searching, world){
  return `<div class="abs top"></div><div class="abs logo"><i></i>Castivio</div>
  <div class="abs crumb ar">الراديو<span>${crumb}</span></div>
  <div class="abs pill ${searching?'on':''}" style="left:380px;top:11px;width:179px;height:21px;padding:0 13px">${I.search}<span class="ar" style="flex:1;text-align:right">${search}</span></div>
  ${world?'':`<div class="abs pill" style="left:592px;top:5px;width:145px;height:34px;padding:0 12px">${I.sort}<span class="ar" style="flex:1;text-align:right;font-size:10px">الترتيب: الأكثر استماعًا</span></div>`}
  <div class="abs clock">09:45<small>5-11-2026</small></div><div class="abs frame"></div>`;
}
function plateHtml(name, logo, line, playing){
  return `<div class="abs plate"><div class="id">${lg(logo)}<div class="t"><b>${name}</b><span class="ar">${line}</span></div>${playing?EQ:''}</div>
   <div class="ctl"><span class="cb">${I.prev}</span><span class="cb main">${playing?I.pause:I.pause}</span><span class="cb">${I.next}</span></div>
   <div class="sub"><span class="cb ar" style="color:#ff6b8a">${I.heart}المفضلة</span><span class="cb ar">${I.timer}مؤقّت النوم</span><span class="cb ar">${I.up}فتح</span></div></div>`;
}
function plateIdle(){
  return `<div class="abs plate"><div class="id"><span class="lg" style="width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.06);border:1px dashed #4a4764"></span><div class="t"><b class="ar" style="color:#aeb0cc">اختر محطة</b><span class="ar">اضغط على محطة لتستمع إليها</span></div></div>
   <div class="ctl" style="opacity:.45"><span class="cb">${I.prev}</span><span class="cb main">${I.pause}</span><span class="cb">${I.next}</span></div>
   <div class="sub" style="opacity:.45"><span class="cb ar">${I.heart}المفضلة</span><span class="cb ar">${I.timer}مؤقّت النوم</span><span class="cb ar">${I.up}فتح</span></div></div>`;
}
const pic=(live)=>`<div class="abs pic">${radioArt}${live?'<span class="livebadge ar">مباشر</span>':''}</div>`;
const skels=(n)=>Array.from({length:n},(_,i)=>`<div class="skel" style="top:${4+i*33}px"><i style="width:26px;height:16px"></i><i style="width:21px;height:21px;border-radius:5px"></i><div class="t"><i style="height:9px;width:${150-(i%3)*30}px"></i><i style="height:6px;width:${90-(i%2)*20}px"></i></div></div>`).join('');

function screen(mode){
  if(mode==='genre') return `<div class="screen">${band('العالم · News','البحث في محطات العالم',false,true)}${rail(true,10,{genres:true})}<div class="abs list">${rows([['BBC World Service','bbc','128 kbps · MP3'],['NPR News','npr','96 kbps · AAC'],['RFI Monde','rfi','128 kbps · MP3'],['Medi 1 Radio','m1','128 kbps · MP3']],{focus:0})}</div>${pic(false)}${plateIdle()}<span class="tagcap">العالم — نوع</span></div>`;
  if(mode==='country') return `<div class="screen">${band('العالم · المغرب','البحث في محطات العالم',false,true)}${rail(true,10)}<div class="abs list">${rows(MA,{focus:0,sounding:0})}</div>${pic(true)}${plateHtml('Medi 1 Radio','m1','المغرب · مباشر',true)}<span class="tagcap">العالم — دولة</span></div>`;
  if(mode==='top') return `<div class="screen">${band('العالم · الأكثر استماعًا','البحث في محطات العالم',false,true)}${rail(true,0)}<div class="abs list">${rows(TOP,{focus:1})}</div>${pic(false)}${plateIdle()}<span class="tagcap">العالم — الأكثر استماعًا</span></div>`;
  if(mode==='search') return `<div class="screen">${band('العالم · نتائج «med»','med',true,true)}${rail(true,0)}<div class="abs list">${rows(FOUND,{focus:0})}</div>${pic(false)}${plateIdle()}<span class="tagcap">العالم — بحث</span></div>`;
  if(mode==='fav') return `<div class="screen">${band('العالم · المفضلة','البحث في محطات العالم',false,true)}${rail(true,1)}<div class="abs list">${rows(FAV,{focus:0})}</div>${pic(false)}${plateIdle()}<span class="tagcap">العالم — المفضلة</span></div>`;

}
const states={
 loading:`<div class="mini"><div class="msg"><b>جارٍ التحميل…</b></div></div>`,
 empty:`<div class="mini"><div class="msg"><b>لا نتائج لـ «medzz»</b><span>جرّب حروفًا أقل، أو جزءًا من الاسم.</span><span class="btn">مسح</span></div></div>`,
 off:`<div class="mini"><div class="msg"><b>لا يوجد اتصال</b><span>تحقق من اتصالك بالإنترنت ثم أعد المحاولة.</span><span class="btn">حاول مرة أخرى</span></div></div>`,
 down:`<div class="mini"><div class="msg"><b>الدليل لا يردّ</b><span>أعد المحاولة بعد قليل.</span><span class="btn">حاول مرة أخرى</span></div></div>`};

const q=new URLSearchParams(location.search), frame=q.get('frame')||'sheet';
let html='';
if(['country','top','search','fav','sub','genre'].includes(frame)) html=screen(frame); else {
 html+=`<div class="cap"><b>١ — راديو اشتراكك كما هو، ومعه المفتاح:</b> في رأس الشريط الجانبي <em>مفتاح بطرفين</em>: «الاشتراك» و«العالم». كل ما في اللوحة بقي: الباقات والمحطات واللوحة والصورة والترتيب. المفتاح هو الإضافة الوحيدة هنا. تبديل المصدر يُوقف الصوت: لا يبقى شيء يعزف دون لوحة أمامك.</div>`+screen('sub');
 html+=`<div class="cap"><b>٢ — العالم، دولة مختارة:</b> الشريط يعدّ بعد المدخلات الأربعة (الأكثر استماعًا، المفضلة، استمع مؤخرًا، الأنواع) <em>الدول بأسمائها بلغة القارئ</em> ودولة الجهاز أولًا، وعدد محطات كل دولة كما للباقات، وخانته تصفّي الدول. لا زرّ ترتيب في العالم: الترتيب بالأكثر استماعًا. المحطات صفوف اللوحة نفسها <em>مرتّبة بالأكثر استماعًا</em>، وتحت الاسم جودة البثّ وصيغته. محطة بلا شعار تأخذ بلاطة الصورة نفسها. اسم الدليل في أسفل الشريط بخطّ خافت.</div>`+screen('country');
 html+=`<div class="cap"><b>٣ — الأكثر استماعًا في العالم:</b> أول المدخلات، وهو ما يُفتح عليه «العالم» قبل اختيار دولة. تحت كل محطة <em>دولتها</em> (كما تحت محطة المفضلة باقتها).</div>`+screen('top');
 html+=`<div class="cap"><b>٤ — البحث في العالم:</b> الخانة في الشريط العلوي تبحث وقت الكتابة (١٢٠ms، والاستعلام السابق يُلغى)، والإطار المضيء يدلّ على أنها تعمل، ودول النتائج تحت أسماء المحطات.</div>`+screen('search');
 html+=`<div class="cap"><b>٥ — المفضلة و«استمع مؤخرًا» في العالم:</b> <em>خاصتان بالعالم</em> في قاعدة بيانات منفصلة، لا تختلطان بمفضلة اشتراكك ولا بما شاهدته منه. المحطة التي تعذّر تشغيلها مؤخرًا تبقى في المفضلة <em>باهتة</em> وتقول إنها تستريح، ولا تُحذف أبدًا.</div>`+screen('fav');
 html+=`<div class="cap"><b>٦ — حالات القائمة التي لم يكن لراديو الاشتراك مثلها</b> (قائمته على الجهاز): جارٍ التحميل، لا نتائج للبحث، لا اتصال، والدليل لا يردّ — وفي الأخيرين زرّ «حاول مرة أخرى». الدول والأنواع محفوظة على الجهاز: إن غاب الدليل بقي الشريط وكُتب تحت مدخلاته «من القائمة المحفوظة».</div><div class="cells">${['loading','empty','off','down'].map(s=>`<div><div class="nmx"><b>${{loading:'جارٍ التحميل',empty:'لا نتائج',off:'لا اتصال',down:'الدليل لا يردّ'}[s]}</b></div>${states[s]}</div>`).join('')}</div>`;
 html+=`<div class="cap"><b>٧ — الأنواع:</b> مدخل «الأنواع» في الشريط يبدّل قائمة الدول بقائمة الأنواع (نوع بعدد محطاته)، ويصير «الدول» ليعود، وتتغيّر خانة الشريط إلى «البحث في الأنواع».</div>`+screen('genre');
 html+=`<div class="cap" style="padding-top:16px"><b>ما في الكود:</b> مصدر ثانٍ للراديو في وحدة بياناته <code>:data:worldradio</code> بقاعدة بيانات خاصة <code>world_radio.db</code>، خلف واجهة صرفة في <code>:domain</code>. محطة العالم <em>ليست Channel</em> ولا تدخل جلسة راديو الاشتراك ولا مفضلته ولا ما شاهدتَه: لها جلستها ومخزنها. الدليل يُسأل عن صفحات من ٦٠ محطة (لا <code>getAll()</code>)، والخوادم تُكتشف بالاسم وتُجرَّب بالتناوب. كل محطة تُفحص محليًا لا بـ <code>hidebroken</code> وحدها: خمس ثوانٍ مستقرة تؤكدها، والفاشلة تستريح ساعة ثم ٦ ثم يومًا ثم ٣ أيام ولا تُحذف، وغير المستقرة لا تُعدّ فاشلة.</div><div style="height:12px"></div>`;
}
document.write(html);
