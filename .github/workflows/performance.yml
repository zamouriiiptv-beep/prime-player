name: Performance budgets

# Runs on every commit. Fails the build when a budget is breached, which is the
# only thing that keeps a budget honest over a project's lifetime.
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  budgets:
    name: JVM budgets (blocking)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # No Android SDK needed: the gated metrics live in pure-Kotlin modules,
      # which is exactly why they can be measured on every commit.
      - name: Run performance budgets
        id: budgets
        run: |
          set -o pipefail
          ./gradlew :benchmark:jvm:test --no-daemon --console=plain \
            | tee benchmark-output.txt

      - name: Summarise measurements
        if: always()
        run: |
          {
            echo "## Performance budgets"
            echo
            if grep -q '\[budget\]' benchmark-output.txt; then
              echo '| Metric | Measurement |'
              echo '| --- | --- |'
              grep '\[budget\]' benchmark-output.txt \
                | sed -e 's/^ *//' -e 's/\[budget\] //' \
                | awk -F': ' '{printf "| %s | %s |\n", $1, $2}'
            else
              echo '_No measurements were recorded — the suite failed before reporting._'
            fi
            echo
            if [ "${{ steps.budgets.outcome }}" = "success" ]; then
              echo 'All budgets met.'
            else
              echo '**A budget was breached — see the failing test for the measurement, the budget and the likely cause.**'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-budgets
          path: |
            benchmark-output.txt
            benchmark/jvm/build/reports/tests/test/**
          if-no-files-found: warn
