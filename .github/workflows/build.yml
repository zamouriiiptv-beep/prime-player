name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # A compose test that renders an indefinite spinner never reaches idle, and without
    # this the job sat on one blocked assertion until GitHub's six-hour default killed it.
    # A hang should cost minutes and read as a failure, not a day and read as "running".
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Named explicitly rather than left to the action's default of `tools
      # platform-tools`. The obsolete `tools` package drags in the Android
      # Emulator -- half a gigabyte this job has no use for, since it runs no
      # instrumented tests -- and a corrupt download of it has already failed a
      # build outright: "An error occurred while preparing SDK package Android
      # Emulator: Error on ZipFile unknown archive". Fewer downloads is a
      # faster build and one less thing that can be broken by a bad mirror.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # No --stacktrace: a Kotlin compile error buries its own `e: file:…` lines
      # under 200 lines of Gradle internals, which makes the log useless for the
      # one thing it is needed for.
      - name: Build debug APK
        # The OpenSubtitles credentials, when — and only when — the repository has them.
        #
        # `Secrets.kt` reads `local.properties` first and the environment second, so a
        # developer's machine needs nothing here and this is how the same three values
        # reach a build that has no such file. An unset secret is an empty string, which is
        # the unconfigured state the whole feature is built to survive: the APK is the same
        # APK, and the subtitle search says it is not set up rather than failing.
        #
        # Setting these bakes the values into every APK this job publishes, where anyone
        # holding the file can read them out. That is ordinary for an API key and is not
        # ordinary for an account password — which is why they are left to a deliberate act
        # rather than turned on here.
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          OPENSUBTITLES_USERNAME: ${{ secrets.OPENSUBTITLES_USERNAME }}
          OPENSUBTITLES_PASSWORD: ${{ secrets.OPENSUBTITLES_PASSWORD }}
        run: |
          attempt=0
          until ./gradlew assembleDebug --no-daemon --console=plain; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "Build failed after $attempt attempts."
              exit 1
            fi
            echo "Attempt $attempt failed (possibly a transient network error). Retrying in $((attempt * 20))s..."
            sleep $((attempt * 20))
          done

      # Android-module unit tests need the SDK, so they run here rather than in
      # the pure-JVM "Unit tests" job. The database module's queries are verified
      # against real SQLite through Robolectric — a Room query that only gets
      # exercised by launching the app on a TV is a query nobody verifies.
      #
      # The player modules are listed because they were not, and that is worse than
      # having no tests: the job reported success over two rounds of player work while
      # :feature:player, :playback:engine-media3 and :data:localmedia never ran a single
      # test. A gate nobody runs is still believed.
      - name: Run Android unit tests
        run: |
          ./gradlew --no-daemon --console=plain \
            :core:design:testDebugUnitTest \
            :data:database:testDebugUnitTest \
            :data:networking:testDebugUnitTest \
            :data:playlist:testDebugUnitTest \
            :data:activation:testDebugUnitTest \
            :data:entitlement:testDebugUnitTest \
            :data:localmedia:testDebugUnitTest \
            :data:subtitles:testDebugUnitTest \
            :feature:activation:testDebugUnitTest \
            :feature:licence:testDebugUnitTest \
            :feature:player:testDebugUnitTest \
            :playback:engine-media3:testDebugUnitTest \
            :playback:engine-vlc:testDebugUnitTest \
            :app:testDebugUnitTest

      # The schema is what any future migration is written against, so its export
      # is verified rather than assumed. See the script for what it catches.
      - name: Verify the exported Room schema
        run: ./scripts/verify-room-schema.sh

      - name: Upload exported schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: data/database/schemas/**/*.json
          # `error`, not `warn`: the verify step above already exits 1 when KSP exported
          # nothing, so by the time this runs the files exist or the job is already red.
          # Downgrading this to a warning does not make a failing build pass — it only
          # removes the second place that would have said why.
          if-no-files-found: error

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: castivio-tv-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
