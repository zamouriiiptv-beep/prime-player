<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Castivio — إضافة قائمة تشغيل</title>
<style>
/* ============================================================================
   Castivio — the first screen, where a subscription is added.

   ?frame=tv | p873 | p800      the three frames, at their real dp geometry
   ?lang=en | es | pt           the same screen mirrored, and its two longest
   ---------------------------------------------------------------------------

   This pass is a review, not a redesign. The composition, the palette, the
   lockup and the ground are the approved ones and are untouched. What changed
   is typography, spacing, hierarchy and the Arabic -- the four things a screen
   is judged on once its layout is settled.

   ## Typography

   The screen sets two scripts and was measuring only one of them. Three faults,
   in order of what they cost:

   1. **Negative tracking on Arabic.** The title carried -0.2px, which is a
      sensible Latin display correction and is wrong for Arabic at any size: the
      script joins, and pulling the letters together closes the joins rather
      than tightening the word. Tracking is now zero everywhere except the
      monospace codes, where it is the point.
   2. **Latin line-heights on Arabic text.** IBM Plex Sans Arabic hangs marks
      above and drops tails below a Latin x-band, so leading that looks generous
      in Inter is tight here. Wrapped Arabic is now set at 1.55.
   3. **Secondary text sized for a desk.** Labels, the code caption and the
      legal line were 11.5-13dp. They are floored at 12.5 now and the labels are
      up a full step, because these are the strings a user reads while holding a
      phone in the other hand.

   ## Hierarchy

   One thing is the largest, one thing is filled, one thing is coloured. The
   address is the largest type on the screen; Add playlist is the only filled
   control; the code panel carries the only accent edge. Refresh gave up its
   inner highlight and its white text -- it is a control, not an offer. The
   device key sits a step below the address rather than level with it: both are
   copyable identifiers, but only one is what a provider asks for.

   ## Glow

   Kept, and taken off the two places it was costing readability: the values had
   a 26px halo, which is a blur on the one string the screen exists to be read
   from, and the primary button carried three shadows where one and a rim do the
   same work. The ground, the panel edge and the lockup keep theirs.
   ========================================================================= */
@font-face{font-family:"Castivio Sans";font-weight:400;src:url("../../core/design/src/main/res/font/inter_regular.ttf") format("truetype")}
@font-face{font-family:"Castivio Sans";font-weight:500;src:url("../../core/design/src/main/res/font/inter_medium.ttf") format("truetype")}
@font-face{font-family:"Castivio Sans";font-weight:600;src:url("../../core/design/src/main/res/font/inter_semibold.ttf") format("truetype")}
@font-face{font-family:"Castivio Sans";font-weight:700;src:url("../../core/design/src/main/res/font/inter_bold.ttf") format("truetype")}
@font-face{font-family:"Castivio Arabic";font-weight:400;src:url("../../core/design/src/main/res/font/plex_arabic_regular.ttf") format("truetype")}
@font-face{font-family:"Castivio Arabic";font-weight:500;src:url("../../core/design/src/main/res/font/plex_arabic_medium.ttf") format("truetype")}
@font-face{font-family:"Castivio Arabic";font-weight:600;src:url("../../core/design/src/main/res/font/plex_arabic_semibold.ttf") format("truetype")}
@font-face{font-family:"Castivio Arabic";font-weight:700;src:url("../../core/design/src/main/res/font/plex_arabic_bold.ttf") format("truetype")}

:root{
  /* The name against the title.
     Down again, from .88, and for the same reason it went from 1.0: the header
     carries four things now and the wordmark is the only one of them that can
     give width without losing anything. It is a signature, and a signature is
     recognised by its shape rather than read at size -- the mark beside it is
     what carries the brand at a distance. Every dp it returns is a dp the
     title keeps at full size in Portuguese. */
  --word-ratio:.80;
  --ink:#05040E;
  --white:#FFFFFF;
  --text:#EDEDF6;      /* primary text on glass                       */
  --text-2:#CFCFE4;    /* secondary -- raised; #C4C4DA was the floor   */
  --text-3:#A9A9C6;    /* the quietest thing allowed to carry meaning  */
  --accent-blue:#8FB4FF;
  --accent-num:#4C9BFF;  /* Azure50 -- the trial's numeral, and nothing else */
  --accent-violet:#C0A2FF;
  --hint:#FFB13A;

  /* One edge, one highlight, one lift -- so four surfaces that mean the same
     thing are not drawn four slightly different ways. */
  --edge-card:rgba(126,140,255,.28);
  --edge-quiet:rgba(160,163,215,.20);
  --edge-accent:rgba(158,116,255,.40);
  --rim:inset 0 1px 0 rgba(255,255,255,.12);
  --lift:0 10px 26px rgba(3,2,12,.52);
  --pane:linear-gradient(180deg,rgba(36,29,92,.80) 0%,rgba(15,11,44,.74) 100%);
}

/* ------------------------------------------------------------- the frames */
/* Every number the composition uses, stated per frame. The shipped screen
   already works this way, and the reason is arithmetic: a Column whose children
   exceed its height hands ZERO to the ones measured last, so eight dp of
   overrun is not crowding, it is the buttons disappearing. */
html[data-frame="tv"]{
  --W:960px; --H:540px;
  --edge:46px; --top:24px; --bottom:22px;
  --header:54px; --band-top:22px; --band-bottom:20px; --footer:54px;
  --fs-title:26px; --fs-chip:13px; --fs-label:15.8px; --fs-cap:13.5px;
  --fs-status:15px; --fs-foot:13.5px;
  --mac:30px; --key:27px;
  --chip:44px; --chip-pad:11px; --chips-gap:6px; --head-gap:26px; --mark:32px;
  --capsule:72px; --capsule-gap:20px; --ctl:56px;
  --actions-top:30px; --btn:56px; --fs-btn:15.5px; --actions-gap:20px;
  --status-top:16px; --status:24px;
  --card-pad:17px; --card-gap:15px; --label-w:106px;
  --plate:192px; --zone-w:244px; --zone-pad:14px; --zone-gap:10px;
  --band-gap:32px; --radius:20px; --zone-radius:26px;
  --brand:40px;
}
/* The tablet, and the reason it needs a frame of its own.

   It fell into the phone's table until now -- the frame is chosen by height and
   there was no branch above 380dp except the television's -- so a 1280x800
   tablet drew a phone-sized composition floating in roughly 470dp of nothing.

   What it needs is NOT bigger type. A tablet is held at about 45cm, closer than
   a television by a factor of six, so its type sits between the phone's and the
   set's rather than above both. What the extra frame buys is **margin**: the
   content block is 1000x500 inside 1280x800, and the 280 and 300 that surround
   it are the whole difference. Space is what a large screen is for; scale is
   what a distant one is for, and confusing the two is what makes a tablet look
   like a phone someone zoomed. */
html[data-frame="tab"]{
  --W:1280px; --H:800px;
  --edge:140px; --top:160px; --bottom:140px;
  --header:52px; --band-top:24px; --band-bottom:22px; --footer:52px;
  --fs-title:22px; --fs-chip:12.5px; --fs-label:15px; --fs-cap:13px;
  --fs-status:14.5px; --fs-foot:13px;
  --mac:26px; --key:23px;
  --chip:40px; --chip-pad:12px; --chips-gap:6px; --head-gap:26px; --mark:28px;
  --capsule:76px; --capsule-gap:20px; --ctl:48px;
  --actions-top:28px; --btn:52px; --fs-btn:16px; --actions-gap:20px;
  --status-top:14px; --status:22px;
  --card-pad:18px; --card-gap:16px; --label-w:104px;
  --plate:200px; --zone-w:250px; --zone-pad:14px; --zone-gap:10px;
  --band-gap:32px; --radius:20px; --zone-radius:24px;
  --brand:34px;
}
html[data-frame="p873"]{
  --W:873px; --H:393px;
  --edge:32px; --top:15px; --bottom:11px;
  --header:42px; --band-top:10px; --band-bottom:8px; --footer:40px;
  --fs-title:20px; --fs-chip:12px; --fs-label:14.7px; --fs-cap:13px;
  --fs-status:14px; --fs-foot:13px;
  --mac:28px; --key:25px;
  --chip:36px; --chip-pad:12px; --chips-gap:6px; --head-gap:24px; --mark:26px;
  --capsule:60px; --capsule-gap:16px; --ctl:48px;
  --actions-top:22px; --btn:48px; --fs-btn:14.5px; --actions-gap:18px;
  --status-top:12px; --status:22px;
  --card-pad:15px; --card-gap:13px; --label-w:99px;
  --plate:174px; --zone-w:234px; --zone-pad:7px; --zone-gap:5px;
  --band-gap:24px; --radius:17px; --zone-radius:20px;
  --brand:31px;
}
html[data-frame="p800"]{
  --W:800px; --H:360px;
  --edge:26px; --top:11px; --bottom:8px;
  --header:36px; --band-top:8px; --band-bottom:6px; --footer:34px;
  --fs-title:19px; --fs-chip:11.5px; --fs-label:14.1px; --fs-cap:12.5px;
  --fs-status:13.5px; --fs-foot:12.5px;
  --mac:25px; --key:22px;
  --chip:34px; --chip-pad:11px; --chips-gap:6px; --head-gap:20px; --mark:24px;
  --capsule:56px; --capsule-gap:14px; --ctl:48px;
  --actions-top:18px; --btn:48px; --fs-btn:14px; --actions-gap:16px;
  --status-top:10px; --status:20px;
  --card-pad:14px; --card-gap:12px; --label-w:95px;
  --plate:164px; --zone-w:220px; --zone-pad:6px; --zone-gap:5px;
  --band-gap:20px; --radius:16px; --zone-radius:18px;
  --brand:28px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
body{
  font-family:"Castivio Sans","Castivio Arabic","Noto Sans",sans-serif;
  color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;
  /* Zero, stated once. Arabic joins: pulling the letters together closes the
     joins rather than tightening the word, and a Latin display correction
     applied to the whole page is how that happens without anyone deciding it.
     The monospace codes opt back in, because there it is the point. */
  letter-spacing:0;
}

.frame{position:relative;width:var(--W);height:var(--H);overflow:hidden;background:var(--ink)}

/* --------------------------------------------------------------- backdrop */
.backdrop{position:absolute;inset:0;
  background:
    radial-gradient(74% 96% at 4% 116%, rgba(126,62,255,.60) 0%, rgba(102,48,220,.23) 38%, rgba(70,30,170,0) 70%),
    radial-gradient(46% 60% at 100% 6%,  rgba(38,84,220,.28) 0%, rgba(38,84,220,0) 66%),
    radial-gradient(38% 52% at 84% 92%,  rgba(88,46,210,.24) 0%, rgba(88,46,210,0) 68%),
    linear-gradient(178deg, #05040E 0%, #07061A 26%, #0B0826 58%, #150C3C 100%);
}
.contours{position:absolute;left:0;right:0;bottom:0;height:62%;opacity:.8}

/* ------------------------------------------------------------------ stage */
.stage{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:var(--top) var(--edge) var(--bottom)}

/* ----------------------------------------------------------------- header */
/* One grid, three columns, one gap -- and no per-element margin anywhere.

       [ 1fr ][ auto ][ 1fr ]
         title  lockup  chips

   The two side columns are `1fr`, so grid gives them the same width; the mark
   sits in the middle column and is therefore at the row's exact centre by
   construction, in every language and at every width, with nothing to measure
   or maintain. The title is aligned to the END of its column and the chips to
   the START of theirs, which puts both of their inner edges on a column
   boundary -- so the space either side of the mark is the column gap itself,
   the same single value, on both sides.

   Logical alignment, not left/right: in Arabic column 1 is the rightmost and
   `end` means toward the centre; in English column 1 is the leftmost and `end`
   still means toward the centre. The row mirrors and the rule does not change.

   The lockup used to be absolutely positioned over the row and centred on the
   frame. That gave a centred mark and gaps that were whatever fell out of the
   two strings' lengths -- 72dp on one side and 7 on the other, at the top of a
   television. It is a grid item now, so one layout produces both.

   Both, where the row has room. `1fr` floors at its content, so when one side's
   content is wider than half the free space that column takes what it needs and
   the other takes the rest -- the columns stop being equal and the mark drifts
   by half the difference. The gaps do not: they are the column gap itself and
   stay exactly equal either way, which is the property worth protecting, since
   it is the one a reader can see. The Arabic television header is the case
   where this bites: its chips run 297dp against a 237dp title. */
/* The row does not mirror; its contents do.
   The brand belongs at the same edge in every language -- it is the mark
   Castivio signs its name with, and a signature that changes sides per locale is
   two signatures -- and once the lockup is pinned there the chrome around it has
   to be pinned too, or the header would mirror around a fixed point and read as
   a mistake. So the row is placed left-to-right always: mark, then the page's
   name, then the two chips. What each of them *says* still runs in its own
   script, which is the part that is language. */
.header{flex:0 0 auto;height:var(--header);direction:ltr;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;
  column-gap:var(--head-gap)}
/* The row is pinned ltr, so what mirrors is each element's own text, one
   element at a time -- and the *chips* mirror as chips, not as a group.

   The group's order is part of the row, not part of the sentence. Read from the
   outer edge inward the header now goes: the language control, the trial, the
   page's name, the mark -- in Arabic and in English alike. The language control
   is the only thing in the header a user presses, so it takes the row's outer
   end, where a thumb reaches and an eye returning to the screen looks first;
   the trial is the fact it needs to sit beside, and the mark is the signature,
   which belongs at the other end. Letting the group mirror put the fact at the
   edge and the control inside it, which is that priority backwards. */
html[dir="rtl"] .header .title,
html[dir="rtl"] .header .chips .chip{direction:rtl}
.title{grid-column:2;grid-row:1;justify-self:center;min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;
  font-size:var(--fs-title);line-height:1.35;font-weight:700;color:var(--white)}

/* The lockup: the mark, then the name -- pinned, in every language.

   This is the one place on the screen that does NOT mirror, and it is a
   deliberate exception. Everything else here is language -- a title, a label, a
   sentence -- and belongs on the side the reader's language starts from. The
   lockup is not language. It is the mark Castivio signs its name with, and a
   signature that reassembles itself per locale is two signatures. `Intro.kt`
   already made this call for the startup wordmark: "pinned left-to-right, the
   wordmark is a Latin lockup and does not mirror".

   Pinned by giving the row its own direction, not by `margin-left` on the mark:
   inside it, `gap` and the DOM order do all the work, so there is no left/right
   anywhere and nothing to remember to undo. In Compose the same thing is
   `CompositionLocalProvider(LocalLayoutDirection provides Ltr)` around the Row.
   Invariant 4 forbids direction-absolute layout APIs; a subtree declaring its
   own direction is the mechanism the platform provides for exactly this. */
.wordmark{grid-column:1;grid-row:1;justify-self:start;direction:ltr;
  display:flex;align-items:center;gap:calc(var(--brand) * .32)}
.wordmark span{
  font-family:"Castivio Sans",sans-serif;font-weight:700;line-height:1;
  font-size:calc(var(--fs-title) * var(--word-ratio));
  /* CastivioMark.TRACKING_RATIO, the value :core:design already publishes for
     this mark. It was 0.26 here, which is a second opinion about the brand. */
  letter-spacing:calc(var(--fs-title) * var(--word-ratio) * .25);
  /* Letter-spacing is added AFTER every character, the last one included, so the
     final O carries a quarter-em of empty box behind it that nothing draws in.
     The grid was centring that box, which is honest arithmetic and a visibly
     off-centre mark: the space either side measured 26 and 26, and the eye saw
     34 and 26, because the eye measures ink. Cancelling the trailing track makes
     the box end where the O ends, so the two are the same number again.

     `margin-inline-end`, inside a subtree that has already declared itself ltr,
     so it is the trailing edge of the *word* and not of the screen. */
  margin-inline-end:calc(var(--fs-title) * var(--word-ratio) * -.25);
  background:linear-gradient(97deg,#A86BFF 0%,#7B4BEE 30%,#3D6BFF 70%,#3A9BFF 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 16px rgba(124,75,255,.42));
}
.brand{flex:0 0 auto;width:var(--brand);height:var(--brand);display:block;
  filter:drop-shadow(0 2px 7px rgba(0,0,0,.5))}

.chips{grid-column:3;grid-row:1;justify-self:end;display:flex;align-items:center;gap:var(--chips-gap);
  flex:0 0 auto;white-space:nowrap}
.chip{display:flex;align-items:center;gap:8px;height:var(--chip);
  padding:0 var(--chip-pad);border-radius:999px;
  font-size:var(--fs-chip);line-height:1.45;white-space:nowrap}

/* The trial is information the user needs; the language is a control they may
   never touch. They were drawn identically. The trial now carries a tint of the
   brand and a white numeral, the language chip is the quiet one -- a step
   apart, and still nowhere near the filled button. */
.chip.trial{color:var(--white);font-weight:600;
  background:linear-gradient(180deg,rgba(86,74,214,.28),rgba(40,30,110,.22));
  border:1px solid rgba(140,150,255,.34);box-shadow:var(--rim)}
/* The count, and only the count. The sentence around it stays white at the
   weight it had -- what was asked for is that the number reads out of the
   phrase, not that the phrase changes -- so the seven takes the azure end of
   the mark's own ramp and keeps the size and weight it already carried. The
   same azure lights the dot beside it, which is what makes it read as the
   chip's accent rather than as a stray colour. Nothing else on the screen
   moves: the address and the device key are white, and they stay white. */
.chip.trial b{color:var(--accent-num);font-weight:700;
  font-size:calc(var(--fs-chip) * 1.18);font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px rgba(76,155,255,.55)}
.chip.trial .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;
  background:#8FC0FF;box-shadow:0 0 10px rgba(143,192,255,.9)}
.chip.lang{color:var(--text-2);
  background:rgba(255,255,255,.045);border:1px solid var(--edge-quiet)}
.chip.lang svg{color:var(--text-2);flex:0 0 auto}

/* ------------------------------------------------------------------- band */
.band{flex:1 1 auto;display:flex;align-items:stretch;gap:var(--band-gap);
  padding:var(--band-top) 0 var(--band-bottom);min-height:0}

/* -------------------------------------------------------- identity column */
.identity{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center}

/* A field is a dark pane with a lit edge -- the same edge, highlight and lift
   as every other card on the screen. */
.capsule{display:flex;align-items:center;gap:var(--card-gap);
  height:var(--capsule);padding:0 var(--card-pad);border-radius:var(--radius);
  background:var(--pane);border:1px solid var(--edge-card);
  box-shadow:var(--rim), inset 0 -18px 34px rgba(4,3,14,.5), var(--lift)}
.capsule + .capsule{margin-top:var(--capsule-gap)}

/* A fixed column, and the label wraps inside it rather than widening it.

   `min-width` was right while the label was small: it aligned the two cards and
   let a long translation grow past. At +13% that generosity turns into a
   defect. The label and the value share one row, so every dp the label takes is
   a dp the address loses, and the address is set `nowrap` because a MAC on two
   lines is two addresses. German's "Geraeteschluessel" measures about 125dp
   here against a 104dp column -- it would have pushed a 332dp address into a
   318dp slot and out through the side of the card.

   So the column is fixed and the label wraps. A field name on two lines is
   legible and complete; an address sliding out of its card is neither. Arabic
   and English are one line at every frame -- the wrap is the safety net for the
   other thirty-five languages, not the normal case. */
.capsule .lbl{order:1;flex:0 0 auto;width:var(--label-w);text-align:start;
  /* Both cards reserve the same label column, so the two values are
     centred in identical boxes and line up with each other. Without it
     the pair is centred on two different widths -- "MAC address" and
     "Device key" are not the same length in any language -- and two
     codes a few dp out of column read as a mistake. */
  font-size:var(--fs-label);line-height:1.4;font-weight:600;

  /* Raised a step in the existing scale -- --text, the token the screen's
     primary copy already uses -- rather than given a colour of its own.
     11.4:1 against the pane before, 15.1:1 after.

     The measured contrast was never the problem: it passed AA comfortably at
     the old value. What makes these read faint on a television is that they
     sit beside a 30dp pure-white code at three metres, and a set-top gamma
     curve crushes the low end of a thin light stroke on a dark pane. So the
     fix is the two things that actually survive that: luminance, and a shadow
     dark enough to hold the stroke's edge.

     The shadow is a legibility shadow, not a glow -- 1dp down, 2dp of blur, in
     the ground's own near-black. It darkens what is behind the letterform
     instead of adding light around it, which is the difference between type
     that separates from a gradient and type that smears into one. */
  /* +17.3% relative luminance, which is the whole of the 15-20% asked for and
     also the ceiling: at #EDEDF6 the label was already at 0.852 of white, so
     white *is* a 17% lift and nothing above it exists. Nothing else moves -- the
     weight stays 600, the size stays where it was, and the hierarchy is carried
     where it always was, by 15.8dp of sans against 30dp of mono. A six percent
     difference in a near-white was never what said which of the two mattered. */
  color:#FFFFFF;
  text-shadow:0 1px 2px rgba(3,2,12,.60);
}
/* The accent runs go up with them, same hue, more luminance: the label is one
   phrase and half of it brightening is worse than none of it. */
.capsule .lbl .accent{color:#BFD6FF;font-weight:700}
.capsule.violet .lbl .accent{color:#DDCCFF}

/* The address never wraps: a MAC on two lines is two addresses to anyone
   reading it off a screen. The size is what yields on a narrow frame. No halo
   -- a glow on the one string the screen exists to be read from is a blur on
   the one string the screen exists to be read from. */
.capsule .val{order:2;flex:1 1 auto;min-width:0;text-align:center;color:var(--white);
  font-family:"Liberation Mono","DejaVu Sans Mono",monospace;font-weight:700;
  white-space:nowrap}
.capsule .val.mac{font-size:var(--mac);line-height:1.3;letter-spacing:1.5px}
.capsule .val.key{font-size:var(--key);line-height:1.3;letter-spacing:4px}
/* A Latin run inside an Arabic line must not be reordered by the paragraph. */
.iso{unicode-bidi:isolate;direction:ltr;display:inline-block}

.ctl{order:3;flex:0 0 auto;width:var(--ctl);height:var(--ctl);border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#A8CBFF;
  background:radial-gradient(130% 130% at 30% 18%,rgba(52,96,230,.50),rgba(14,20,72,.85));
  border:1px solid rgba(120,170,255,.38);box-shadow:var(--rim)}
.ctl svg{width:46%;height:46%}
.capsule.violet .ctl{color:#CDB2FF;
  background:radial-gradient(130% 130% at 30% 18%,rgba(120,62,235,.50),rgba(30,14,72,.85));
  border-color:rgba(180,140,255,.38)}

/* ---------------------------------------------------------------- actions */
/* Both are sized by the row, in a fixed proportion, rather than one taking what
   the other left.

   Refresh used to size to its own label -- correct while it was the lesser of
   the two controls, and wrong now that it is not. A user who has pasted a
   playlist URL on their phone presses Refresh, and a user who has not presses
   Add; neither is the fallback for the other, and a control drawn at a third of
   its neighbour's width says it is. So the split is 1.1 to 1 from a zero basis:
   near enough to equal that they read as a pair, with just enough left over that
   the order of the two is still visible without the fill having to say it twice.

   A zero basis rather than `auto`, so the proportion is the proportion whatever
   the two labels measure -- otherwise Portuguese's "Adicionar lista" against
   "Atualizar" would set a different ratio in every language.

   And no horizontal padding on either, which is not a detail: under
   `box-sizing:border-box` a flex item's zero basis is a zero *content* box, so
   Refresh's 17dp of padding came back as 36dp of basis it was handed before the
   ratio was applied -- 1.15 measured out as 1.01. The padding was there to size
   the button to its label, and the button is not sized by its label any more. */
/* The gap is its own number now. It used to be a fraction of the button, which
   meant every dp taken off the button took a dp off the space beside it too --
   exactly the wrong coupling for a pass whose point is that the two controls
   are smaller AND further apart. */
.actions{display:flex;align-items:center;gap:var(--actions-gap);
  margin-top:var(--actions-top)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;
  height:var(--btn);border-radius:calc(var(--radius) * .9);
  font-size:var(--fs-btn);line-height:1.35;font-weight:700;white-space:nowrap}

/* One filled control on the screen, and this is it. One shadow and a rim, where
   there used to be three shadows saying the same thing louder. */
.btn.primary{flex:1.1 1 0;min-width:0;color:#fff;
  background:linear-gradient(100deg,#8B3FF5 0%,#6A45EE 32%,#3D63F5 72%,#2E7BFF 100%);
  box-shadow:0 12px 30px rgba(88,60,240,.40), inset 0 1px 0 rgba(255,255,255,.26)}

/* A control, not an offer: no pane of its own, no inner highlight, and text a
   step below white. Same height, so the target is not what was reduced. */
.btn.secondary{flex:1 1 0;min-width:0;
  color:var(--text-2);font-weight:600;
  background:rgba(255,255,255,.045);border:1px solid var(--edge-quiet)}
.btn.secondary svg{width:calc(var(--fs-btn) * 1.1);height:calc(var(--fs-btn) * 1.1);
  color:var(--text-3)}

/* The reserved line: it keeps its height whether or not it speaks, so pressing
   a button never moves the button. */
.status{display:flex;align-items:center;gap:9px;height:var(--status);
  margin-top:var(--status-top);color:var(--hint);
  font-size:var(--fs-status);line-height:var(--status);font-weight:600}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--hint);
  box-shadow:0 0 11px rgba(255,177,58,.75);flex:0 0 auto}

/* -------------------------------------------------------------- code zone */
/* The plate holds its size across the three frames -- 216 / 206 / 196dp, a 9%
   range across a 50% range of frame height. What gives way is the space around
   it. The white margin inside the plate is not decoration: it is the symbol's
   quiet zone, and a reader that cannot find the quiet zone cannot find the
   symbol, so it scales with the plate rather than being a fixed number. */
.code-zone{flex:0 0 var(--zone-w);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:var(--zone-gap);
  padding:var(--zone-pad);border-radius:var(--zone-radius);
  background:linear-gradient(158deg,rgba(46,26,116,.56) 0%,rgba(16,11,46,.58) 46%,rgba(9,7,28,.60) 100%);
  border:1px solid var(--edge-accent);
  box-shadow:var(--rim), 0 0 44px rgba(124,62,255,.22), 0 18px 44px rgba(3,2,12,.58)}
.plate{flex:0 0 auto;width:var(--plate);height:var(--plate);
  border-radius:calc(var(--plate) * .075);background:#fff;
  padding:calc(var(--plate) * .062);
  box-shadow:0 12px 30px rgba(3,2,12,.6), 0 0 0 1px rgba(255,255,255,.42)}
.plate svg{display:block;width:100%;height:100%;shape-rendering:crispEdges}

.cap{display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:var(--fs-cap);line-height:1.5;color:var(--text-2);text-align:center;
  text-wrap:balance}
.cap b{color:var(--white);font-weight:700}
.cap .ico{flex:0 0 auto;color:var(--text-3);display:flex}
.cap .ico svg{width:calc(var(--fs-cap) * 1.3);height:calc(var(--fs-cap) * 1.3)}

/* ----------------------------------------------------------------- footer */
.footer{flex:0 0 auto;display:flex;align-items:center;gap:12px;height:var(--footer);
  padding:0 calc(var(--footer) * .34);border-radius:calc(var(--radius) * .9);
  background:rgba(255,255,255,.04);border:1px solid var(--edge-quiet)}
.footer .mark{flex:0 0 auto;width:var(--mark);height:var(--mark);border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--accent-violet);
  background:rgba(120,62,235,.20);border:1px solid rgba(180,140,255,.34)}
.footer .mark svg{width:56%;height:56%}
.footer p{flex:1 1 auto;text-align:center;color:var(--text-3);
  font-size:var(--fs-foot);line-height:1.5}
.footer p b{color:var(--accent-violet);font-weight:700}
</style>
</head>
<body>
<div class="frame">
  <div class="backdrop"></div>
  <svg class="contours" viewBox="0 0 960 330" preserveAspectRatio="none" fill="none">
    <g stroke="#8E6BFF" stroke-width="1" opacity=".40">
      <path d="M-20 236 C 120 198, 250 272, 386 244 C 512 218, 618 152, 760 150 C 852 149, 926 168, 990 190"/>
      <path d="M-20 260 C 128 222, 258 294, 398 266 C 528 240, 630 174, 772 172 C 862 171, 932 190, 990 212"/>
      <path d="M-20 284 C 136 246, 266 316, 410 288 C 544 262, 642 196, 784 194 C 872 193, 938 212, 990 234"/>
      <path d="M-20 308 C 144 270, 274 338, 422 310 C 560 284, 654 218, 796 216 C 882 215, 944 234, 990 256"/>
      <path d="M-20 212 C 112 174, 242 250, 374 222 C 496 196, 606 130, 748 128 C 842 127, 920 146, 990 168"/>
      <path d="M-20 188 C 104 150, 234 228, 362 200 C 480 174, 594 108, 736 106 C 832 105, 914 124, 990 146"/>
      <path d="M-20 164 C  96 126, 226 206, 350 178 C 464 152, 582  86, 724  84 C 822  83, 908 102, 990 124"/>
    </g>
    <g stroke="#5FA0FF" stroke-width="1" opacity=".24">
      <path d="M-20 140 C  88 104, 218 186, 338 158 C 448 132, 570  68, 712  66 C 812  65, 902  84, 990 106"/>
      <path d="M-20 116 C  80  80, 210 164, 326 136 C 432 110, 558  46, 700  44 C 802  43, 896  62, 990  84"/>
      <path d="M-20  92 C  72  56, 202 142, 314 114 C 416  88, 546  24, 688  22 C 792  21, 890  40, 990  62"/>
    </g>
  </svg>

  <div class="stage">
    <div class="header">
      <div class="wordmark"><img class="brand" src="../../core/design/src/main/res/drawable-nodpi/castivio_mark.png" alt=""><span>CASTIVIO</span></div>
      <h1 class="title" data-s="title">إضافة قائمة تشغيل</h1>
      <div class="chips">
        <div class="chip trial" data-s="trial"><span class="dot"></span>نسخة تجريبية لمدة <b>7</b> أيام</div>
        <div class="chip lang" id="lang"></div>
      </div>
    </div>

    <div class="band">
      <div class="identity">
        <div class="capsule">
          <span class="ctl" data-icon="copy"></span>
          <span class="val mac"><span class="iso">4E:B6:93:1B:2A:E5</span></span>
          <span class="lbl" data-s="macLabel">عنوان <span class="iso accent">MAC</span></span>
        </div>
        <div class="capsule violet">
          <span class="ctl" data-icon="key"></span>
          <span class="val key"><span class="iso">482731</span></span>
          <span class="lbl" data-s="keyLabel">مفتاح الجهاز</span>
        </div>

        <div class="actions">
          <div class="btn primary" data-s="add">إضافة قائمة تشغيل</div>
          <div class="btn secondary"><span data-s="refresh">تحديث</span><span data-icon="refresh"></span></div>
        </div>

        <div class="status"><span class="dot"></span><span data-s="hint">أضف أول قائمة تشغيل للبدء</span></div>
      </div>

      <div class="code-zone">
        <div class="plate" data-qr></div>
        <div class="cap"><span class="ico" data-icon="phone"></span><span data-s="qr">امسح رمز <b>QR</b> باستخدام هاتفك لتفعيل هذا الجهاز</span></div>
      </div>
    </div>

    <div class="footer">
      <p data-s="legal"><b>Castivio</b> هو مشغل وسائط متعددة، ولا يوفر أي قنوات أو محتوى أو اشتراكات</p>
      <span class="mark" data-icon="info"></span>
    </div>
  </div>
</div>

<script>
/* A version-1 symbol: 21 modules with real finder and timing patterns, and the
   two-module quiet zone the standard requires. The payload is not encoded --
   what a mockup has to get right is the module count and the quiet zone,
   because those are what decide whether a drawn size can be scanned. */
function qrSvg() {
  var N = 21, QUIET = 2, span = N + QUIET * 2, grid = [];
  for (var y = 0; y < N; y++) grid.push(new Array(N).fill(false));
  function finder(r, c) {
    for (var y = 0; y < 7; y++) for (var x = 0; x < 7; x++) {
      var edge = y === 0 || y === 6 || x === 0 || x === 6;
      var core = y >= 2 && y <= 4 && x >= 2 && x <= 4;
      grid[r + y][c + x] = edge || core;
    }
  }
  finder(0, 0); finder(0, N - 7); finder(N - 7, 0);
  for (var i = 8; i < N - 8; i++) { grid[6][i] = i % 2 === 0; grid[i][6] = i % 2 === 0; }
  grid[N - 8][8] = true;
  var seed = 0x5EED;
  function next() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
  function reserved(y, x) {
    return (y < 9 && x < 9) || (y < 9 && x > N - 9) || (y > N - 9 && x < 9) || y === 6 || x === 6;
  }
  for (var y2 = 0; y2 < N; y2++) for (var x2 = 0; x2 < N; x2++)
    if (!reserved(y2, x2)) grid[y2][x2] = next() > 0.48;
  var rects = "";
  for (y2 = 0; y2 < N; y2++) for (x2 = 0; x2 < N; x2++)
    if (grid[y2][x2]) rects += '<rect x="' + (x2+QUIET) + '" y="' + (y2+QUIET) + '" width="1" height="1"/>';
  return '<svg viewBox="0 0 ' + span + ' ' + span + '"><g fill="#05040E">' + rects + '</g></svg>';
}

var K = 'fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"';
var ICON = {
  copy:'<svg viewBox="0 0 24 24" '+K+' stroke-width="1.8">'+
       '<rect x="9" y="9" width="11" height="11" rx="2.5"/>'+
       '<path d="M15 5.5A2.5 2.5 0 0 0 12.5 3H6.5A2.5 2.5 0 0 0 4 5.5v6A2.5 2.5 0 0 0 6.5 14"/></svg>',
  key:'<svg viewBox="0 0 24 24" '+K+' stroke-width="1.8">'+
       '<circle cx="15.4" cy="8.6" r="4.4"/><path d="M12.3 11.7 4 20"/>'+
       '<path d="M6.6 17.4 8.8 19.6"/><path d="M9 15 11.2 17.2"/></svg>',
  refresh:'<svg viewBox="0 0 24 24" '+K+' stroke-width="2.1">'+
       '<path d="M20.5 12a8.5 8.5 0 0 1-14.4 6.1"/><path d="M6 22v-4h4"/>'+
       '<path d="M3.5 12a8.5 8.5 0 0 1 14.4-6.1"/><path d="M18 2v4h-4"/></svg>',
  globe:'<svg width="1.15em" height="1.15em" viewBox="0 0 24 24" '+K+' stroke-width="1.9">'+
       '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/>'+
       '<path d="M12 3c2.6 2.4 4 5.6 4 9s-1.4 6.6-4 9c-2.6-2.4-4-5.6-4-9s1.4-6.6 4-9z"/></svg>',
  phone:'<svg viewBox="0 0 24 24" '+K+' stroke-width="1.9">'+
       '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
  info:'<svg viewBox="0 0 24 24" '+K+' stroke-width="1.9">'+
       '<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><path d="M12 7.6v.2"/></svg>'
};

/* English, only so the screen can be *shown* mirroring rather than claimed to. */
var PT = {
  title:"Adicionar uma lista de reprodução", trial:'<span class="dot"></span>Período de teste de <b>7</b> dias',
  lang:"Idioma", macLabel:'Endereço <span class="iso accent">MAC</span>', keyLabel:"Chave do dispositivo",
  add:"Adicionar lista", refresh:"Atualizar", hint:"Adicione a sua primeira lista para começar",
  qr:"Leia o código <b>QR</b> com o telemóvel para ativar este dispositivo",
  legal:"O <b>Castivio</b> é apenas um reprodutor multimédia"
};
var ES = {
  title:"Añadir una lista de reproducción", trial:'<span class="dot"></span>Prueba de <b>7</b> días',
  lang:"Idioma", macLabel:'Dirección <span class="iso accent">MAC</span>', keyLabel:"Clave del dispositivo",
  add:"Añadir lista", refresh:"Actualizar", hint:"Ya puedes añadir tu primera lista",
  qr:"Escanea el código <b>QR</b> para activar este dispositivo",
  legal:"<b>Castivio</b> es solo un reproductor multimedia"
};
var EN = {
  title:"Add a playlist", trial:'<span class="dot"></span>7-day trial', lang:"Language",
  macLabel:'<span class="iso accent">MAC</span> address', keyLabel:"Device key",
  add:"Add playlist", refresh:"Refresh", hint:"Add your first playlist to start",
  qr:"Scan the <b>QR</b> code with your phone to activate this device",
  legal:"<b>Castivio</b> is a multimedia player and does not provide any channels, content or subscriptions"
};

(function () {
  var q = new URLSearchParams(location.search);
  document.documentElement.dataset.frame = q.get("frame") || "tv";
  // The two longest Latin translations are here because they are what the
  // header was tuned against: Portuguese's title is two and a half times
  // English's, and it is the case that decides whether the language control
  // survives the row.
  var code = q.get("lang") || "ar";
  var en = code !== "ar";
  var T = code === "pt" ? PT : code === "es" ? ES : EN;
  if (en) {
    document.documentElement.lang = code;
    document.documentElement.dir = "ltr";
    document.querySelectorAll("[data-s]").forEach(function (n) {
      if (T[n.dataset.s] != null) n.innerHTML = T[n.dataset.s];
    });
  }
  document.querySelectorAll('[data-qr]').forEach(function (n) { n.innerHTML = qrSvg(); });
  document.querySelectorAll('[data-icon]').forEach(function (n) { n.innerHTML = ICON[n.dataset.icon]; });
  document.getElementById('lang').innerHTML =
    '<span>' + (en ? T.lang : 'اللغة') + '</span>' + ICON.globe;

  /* The title yields, and nothing else does.
     The chips are a control and a fact and keep their intrinsic width; the mark
     is the brand and keeps its size; the title is the one element whose full
     text is not load-bearing -- it names the screen the reader is already on.
     So when a translation will not fit the column it is given, the title steps
     down until it does. Uniform where it fits, which is every language but the
     longest two, and smaller only where the alternative is a clipped word or a
     language button squeezed out of existence. */
  (function fitTitle() {
    var t = document.querySelector('.title');
    var size = parseFloat(getComputedStyle(t).fontSize);
    var floor = size * 0.55;
    var guard = 0;
    while (t.scrollWidth > t.clientWidth + 0.5 && size > floor && guard++ < 40) {
      size *= 0.94;
      t.style.fontSize = size + 'px';
    }
  })();

  /* The title is seated on the wordmark's baseline, not centred beside it.

     Centring two boxes is not putting two words on one line, and on this row it
     visibly is not: the Arabic title is top-heavy -- alef, lam and ta rise where
     nothing descends to answer them -- so a centred box gives a high word above a
     wordmark sitting exactly where it should. A shared baseline is what "on the
     same line" has meant since type was set in metal, and unlike a box it is the
     same number in Chromium and on Android.

     Measured rather than declared, because CSS cannot express it here: the lockup
     is a flex row and a flex container takes its baseline from its first item,
     which is the picture. So the two baselines are read off the rendered page and
     the difference is applied, which is exactly what `CastivioHeader` does with
     `FirstBaseline` -- one rule, stated twice, in the two places it has to hold.

     A zero-sized inline-block sits ON the baseline of the line it is added to, so
     its bottom edge is that baseline. It is removed again immediately. */
  function baselineOf(el) {
    var probe = document.createElement('span');
    probe.style.cssText = 'display:inline-block;width:0;height:0;overflow:hidden';
    el.appendChild(probe);
    var y = probe.getBoundingClientRect().bottom;
    el.removeChild(probe);
    return y;
  }
  var titleEl = document.querySelector('.title');
  var wordEl = document.querySelector('.wordmark span');
  titleEl.style.position = 'relative';
  titleEl.style.top = (baselineOf(wordEl) - baselineOf(titleEl)) + 'px';

  /* The fit, measured rather than reasoned. A negative spare here is the bug
     that ships: the Column hands zero to whatever it measured last. */
  var band = document.querySelector('.band');
  var col  = document.querySelector('.identity');
  var zone = document.querySelector('.code-zone');
  var val  = document.querySelector('.val.mac');
  var cap  = document.querySelector('.cap');
  var plate= document.querySelector('.plate');
  var wm   = document.querySelector('.wordmark span');
  var img  = document.querySelector('.brand');
  var r = wm.getBoundingClientRect(), b = img.getBoundingClientRect();
  var bs = getComputedStyle(band);
  var bandH = band.clientHeight
            - parseFloat(bs.paddingTop) - parseFloat(bs.paddingBottom);
  function content(el, pad) {
    var kids = el.children;
    var top = kids[0].getBoundingClientRect().top;
    var bot = kids[kids.length - 1].getBoundingClientRect().bottom;
    return bot - top + (pad ? parseFloat(getComputedStyle(el).paddingTop) +
                              parseFloat(getComputedStyle(el).paddingBottom) : 0);
  }
  var idH = content(col, false), zoneH = content(zone, true);
  var capFs = parseFloat(getComputedStyle(cap).fontSize);
  console.log(JSON.stringify({
    frame: document.documentElement.dataset.frame + (en ? "/en" : "/ar"),
    band: Math.round(bandH),
    identity: Math.round(idH),
    idSpare: Math.round(bandH - idH),
    code: Math.round(zoneH),
    codeSpare: Math.round(bandH - zoneH),
    macInk: Math.round(val.firstElementChild.getBoundingClientRect().width),
    macBox: Math.round(val.getBoundingClientRect().width),
    macOverflow: Math.round(val.firstElementChild.getBoundingClientRect().width -
                            val.getBoundingClientRect().width),
    capLines: Math.round(cap.getBoundingClientRect().height / (capFs * 1.5)),
    labelInk: Array.prototype.map.call(document.querySelectorAll('.lbl'), function (n) {
      return Math.round(n.getBoundingClientRect().width);
    }),
    header: (function () {
      var H = document.querySelector('.header').getBoundingClientRect();
      var tEl = document.querySelector('.title');
      var t = tEl.getBoundingClientRect();
      var lk = document.querySelector('.wordmark');
      var m = lk.getBoundingClientRect();
      var kid = lk.children;
      var last = kid[kid.length - 1];
      var track = parseFloat(getComputedStyle(last).letterSpacing) || 0;
      var ink = { left: kid[0].getBoundingClientRect().left,
                  right: last.getBoundingClientRect().right - track };
      var c = document.querySelector('.chips').getBoundingClientRect();
      var gapA = Math.round(Math.min(Math.abs(ink.left - t.right), Math.abs(t.left - ink.right)));
      var gapB = Math.round(Math.min(Math.abs(c.left - ink.right), Math.abs(ink.left - c.right)));
      // Optical centres, not box centres: three elements with three different
      // line boxes centred in the same row can still read as three levels.
      var rowMid = (H.top + H.bottom) / 2;
      function mid(el){ var r = el.getBoundingClientRect(); return (r.top + r.bottom) / 2; }
      window.__hdr = { inkGapTitle: gapA, inkGapTrial: gapB,
        baselineGap: +(baselineOf(tEl) - baselineOf(wordEl)).toFixed(2),
        // Where the INK sits, which is the only thing a reader sees. Canvas
        // reports a run's real glyph bounds rather than its font's metrics, so
        // this is the drawing's actual answer to "are they on the same level".
        ink: (function () {
          var cx = document.createElement('canvas').getContext('2d');
          function band(el, text) {
            var cs = getComputedStyle(el);
            cx.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
            var m = cx.measureText(text);
            var base = baselineOf(el);
            return { top: +(base - m.actualBoundingBoxAscent).toFixed(1),
                     bot: +(base + m.actualBoundingBoxDescent).toFixed(1) };
          }
          var t = band(tEl, tEl.textContent);
          var w = band(wordEl, wordEl.textContent);
          var mk = document.querySelector('.brand').getBoundingClientRect();
          return { titleMid: +((t.top + t.bot) / 2).toFixed(1),
                   wordMid: +((w.top + w.bot) / 2).toFixed(1),
                   markMid: +((mk.top + mk.bottom) / 2).toFixed(1),
                   rowMid: +rowMid.toFixed(1) };
        })(),
        offTitle:  +(mid(tEl) - rowMid).toFixed(2),
        offLockup: +(mid(lk) - rowMid).toFixed(2),
        offMark:   +(mid(kid[0]) - rowMid).toFixed(2),
        offWord:   +(mid(last) - rowMid).toFixed(2),
        offChips:  +(mid(document.querySelector('.chips')) - rowMid).toFixed(2),
        markVsWord: +(mid(kid[0]) - mid(last)).toFixed(2),
        order: Array.prototype.map.call(document.querySelectorAll('.header > *, .chips > *'),
          function(n){ return n.className.replace(/\s+/g,'.') + '@' +
                       Math.round(n.getBoundingClientRect().left); }),
        titleSize: +parseFloat(getComputedStyle(tEl).fontSize).toFixed(1),
        titleClipped: Math.max(0, Math.round(tEl.scrollWidth - tEl.clientWidth)),
        inkOffCentre: +(((ink.left + ink.right) / 2) - ((H.left + H.right) / 2)).toFixed(2) };
      return Object.assign(window.__hdr, (function () {
      var h = document.querySelector('.header').getBoundingClientRect();
      function w(sel){ var n=document.querySelector(sel); return n?Math.round(n.getBoundingClientRect().width):0; }
      var lock = document.querySelector('.wordmark');
      var kids = lock.children;
      var lw = Math.round(kids[kids.length-1].getBoundingClientRect().right - kids[0].getBoundingClientRect().left);
      return { row: Math.round(h.width), title: w('.title'), lockup: lw,
               trial: w('.chip.trial'), lang: w('.chip.lang') };
    })());
    })(),
    actions: (function () {
      function w(sel){ return Math.round(document.querySelector(sel).getBoundingClientRect().width); }
      return { add: w('.btn.primary'), refresh: w('.btn.secondary'),
               ratio: +(w('.btn.primary') / w('.btn.secondary')).toFixed(2) };
    })(),
    lockGap: Math.round(Math.abs(r.left > b.left ? r.left - b.right : b.left - r.right)),
    lockAlign: +((r.top + r.height / 2) - (b.top + b.height / 2)).toFixed(2)
  }));
})();
</script>
</body>
</html>
