<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Castivio — add your subscription</title>
<style>
/* ============================================================================
   Castivio — the first screen, where a subscription is added.

   Every value is a real token from :core:design, expressed in dp. The page
   renders at the device's scale factor, so a PNG is what Compose will lay out.

   ---------------------------------------------------------------------------
   The composition, and why there is no card.

   An earlier draft put the address, its actions and the code inside one centred
   glass rectangle. Everything fitted and nothing overflowed, and it still read
   as a component dropped onto a canvas: clutter in the middle, unused screen
   around it.

   So the card is gone. The screen is divided instead into three bands by two
   full-width hairlines -- a header, a field, a footer -- which is what makes
   the background read as part of the interface rather than as margin. The
   address lives directly on the aurora as typography, because it is
   information and must never be mistaken for a control. The code keeps a
   surface, because a QR is only scannable on a light ground; that is the one
   container on the screen and it is the only one that earns its keep.

   Two axes hold it together. The title, the MAC label, the address and the
   primary action all start on the leading margin; the language control, the
   code and its caption all end on the trailing one.

     ?frame=   phone-873 | phone-800 | tv
     ?lang=    en ar de fi th hi bn ja zh
     &state=   copied | focus-copy
     &spec=1   measures, safe area, focus order
   ========================================================================= */
:root{
  /* ground */
  --void:#08071A; --abyss:#0D0B22; --deep:#141031; --slate:#1C1840; --haze:#272253;
  /* brand */
  --violet10:#1B1038; --violet40:#6E4BD8; --violet50:#9B6BFF; --violet60:#B694FF;
  --azure10:#0A1E3D; --azure40:#2E6BFF; --azure50:#4C9BFF; --azure60:#6FB2FF;
  /* text */
  --mist:#F2F2F8; --silver:#C9C9DA; --muted:#A6A6BF; --faint:#6E6E8A;
  /* glass */
  --glass-mid:rgba(255,255,255,.078); --glass-low:rgba(255,255,255,.039);
  --glass-edge:rgba(255,255,255,.239); --glass-edge-soft:rgba(255,255,255,.078);
  --divider:rgba(255,255,255,.122);   /* CastivioColors.divider, 0x1FFFFFFF */
  --success:#3DD68C;                  /* Palette.Success */
  /* radius */
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:24px; --r-xxl:30px; --r-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
body{
  /* Noto, because that is what Android ships. Chromium walks this list per
     character, so Arabic, Thai and Devanagari each land on their own Noto face
     and the measurements carry over to the device. */
  font-family:"Noto Sans","Noto Sans Arabic","Noto Sans Thai","Noto Sans Devanagari",
              "WenQuanYi Zen Hei","Liberation Sans",sans-serif;
  color:var(--mist);
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}
.frame{display:none;position:relative;overflow:hidden;background:var(--void)}
html[data-frame="phone-873"] #phone-873,
html[data-frame="phone-800"] #phone-800,
html[data-frame="tv"]        #tv{display:block}

#phone-873{width:873px;height:393px}
#phone-800{width:800px;height:360px}
#tv{width:960px;height:540px}

/* ---------------------------------------------------------------- backdrop */
/* Four layers. The first is new: a soft light behind where the address sits.
   With no card to anchor it, the composition needs the ground itself to lift
   under the one thing the screen exists for. */
.backdrop{position:absolute;inset:0;
  background:
    radial-gradient(44% 118% at 21% 54%, rgba(111,178,255,.14) 0%, rgba(111,178,255,0) 66%),
    radial-gradient(58% 78% at 4% 108%, rgba(110,75,216,.30) 0%, rgba(110,75,216,0) 62%),
    radial-gradient(54% 70% at 97% 20%, rgba(46,107,255,.26) 0%, rgba(46,107,255,0) 60%),
    linear-gradient(135deg, var(--deep) 0%, var(--violet10) 48%, var(--azure10) 100%);
}
/* Mirrored as a composition, not by nudging pieces: the light belongs behind
   the address, and in RTL the address is on the other side. */
html[dir="rtl"] .backdrop{
  background:
    radial-gradient(44% 118% at 79% 54%, rgba(111,178,255,.14) 0%, rgba(111,178,255,0) 66%),
    radial-gradient(58% 78% at 96% 108%, rgba(110,75,216,.30) 0%, rgba(110,75,216,0) 62%),
    radial-gradient(54% 70% at 3% 20%, rgba(46,107,255,.26) 0%, rgba(46,107,255,0) 60%),
    linear-gradient(225deg, var(--deep) 0%, var(--violet10) 48%, var(--azure10) 100%);
}
.mesh{position:absolute;inset:0;opacity:.45}

/* -------------------------------------------------------------------- type */
/* Type.kt, carrying the approved line-height rise: headlineMedium 22/32,
   headlineLarge 28/40, bodySmall 12.5/20. The old values were set against Latin
   and sat within a millimetre of other scripts' ink. */
.t-headline-m{font-size:22px;line-height:32px;font-weight:700}
.t-headline-l{font-size:28px;line-height:40px;font-weight:700;letter-spacing:-.2px}
.t-body-m    {font-size:14px;line-height:22px}
.t-body-s    {font-size:12.5px;line-height:20px}
.t-overline  {font-size:11px;line-height:16px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase}

/* codeHero 42/52 is a television size: seventeen monospace characters need
   445dp, which no phone can spare beside a code. The compact token is 28/36 --
   303dp in a mono whose advance is 0.6em, the same as the Roboto Mono Compose
   will use, so this number is the device's number. */
.code-tv   {font-family:"Liberation Mono","DejaVu Sans Mono",monospace;
            font-size:42px;line-height:52px;font-weight:700;letter-spacing:1px}
.code-phone{font-family:"Liberation Mono","DejaVu Sans Mono",monospace;
            font-size:28px;line-height:36px;font-weight:700;letter-spacing:1px}

/* The address is Latin-and-digits inside a paragraph that may run right to
   left. Left to inherit the paragraph, the bidi algorithm may reorder its runs
   -- and the all-neutral placeholder "··:··:··:··:··:··" is reordered outright.
   A licence address that reads differently in Arabic is a support case in every
   RTL market. */
.code{color:var(--mist);white-space:nowrap;direction:ltr;unicode-bidi:isolate;
      text-shadow:0 0 30px rgba(111,178,255,.30)}

/* --------------------------------------------------------------- structure */
.shell{position:absolute;inset:0;display:flex;flex-direction:column}
.sysbar{height:24px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;color:var(--silver);font-size:11px}
.gesture{height:20px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.gesture i{display:block;width:96px;height:3px;border-radius:var(--r-pill);background:rgba(255,255,255,.32)}

.stage{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
#phone-873 .stage{padding:12px 30px 6px}
#phone-800 .stage{padding:10px 26px 4px}
#tv .stage{position:absolute;inset:48px;padding:0}

/* The two hairlines that turn a canvas into a screen. Full width, faded at the
   ends so they read as light rather than as borders. */
.rule{flex:0 0 auto;height:1px;
  background:linear-gradient(90deg,transparent 0%,var(--divider) 6%,
             var(--divider) 94%,transparent 100%)}

/* Header: identity on one side, status and control on the other. */
.head{flex:0 0 auto;display:flex;align-items:center;gap:16px}
.head h1{flex:0 1 auto;min-width:0}
.head .spacer{flex:1 1 auto}
#phone-873 .head{padding-bottom:11px}
#phone-800 .head{padding-bottom:9px}
#tv .head{padding-bottom:16px}

/* Status, not a control: no border, no fill, nothing to press, and readable at
   a glance rather than greyed into the background. The dot is drawn rather than
   typed -- a middle dot between "Castivio" and an Arabic-Indic numeral is a
   neutral the bidi algorithm may place on the far side of the digit, which it
   did. A shape in a flex gap has no direction to resolve. */
.trial{display:flex;align-items:center;gap:9px;white-space:nowrap;flex:0 0 auto;
  color:var(--silver);font-weight:500}
.trial .dot{width:5px;height:5px;border-radius:50%;background:var(--violet50);flex:0 0 auto;
  box-shadow:0 0 10px rgba(155,107,255,.85)}
.trial .days{color:var(--violet60);font-weight:600}

/* A control, and visibly one. The person who needs it is the person who cannot
   read anything else on the screen, so it shows the current language in its own
   name -- never a row of codes implying three languages exist. */
.lang{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r-pill);
  white-space:nowrap;flex:0 0 auto;font-weight:600;
  background:var(--glass-mid);border:1px solid var(--glass-edge);color:var(--mist)}
.lang svg{flex:0 0 auto;opacity:.8}
/* A header chip reads wrong at 48dp, so it is 32 and declares the target its
   implementation must expand to. In Compose that is a touch target larger than
   the drawn shape, which is ordinary; what is not ordinary is leaving it
   undeclared, so the measuring script reads `data-target` and holds it to it. */
#phone-873 .lang,#phone-800 .lang{height:32px;padding:0 13px;font-size:12.5px}
#tv .lang{height:40px;padding:0 18px;font-size:15px}

/* The field between the rules. Two zones held apart by space rather than by a
   line: the identity starts on the leading margin, the code ends on the
   trailing one, and the distance between them is the separation. */
/* The two zones size to their content and the pair is centred, rather than the
   identity stretching to fill and pushing the code to the far margin. That
   stretch was the whole cause of the gulf down the middle: nothing was pulling
   them apart on purpose, one of them was simply greedy.
   The 60/40 relationship then falls out of the content instead of being imposed
   -- on English the identity measures 367dp against the code zone's 236, which
   is 61/39, and it stays in that region as translations grow. */
.field{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.identity{flex:0 1 auto}
#phone-873 .field{gap:40px}
#phone-800 .field{gap:34px}
#tv .field{gap:52px}

.identity{min-width:0;display:flex;flex-direction:column;align-items:flex-start}
/* Silver rather than muted. As information it sits below the address, but a
   label the eye skips because it looks switched off is not secondary, it is
   broken. */
.identity .label{color:var(--silver)}
#phone-873 .identity .label,#phone-800 .identity .label{margin-bottom:3px}
#tv .identity .label{margin-bottom:7px}

/* The address and its copy control. A row, not a container -- the value is bare
   type on the ground, so nothing about it suggests a field to be filled in. */
.macline{display:flex;align-items:center;min-width:0}
#phone-873 .macline{gap:16px}
#phone-800 .macline{gap:14px}
#tv .macline{gap:22px}

/* Ghost, so it never competes with the value beside it, and a full target
   whatever it looks like. */
.copy{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  border-radius:var(--r-sm);color:var(--silver);
  background:transparent;border:1px solid var(--glass-edge-soft)}
#phone-873 .copy,#phone-800 .copy{width:48px;height:48px}
#tv .copy{width:56px;height:56px}
/* Confirmation in the design system's success token. The word appears only in
   this state, which is what lets the control be an icon the rest of the time. */
.copy.done{width:auto;gap:8px;color:var(--success);
  border-color:rgba(61,214,140,.42);background:rgba(61,214,140,.12);
  font-weight:600;white-space:nowrap}
#phone-873 .copy.done,#phone-800 .copy.done{padding:0 15px;font-size:13px}
#tv .copy.done{padding:0 20px;font-size:15px}

.actions{display:flex;align-items:center;flex:0 0 auto}
#phone-873 .actions{gap:14px;margin-top:22px}
#phone-800 .actions{gap:12px;margin-top:18px}
#tv .actions{gap:20px;margin-top:30px}

/* One button system. Filled for the primary, outlined for the secondary: a
   difference in kind rather than in shade, so the hierarchy survives being
   glanced at from three metres. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  border-radius:var(--r-sm);font-weight:600;white-space:nowrap;flex:0 0 auto}
.btn svg{flex:0 0 auto}
#phone-873 .btn,#phone-800 .btn{height:48px;padding:0 22px;font-size:14px}
#tv .btn{height:60px;padding:0 32px;font-size:16px}
.btn-primary{background:linear-gradient(90deg,var(--violet50),var(--azure50));color:#0B0820;
  box-shadow:0 8px 26px rgba(124,116,255,.30)}
.btn-secondary{background:transparent;border:1px solid var(--glass-edge);color:var(--mist)}
.focused{box-shadow:0 0 0 2px var(--violet50), 0 0 26px 3px rgba(155,107,255,.45)}

/* The code's zone. The one surface on the screen, and it is doing work rather
   than decorating: a QR needs a light ground to be read. */
.codezone{flex:0 0 auto;display:flex;flex-direction:column;align-items:center}
.plate{background:#fff;border-radius:var(--r-md);flex:0 0 auto;
  box-shadow:0 16px 46px rgba(0,0,0,.44), 0 0 0 1px rgba(255,255,255,.10)}
.plate svg{display:block;shape-rendering:crispEdges;width:100%;height:100%}
.codezone .cap{text-align:center;color:var(--silver)}
#phone-873 .plate{width:148px;height:148px;padding:9px}
#phone-873 .codezone .cap{margin-top:11px;width:180px}
#phone-800 .plate{width:130px;height:130px;padding:8px}
#phone-800 .codezone .cap{margin-top:9px;width:162px}
#tv .plate{width:196px;height:196px;padding:12px}
#tv .codezone .cap{margin-top:15px;width:236px}

/* The standing statement of what Castivio is: quiet, but muted rather than
   faint. It is here for the reader's protection and has to be readable. */
.foot{flex:0 0 auto;text-align:center;color:var(--muted)}
#phone-873 .foot{padding:8px 0 2px}
#phone-800 .foot{padding:7px 0 1px}
#tv .foot{padding:13px 0 0}

/* ------------------------------------------------------------------- spec */
.spec{display:none}
html[data-spec="1"] .spec{display:block}
.spec-safe{position:absolute;z-index:8;pointer-events:none;border:1px dashed rgba(255,176,32,.55)}
/* Focus order, numbered from the measured boxes so the badges cannot drift out
   of step with a layout change the way hand-placed ones do. */
.spec-focus{position:absolute;z-index:10;width:15px;height:15px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;direction:ltr;
  font-family:"Liberation Mono",monospace;font-size:9px;font-weight:700;
  background:#9B6BFF;color:#0B0820;transform:translate(-50%,-50%)}
.spec-note{position:absolute;z-index:9;right:6px;bottom:6px;direction:ltr;
  font-family:"Liberation Mono",monospace;font-size:9px;line-height:13px;text-align:right;
  color:#FFB020;background:rgba(8,7,26,.86);padding:3px 6px;border-radius:4px}
</style>
</head>

<script>
/* ---------------------------------------------------------------------------
   Every screen string, in the nine languages that stress the layout.

   The QR carries the address and nothing else, so its caption says exactly
   that. When the activation portal exists and the code carries a URL, the
   caption becomes "Scan to open activation" -- and not one day before it is
   true.
   ------------------------------------------------------------------------ */
var S = {
  en: { dir:"ltr", lang:"English", title:"Add your subscription",
        trialName:"Castivio trial", trialDays:"7 days", macLabel:"MAC address",
        qr:"Scan to get this address on your phone",
        add:"Add playlist", refresh:"Refresh", copy:"Copy", copied:"Copied",
        footer:"Castivio is only a player and does not provide subscriptions or content." },

  ar: { dir:"rtl", lang:"العربية", title:"أضف اشتراكك",
        trialName:"تجربة Castivio", trialDays:"٧ أيام", macLabel:"عنوان MAC",

        add:"إضافة قائمة تشغيل", refresh:"تحديث", copy:"نسخ", copied:"تم النسخ",
        footer:"Castivio مشغّل فقط ولا يوفّر اشتراكات أو محتوى." },

  de: { dir:"ltr", lang:"Deutsch", title:"Abonnement hinzufügen",
        trialName:"Castivio-Testphase", trialDays:"7 Tage", macLabel:"MAC-Adresse",
        qr:"Scannen, um diese Adresse aufs Telefon zu holen",
        add:"Wiedergabeliste hinzufügen", refresh:"Aktualisieren",
        copy:"Kopieren", copied:"Kopiert",
        footer:"Castivio ist nur ein Player und bietet keine Abonnements oder Inhalte an." },

  fi: { dir:"ltr", lang:"Suomi", title:"Lisää tilauksesi",
        trialName:"Castivio-kokeilu", trialDays:"7 päivää", macLabel:"MAC-osoite",
        qr:"Skannaa saadaksesi osoitteen puhelimeesi",

/* ---------------------------------------------------------------------------
   A QR code, drawn rather than encoded. The real one comes from ZXing over the
   address; what matters in a mockup is the module count, because that is what
   decides whether a printed size can be scanned. Seventeen characters is a
   version 1 symbol -- 21 modules -- so the grid is 21 with proper finder and
   timing patterns. Size arguments made against this are sound; the payload is
   not real.
   ------------------------------------------------------------------------ */
function qrSvg() {
  var N = 21, QUIET = 2, span = N + QUIET * 2;
  var grid = [];
  for (var y = 0; y < N; y++) grid.push(new Array(N).fill(false));

  function finder(r, c) {
    for (var y = 0; y < 7; y++)
      for (var x = 0; x < 7; x++) {
        var edge = y === 0 || y === 6 || x === 0 || x === 6;
        var core = y >= 2 && y <= 4 && x >= 2 && x <= 4;
        grid[r + y][c + x] = edge || core;
      }
  }
  finder(0, 0); finder(0, N - 7); finder(N - 7, 0);
  for (var i = 8; i < N - 8; i++) { grid[6][i] = i % 2 === 0; grid[i][6] = i % 2 === 0; }
  grid[N - 8][8] = true;

  var seed = 0x5EED;
  function next() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
  function reserved(y, x) {
    return (y < 9 && x < 9) || (y < 9 && x > N - 9) || (y > N - 9 && x < 9) || y === 6 || x === 6;
  }
  for (y = 0; y < N; y++)
    for (var x = 0; x < N; x++)
      if (!reserved(y, x)) grid[y][x] = next() > 0.48;

  var rects = "";
  for (y = 0; y < N; y++)
    for (x = 0; x < N; x++)
      if (grid[y][x]) rects += '<rect x="' + (x + QUIET) + '" y="' + (y + QUIET) + '" width="1" height="1"/>';

  return '<svg viewBox="0 0 ' + span + " " + span + '"><g fill="#08071A">' + rects + "</g></svg>";
}

var ICON = {
  copy:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
       'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
       '<rect x="9" y="9" width="11" height="11" rx="2.5"/>' +
       '<path d="M15 5.5A2.5 2.5 0 0 0 12.5 3H6.5A2.5 2.5 0 0 0 4 5.5v6A2.5 2.5 0 0 0 6.5 14"/></svg>',
  done:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
       'stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>',
  refresh:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
       'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
       '<path d="M20.5 12a8.5 8.5 0 0 1-14.4 6.1"/><path d="M6 22v-4h4"/>' +
       '<path d="M3.5 12a8.5 8.5 0 0 1 14.4-6.1"/><path d="M18 2v4h-4"/></svg>',
  globe:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
       'stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/>' +
       '<path d="M12 3c2.6 2.4 4 5.6 4 9s-1.4 6.6-4 9c-2.6-2.4-4-5.6-4-9s1.4-6.6 4-9z"/></svg>'
};

(function () {
  var q = new URLSearchParams(location.search);
  var frame = q.get("frame") || "phone-873";
  var lang = q.get("lang") || "en";
  var state = q.get("state") || "";
  var s = S[lang] || S.en;

  document.documentElement.dataset.frame = frame;
  document.documentElement.lang = lang;
  document.documentElement.dir = s.dir;
  if (q.get("spec") === "1") document.documentElement.dataset.spec = "1";

  var svg = qrSvg();
  document.querySelectorAll("[data-qr]").forEach(function (n) { n.innerHTML = svg; });

  document.querySelectorAll("[data-copy]").forEach(function (n) {
    if (state === "copied") {
      n.classList.add("done");
      n.innerHTML = ICON.done + "<span>" + s.copied + "</span>";
      n.setAttribute("aria-label", s.copied);
    } else {
      n.innerHTML = ICON.copy;
      n.setAttribute("aria-label", s.copy);
      n.setAttribute("title", s.copy);
    }
  });

  if (state === "focus-copy") {
    document.querySelectorAll(".btn-primary").forEach(function (n) { n.classList.remove("focused"); });
    document.querySelectorAll("[data-copy]").forEach(function (n) { n.classList.add("focused"); });
  }

  document.querySelectorAll("[data-s]").forEach(function (n) {
    var key = n.getAttribute("data-s");
    // No silent fallback. `s[key] || S.en[key]` yields undefined for a key
    // neither table has, and assigning that writes the literal word
    // "undefined" -- text, so nothing downstream notices. It happened once: a
    // whole button rendered blank and every check still passed.
    var text = key in s ? s[key] : (key in S.en ? S.en[key] : "⟨" + key + "⟩");
    if (n.hasAttribute("data-globe")) n.innerHTML = ICON.globe + "<span>" + text + "</span>";
    else if (n.hasAttribute("data-refresh")) n.innerHTML = ICON.refresh + "<span>" + text + "</span>";
    else n.textContent = text;
  });

  if (q.get("spec") === "1") {
    requestAnimationFrame(function () {
      var frameEl = document.getElementById(frame);
      var host = frameEl.querySelector(".spec");
      var rect = frameEl.getBoundingClientRect();
      frameEl.querySelectorAll(".lang, .copy, .btn").forEach(function (el, i) {
        var b = el.getBoundingClientRect();
        var badge = document.createElement("span");
        badge.className = "spec-focus";
        badge.textContent = String(i + 1);
        badge.style.left = (b.left - rect.left + b.width / 2) + "px";
        badge.style.top = (b.top - rect.top) + "px";
        host.appendChild(badge);
      });
    });
  }
})();
</script>
