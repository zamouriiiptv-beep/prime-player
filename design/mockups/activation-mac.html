<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Castivio — add your subscription</title>
<style>
/* ============================================================================
   Castivio — the first screen, where a subscription is added.

   Every value is a real token from :core:design, expressed in dp. The page
   renders at the device's scale factor, so a PNG is what Compose will lay out.

   Three frames, and they are three *layouts* rather than one layout scaled:

     phone-873   873x393dp   1080x2400 @2.75 — code and QR abreast
     phone-800   800x360dp    720x1600 @2.00 — the same, tighter measure
     tv          960x540dp   1920x1080 @2.00 — code across the top, then QR
                                               and actions beneath it

   Landscape hands you width and takes away height, so the content runs across.
   A television has the width for the address at its full 42sp measure, which no
   phone column does — so its code takes a line of its own and the QR moves
   below. Same information on both; different arrangement.

     ?frame=   which device
     ?lang=    which of the stress languages (en ar de fi th hi bn ja zh)
     &spec=1   the measures and the safe area

   Nothing here promises a facility that does not exist. There is no activation
   URL, because the domain is not decided; the QR carries the address and the
   caption says so; and the device key has no placeholder holding a space open.
   ========================================================================= */
:root{
  /* ground */
  --void:#08071A; --abyss:#0D0B22; --deep:#141031; --slate:#1C1840; --haze:#272253;
  /* brand */
  --violet10:#1B1038; --violet40:#6E4BD8; --violet50:#9B6BFF; --violet60:#B694FF;
  --azure10:#0A1E3D; --azure40:#2E6BFF; --azure50:#4C9BFF; --azure60:#6FB2FF;
  /* text */
  --mist:#F2F2F8; --silver:#C9C9DA; --muted:#A6A6BF; --faint:#6E6E8A;
  /* glass */
  --glass-mid:rgba(255,255,255,.078); --glass-low:rgba(255,255,255,.039);
  --glass-edge:rgba(255,255,255,.239); --glass-edge-soft:rgba(255,255,255,.078);
  --divider:rgba(255,255,255,.122);   /* CastivioColors.divider, 0x1FFFFFFF */
  /* radius */
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:24px; --r-xxl:30px; --r-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
body{
  /* Noto, because that is what Android ships. Chromium walks this list per
     character, so Arabic, Thai and Devanagari each land on their own Noto face
     and the measurements carry over to the device instead of describing
     whatever the render machine happened to have. */
  font-family:"Noto Sans","Noto Sans Arabic","Noto Sans Thai","Noto Sans Devanagari",
              "WenQuanYi Zen Hei","Liberation Sans",sans-serif;
  color:var(--mist);
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}
.frame{display:none;position:relative;overflow:hidden;background:var(--void)}
html[data-frame="phone-873"] #phone-873,
html[data-frame="phone-800"] #phone-800,
html[data-frame="tv"]        #tv{display:block}

#phone-873{width:873px;height:393px}
#phone-800{width:800px;height:360px}
#tv{width:960px;height:540px}

/* ---------------------------------------------------------------- backdrop */
.backdrop{position:absolute;inset:0;
  background:
    radial-gradient(58% 78% at 4% 108%, rgba(110,75,216,.30) 0%, rgba(110,75,216,0) 62%),
    radial-gradient(54% 70% at 97% 22%, rgba(46,107,255,.26) 0%, rgba(46,107,255,0) 60%),
    linear-gradient(135deg, var(--deep) 0%, var(--violet10) 48%, var(--azure10) 100%);
}
.mesh{position:absolute;inset:0;opacity:.5}

/* ------------------------------------------------------------------- glass */
.glass{
  position:relative;
  background:linear-gradient(180deg,var(--glass-mid),var(--glass-low));
  border:1px solid var(--glass-edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 14px 40px rgba(0,0,0,.34);
  border-radius:var(--r-xxl);
}
/* The card that is the screen's job carries a breath of brand in its fill. */
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 150% at 0% 0%, rgba(111,178,255,.10) 0%, rgba(111,178,255,0) 58%);
}
html[dir="rtl"] .glass::after{
  background:radial-gradient(120% 150% at 100% 0%, rgba(111,178,255,.10) 0%, rgba(111,178,255,0) 58%);
}

/* -------------------------------------------------------------------- type */
/* Type.kt. 1sp = 1dp at fontScale 1.0.
   headlineMedium, headlineLarge and bodySmall carry the approved line-height
   rise -- 32, 40 and 20 rather than 30, 36 and 18. The old values were set
   against Latin and sat within a millimetre of other scripts' ink: Thai's
   bodySmall had 1dp of headroom, Arabic's headlineLarge had 0.5dp. Measured
   again at these values the headroom is 3dp and 4.5dp. */
.t-headline-m{font-size:22px;line-height:32px;font-weight:700}
.t-headline-l{font-size:28px;line-height:40px;font-weight:700;letter-spacing:-.2px}
.t-body-m    {font-size:14px;line-height:22px}
.t-body-s    {font-size:12.5px;line-height:20px}
.t-label-l   {font-size:14px;line-height:20px;font-weight:600}
.t-overline  {font-size:11px;line-height:16px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase}

/* Code. codeHero 42/52 is a television size: seventeen monospace characters
   need 445dp, which no phone column has. The compact token is 28/36 — 303dp in
   a mono whose advance is 0.6em, the same as the Roboto Mono Compose will use,
   so this number is the device's number. 30sp filled the phone column exactly,
   which is not a fit but a clip waiting for a font scale. */
.code-tv     {font-family:"Liberation Mono","DejaVu Sans Mono",monospace;
              font-size:42px;line-height:52px;font-weight:700;letter-spacing:1px}
.code-phone  {font-family:"Liberation Mono","DejaVu Sans Mono",monospace;
              font-size:28px;line-height:36px;font-weight:700;letter-spacing:1px}

/* The address is Latin-and-digits inside a paragraph that may run right to
   left. Left to inherit the paragraph, the bidi algorithm is free to reorder
   its runs -- and the all-neutral placeholder form, "··:··:··:··:··:··", is
   reordered outright. Isolation is not a nicety here: a licence address that
   displays differently in Arabic is a support case in every RTL market. */
.code{color:var(--mist);white-space:nowrap;
      direction:ltr;unicode-bidi:isolate;text-shadow:0 0 26px rgba(111,178,255,.22)}

.dim{color:var(--silver)}
.faint{color:var(--faint)}

/* ------------------------------------------------------------------ pieces */
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r-pill);
  white-space:nowrap;flex:0 0 auto}
/* The trial, stated once and quietly. It is Castivio's licence, never the
   provider's subscription, so it carries Castivio's name and never the word
   on its own. */
.pill-trial{height:28px;padding:0 12px;font-size:12px;font-weight:600;
  background:rgba(155,107,255,.16);border:1px solid rgba(155,107,255,.34);color:var(--violet60)}
/* The separator is drawn, not typed. A middle dot between "Castivio" and an
   Arabic-Indic numeral is a neutral character between a strong LTR run and an
   Arabic number, and the bidi algorithm is entitled to place it on the far side
   of the digit -- which it did, rendering "تجربة Castivio ٧ ·". A shape in a
   flex gap has no direction to resolve and cannot be moved. */
.pill-trial .dot{width:3px;height:3px;border-radius:50%;
  background:currentColor;opacity:.65;flex:0 0 auto}
/* Language is on the first screen because the person who needs it is the one
   who cannot read what is on it. One control showing the current language in
   its own name -- not a row of codes implying three languages exist. */
.pill-lang{height:28px;padding:0 10px;font-size:12px;font-weight:600;
  background:var(--glass-mid);border:1px solid var(--glass-edge);color:var(--mist)}
.pill-lang svg{flex:0 0 auto;opacity:.75}
/* Refresh is the one action whose meaning a glyph carries better than a word
   in thirty-seven languages, so it gets one. */
.btn svg{flex:0 0 auto;opacity:.9}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:var(--r-sm);font-weight:600;white-space:nowrap;flex:0 0 auto}
.btn-touch{height:48px;padding:0 20px;font-size:14px}   /* Sizing.minTouchTarget */
.btn-tv   {height:56px;padding:0 24px;font-size:15px}   /* Sizing.minTvTarget   */
/* The approved identity, violet into azure -- the gradient shell-home.html was
   signed off with, not the azure-only ramp the button currently implements. */
.btn-primary{background:linear-gradient(90deg,var(--violet50),var(--azure50));color:#0B0820}
.btn-secondary{background:var(--glass-mid);border:1px solid var(--glass-edge);color:var(--mist)}
.focused{box-shadow:0 0 0 2px var(--violet50), 0 0 24px 2px rgba(155,107,255,.45)}

/* Icon-only, adjacent to the value it copies -- which is why it needs no label
   in any of the 37 languages. Still a full touch target, still focusable. */
.icon-btn{display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--r-sm);background:var(--glass-mid);border:1px solid var(--glass-edge);
  color:var(--mist);flex:0 0 auto}
.icon-touch{width:48px;height:48px}
.icon-tv{width:56px;height:56px}

/* ---------------------------------------------------------------------- QR */
/* Qr.kt draws black modules on white and clips to Radius.sm. Scannability is a
   module-pitch question: a 17-character payload is a version 1 symbol, 21
   modules plus a quiet zone, so 130dp is 5.2dp a module — fourteen physical
   pixels at 2.75x, which a phone camera reads from 20cm. */
.qr{background:#fff;border-radius:var(--r-sm);flex:0 0 auto;overflow:hidden}
.qr svg{display:block;shape-rendering:crispEdges;width:100%;height:100%}
/* Beside the code, not beneath it. Landscape has width to spend and no height,
   and a caption under a QR was costing 54dp of the 241dp the body has. */
.qr-block{display:flex;align-items:center;flex:0 0 auto}
.qr-block .cap{color:var(--silver)}

/* A seam, not a rule.
   The card stays one object -- the two functions inside it are not two cards --
   so the eye needs only enough of a boundary to know that the address and its
   actions are one job and the code is another. A hairline at the divider
   token's own alpha, faded to nothing at both ends the way glassBorderBrush
   fades. At full strength across the full height it would read as two panels
   butted together, which is the thing this is not.
   In RTL the flex row reverses and the seam travels with it, so the order
   becomes QR | seam | MAC without a single direction-specific rule. */
.seam{flex:0 0 auto;align-self:stretch;width:1px;border-radius:1px;
  background:linear-gradient(180deg,transparent 0%,var(--divider) 16%,
             var(--divider) 84%,transparent 100%)}
/* Should a breakpoint ever stack the sections, the seam turns with them. None
   of the three frames does -- all three measure as side by side -- but the rule
   exists so the orientation is a property of the layout rather than a redraw. */
.split.stacked{flex-direction:column;align-items:stretch}
.split.stacked > .seam{width:auto;height:1px;
  background:linear-gradient(90deg,transparent 0%,var(--divider) 16%,
             var(--divider) 84%,transparent 100%)}

/* ------------------------------------------------------------------ layout */
.shell{position:absolute;inset:0;display:flex;flex-direction:column}
.sysbar{height:24px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;color:var(--silver);font-size:11px}
.gesture{height:20px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.gesture i{display:block;width:96px;height:3px;border-radius:var(--r-pill);background:rgba(255,255,255,.32)}

.stage{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
#phone-873 .stage{padding:20px 24px 14px}
#phone-800 .stage{padding:16px 20px 12px}
#tv .stage{position:absolute;inset:48px;padding:0}

/* One row, because height is the scarce dimension and width is not. Three
   items at their longest across the 37 languages come to about 560dp of the
   825 a phone has. */
.head{flex:0 0 auto;display:flex;align-items:center;gap:16px}
.head h1{flex:0 1 auto;min-width:0}
.head .spacer{flex:1 1 auto}

/* Free height is centred above and below the card. Poured into the card it
   pushes its contents apart; left at the foot it reads as a screen that ran
   out of things to say. */
.card{flex:0 0 auto;margin-top:auto;margin-bottom:auto}
#phone-873 .card{padding:20px}
#phone-800 .card{padding:16px}
#tv .card{padding:24px}

/* The address, its label and its copy control on one row. A grid rather than a
   flex row because the device key becomes a second row of the same three
   columns the day the pairing service exists -- label, value, copy -- and the
   columns should already line up when it does. Nothing reserves space for it
   now: an empty row held open is a promise on screen. */
/* Three content-sized columns, not a stretching middle one: `1fr` on the value
   pushed the copy control to the far edge of the card, ~180dp from the address
   it copies, and the whole point of an unlabelled icon is that adjacency says
   what it does. End-aligning the value is what makes the second row line up
   under the first when the device key arrives -- a short key and a long address
   share one right edge, and one column of copy controls. */
.values{display:grid;grid-template-columns:auto auto auto;justify-content:start;align-items:center}
.values .val{justify-self:end}
#phone-873 .values{column-gap:16px}
#phone-800 .values{column-gap:14px}
#tv .values{column-gap:16px}
.values .label{white-space:nowrap}
.values .val{min-width:0;display:flex;align-items:center;justify-content:flex-end}

.actions{display:flex;align-items:center;flex-wrap:nowrap}
#phone-873 .actions{gap:12px;margin-top:20px}
#phone-800 .actions{gap:10px;margin-top:16px}

/* Phone: the code block and the QR abreast inside one card. */
.split{display:flex;align-items:center}
#phone-873 .split{gap:22px}
#phone-800 .split{gap:18px}
.split .main{flex:1 1 auto;min-width:0}

#phone-873 .qr{width:130px;height:130px}
#phone-800 .qr{width:112px;height:112px}
#phone-873 .qr-block{gap:12px}
#phone-800 .qr-block{gap:10px}
#phone-873 .qr-block .cap{width:132px}
#phone-800 .qr-block .cap{width:118px}

/* Television. The same two columns as the phone, and deliberately so: one
   arrangement means one focus order and one mental model across the range. What
   changes is everything the space decides -- the address at its full 42sp
   measure rather than 28, D-pad targets at 56 rather than 48, and the QR's
   caption below it rather than beside it, because a television has the height
   to spend and a phone in landscape does not. That is adaptation from measured
   space; a scale factor would have been the other thing.
   The address needs 445dp of the 456 its row has once the label, the copy
   control and the gaps are paid for. Eleven dp of that margin was bought back
   from the column gap and the caption's measure rather than from the type: 42sp
   is the approved television size and whitespace is the cheaper thing to spend. */
#tv .split{gap:32px;align-items:center}
#tv .actions{gap:16px;margin-top:24px}
#tv .qr{width:168px;height:168px}
#tv .qr-block{flex-direction:column;gap:10px;align-items:center}
#tv .qr-block .cap{width:168px;text-align:center}

/* A standing statement of what Castivio is, and the one line on this screen
   that is here for the reader's protection rather than their task. Small,
   quiet, and never competing with the address. */
.footer{flex:0 0 auto;text-align:center;color:var(--faint)}
#phone-873 .footer{margin-top:12px}
#phone-800 .footer{margin-top:10px}
#tv .footer{margin-top:16px}

/* ------------------------------------------------------------------- spec */
.spec{display:none}
html[data-spec="1"] .spec{display:block}
.spec-chip{position:absolute;z-index:9;
  font-family:"Liberation Mono",monospace;font-size:9px;line-height:12px;
  padding:1px 4px;border-radius:3px;direction:ltr;
  background:rgba(8,7,26,.86);border:1px solid var(--azure50);color:var(--azure60)}
.spec-safe{position:absolute;z-index:8;pointer-events:none;border:1px dashed rgba(255,176,32,.55)}
/* Focus order, numbered on the render so a remote's path is reviewed by eye
   rather than asserted in prose. The QR carries no focusable of its own -- it
   is read by a camera, not pressed -- so the whole path lives in the MAC
   section and mirrors with it in RTL. */
.spec-focus{position:absolute;z-index:10;width:15px;height:15px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;direction:ltr;
  font-family:"Liberation Mono",monospace;font-size:9px;font-weight:700;
  background:#9B6BFF;color:#0B0820;transform:translate(-50%,-50%)}
.spec-note{position:absolute;z-index:9;right:6px;bottom:6px;direction:ltr;
  font-family:"Liberation Mono",monospace;font-size:9px;line-height:13px;text-align:right;
  color:#FFB020;background:rgba(8,7,26,.86);padding:3px 6px;border-radius:4px}
</style>
</head>

  <svg class="mesh" viewBox="0 0 960 540" preserveAspectRatio="none">
    <g fill="none" stroke="#9B6BFF" stroke-opacity=".07" stroke-width="1">
      <path d="M0,392 C160,352 320,432 480,392 C640,352 800,432 960,392"/>

<script>

/* ---------------------------------------------------------------------------
   A QR code, drawn rather than encoded.

   The real one comes from ZXing over the address. What matters in a mockup is
   the module count, because that is what decides whether a printed size is
   scannable: seventeen characters is a version 1 symbol, 21 modules, so the
   grid below is 21 with proper finder and timing patterns. Arguments about size
   made against this are sound; the payload is not real.
   ------------------------------------------------------------------------ */
function qrSvg() {
  var N = 21, QUIET = 2, span = N + QUIET * 2;
  var grid = [];
  for (var y = 0; y < N; y++) grid.push(new Array(N).fill(false));

  function finder(r, c) {
    for (var y = 0; y < 7; y++)
      for (var x = 0; x < 7; x++) {
        var edge = y === 0 || y === 6 || x === 0 || x === 6;
        var core = y >= 2 && y <= 4 && x >= 2 && x <= 4;
        grid[r + y][c + x] = edge || core;
      }
  }
  finder(0, 0); finder(0, N - 7); finder(N - 7, 0);
  for (var i = 8; i < N - 8; i++) { grid[6][i] = i % 2 === 0; grid[i][6] = i % 2 === 0; }
  grid[N - 8][8] = true;

  var seed = 0x5EED;
  function next() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
  function reserved(y, x) {
    return (y < 9 && x < 9) || (y < 9 && x > N - 9) || (y > N - 9 && x < 9) || y === 6 || x === 6;
  }
  for (y = 0; y < N; y++)
    for (var x = 0; x < N; x++)
      if (!reserved(y, x)) grid[y][x] = next() > 0.48;

  var rects = "";
  for (y = 0; y < N; y++)
    for (x = 0; x < N; x++)
      if (grid[y][x]) rects += '<rect x="' + (x + QUIET) + '" y="' + (y + QUIET) + '" width="1" height="1"/>';

  return '<svg viewBox="0 0 ' + span + " " + span + '"><g fill="#08071A">' + rects + "</g></svg>";
}

var COPY_ICON =
  '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
  '<rect x="9" y="9" width="11" height="11" rx="2.5"/>' +
  '<path d="M15 5.5A2.5 2.5 0 0 0 12.5 3H6.5A2.5 2.5 0 0 0 4 5.5v6A2.5 2.5 0 0 0 6.5 14"/></svg>';

var REFRESH_ICON =
  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M20.5 12a8.5 8.5 0 0 1-14.4 6.1"/><path d="M6 22v-4h4"/>' +
  '<path d="M3.5 12a8.5 8.5 0 0 1 14.4-6.1"/><path d="M18 2v4h-4"/></svg>';

var GLOBE_ICON =
  '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/>' +
  '<path d="M12 3c2.6 2.4 4 5.6 4 9s-1.4 6.6-4 9c-2.6-2.4-4-5.6-4-9s1.4-6.6 4-9z"/></svg>';

(function () {
  var q = new URLSearchParams(location.search);
  var frame = q.get("frame") || "phone-873";
  var lang = q.get("lang") || "en";
  var s = S[lang] || S.en;

  document.documentElement.dataset.frame = frame;
  document.documentElement.lang = lang;
  document.documentElement.dir = s.dir;
  if (q.get("spec") === "1") document.documentElement.dataset.spec = "1";

  // Focus badges are positioned from the elements' measured boxes, so they
  // cannot drift out of step with a layout change the way hand-placed ones do.
  if (q.get("spec") === "1") {
    requestAnimationFrame(function () {
      var frameEl = document.getElementById(frame);
      var host = frameEl.querySelector(".spec");
      var rect = frameEl.getBoundingClientRect();
      var order = frameEl.querySelectorAll(".icon-btn, .btn, .pill-lang");
      order.forEach(function (el, i) {
        var b = el.getBoundingClientRect();
        var badge = document.createElement("span");
        badge.className = "spec-focus";
        badge.textContent = String(i + 1);
        badge.style.left = (b.left - rect.left + b.width / 2) + "px";
        badge.style.top = (b.top - rect.top) + "px";
        host.appendChild(badge);
      });
    });
  }

  var svg = qrSvg();
  document.querySelectorAll("[data-qr]").forEach(function (n) { n.innerHTML = svg; });
  document.querySelectorAll("[data-copy]").forEach(function (n) {
    n.innerHTML = COPY_ICON;
    n.setAttribute("title", s.copy);
    n.setAttribute("aria-label", s.copy);
  });
  document.querySelectorAll("[data-s]").forEach(function (n) {
    var key = n.getAttribute("data-s");
    // No silent fallback. `s[key] || S.en[key]` returns undefined for a key
    // neither table has, and assigning that to textContent writes the literal
    // word "undefined" -- text, so nothing downstream notices. A missing string
    // is now conspicuous on screen and detectable by the measuring script.
    var text = key in s ? s[key] : (key in S.en ? S.en[key] : "\u27e8" + key + "\u27e9");
    if (n.hasAttribute("data-globe")) n.innerHTML = GLOBE_ICON + "<span>" + text + "</span>";
    else if (n.hasAttribute("data-refresh")) n.innerHTML = REFRESH_ICON + "<span>" + text + "</span>";
    else n.textContent = text;
  });
})();
