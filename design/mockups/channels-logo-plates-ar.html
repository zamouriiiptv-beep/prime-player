<!DOCTYPE html>
<!-- The channel logos that are cut off or lost, as they are and as they are meant to be: three columns of the same rows.
     Phone geometry, 833x385dp, one px per dp; rendered at 2x. Not the app: a drawing of how the screen is meant to look. The logos are drawn here
     as simple stand-ins of the real ones, at their real proportions; names and figures are examples.
       **What the owner's photographs show** (2340x1080, enlarged): TOONAMI reads TOONAM, CANAL+ loses the ends of its C and its plus, CN's black blocks
       and the National Geographic frame stand outside their plate, ACTION is a grey word on a black box on a black ground and is not seen.
       **Why:** the plate is the logo's slot -- 26x13.6dp on a handset -- with the corners of a 8dp radius, which on a slot 13.6dp high is a pill. A dark
       logo is drawn on it at 105% of its fitted size, so the letters at either end stand over the rounded ends and past them; what is outside the plate is
       dark on the dark ground, and so gone. ACTION is not plated at all: a picture that is nine tenths opaque "brings its own ground", and this one's is black.
       **A -- as it is.**
       **B -- what is proposed:** (1) the plate is a rectangle with small corners (3dp) and the logo is drawn *inside* it, with a margin and at its fitted
       size: no 105% on a plated logo, so none of it stands outside; (2) the slot is a fifth larger, 32x16.5dp, which gives back the size the margin takes and is
       the "slightly larger frame" the owner asked for; the row does not grow, and the name has 6dp less; (3) a picture that fills its box is plated too
       when its ink is dark -- the exception was for a picture whose own ground is light: ACTION is then a black box in a light frame.
       **C -- a plate under every logo,** drawn to show why it is not proposed: a white logo (MGG TV) is lost on it, a pale one is weak, and the list becomes a
       column of white pills.
       `?frame=sheet` is the default. -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>صفائح الشعارات</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05040E;color:#fff;font-family:"Inter","DejaVu Sans",system-ui,sans-serif;width:833px}
.cap{padding:14px 20px 8px;font-size:13px;line-height:1.7;color:#cfd0ea;direction:rtl}
.cap b{color:#fff}
.cols{display:flex;gap:10px;padding:6px 14px 0;direction:ltr}
.col{width:260px}
.col h{display:block;height:48px;font-size:12px;color:#cfd0ea;margin:0 0 6px;direction:rtl;text-align:right;line-height:1.5}
.col h b{color:#fff}
.panel{position:relative;width:260px;height:252px;border-radius:10px;background:linear-gradient(140deg,#1c1a41,#141a3b 60%,#0f1d3b);border:1px solid #393651;overflow:hidden}
.lr{position:absolute;left:8px;right:8px;height:27.5px;display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;white-space:nowrap}
.no{width:22px;height:15px;border-radius:3px;background:rgba(255,255,255,.06);border:1px solid #4a4764;font-size:10px;text-align:center;line-height:13px;flex:none}
.slot{display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.slot.plate{background:rgba(238,240,248,.94)}
.slot svg{overflow:visible;display:block}
.nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.close{display:flex;gap:6px;padding:8px 14px 0;direction:ltr}
.cell{width:260px;background:linear-gradient(140deg,#1c1a41,#141a3b);border:1px solid #393651;border-radius:8px;padding:8px 8px 6px}
.big{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.big .slot{zoom:2.2}
.tag{font-size:9px;background:#ff5b6b;color:#fff;border-radius:4px;padding:1px 5px;direction:rtl;display:inline-block;margin-inline-start:6px}
.tag.ok{background:#1fc89a;color:#052018}.tag.no{background:#7a7a8a}
</style></head><body>
<script>
/* stand-ins of the real logos, at their proportions: [aspect, svg body] */
const L={
 cn:[1.9,'<rect x="1" y="2" width="12" height="26" fill="#17161f"/><rect x="39" y="2" width="12" height="26" fill="#17161f"/><text x="26" y="25" text-anchor="middle" font-size="26" font-weight="900" fill="#17161f" font-family="DejaVu Sans,sans-serif">CN</text>',52,30],
 dw:[2.7,'<circle cx="16" cy="15" r="13" fill="#143c98"/><circle cx="21" cy="12" r="10" fill="#e9ecf4"/><text x="30" y="26" font-size="8" font-weight="800" fill="#143c98" font-family="DejaVu Sans,sans-serif">DreamWorks</text>',70,30],
 tn:[4.4,'<text x="0" y="22" font-size="26" font-weight="900" fill="#17161f" textLength="132" lengthAdjust="spacingAndGlyphs" font-family="DejaVu Sans,sans-serif">TOONAMI</text><rect x="64" y="5" width="3" height="8" fill="#c8102e"/>',132,30],
 ng:[3.0,'<rect x="0" y="2" width="18" height="26" fill="none" stroke="#ffcc00" stroke-width="3.5"/><text x="23" y="14" font-size="11" font-weight="700" fill="#17161f" font-family="DejaVu Sans,sans-serif">NATIONAL</text><text x="23" y="27" font-size="11" font-weight="700" fill="#17161f" font-family="DejaVu Sans,sans-serif">GEOGRAPHIC</text>',90,30],
 cp:[4.0,'<text x="0" y="23" font-size="27" font-weight="900" fill="#0a0a10" textLength="118" lengthAdjust="spacingAndGlyphs" font-family="DejaVu Sans,sans-serif">CANAL+</text>',120,30],
 ac:[4.3,'<rect x="0" y="0" width="129" height="30" fill="#0b0b0f"/><text x="64" y="22" text-anchor="middle" font-size="22" font-weight="700" fill="#8a8a92" textLength="112" lengthAdjust="spacingAndGlyphs" font-family="DejaVu Sans,sans-serif">ACTION</text>',129,30],
 w9:[1.9,'<text x="28" y="26" text-anchor="middle" font-size="30" font-weight="900" fill="#8f3fe6" font-family="DejaVu Sans,sans-serif">W9</text>',56,30],
 mg:[3.5,'<path d="M2 15l9-9 9 9-9 9z" fill="none" stroke="#fff" stroke-width="3"/><text x="26" y="22" font-size="20" font-weight="800" fill="#fff" font-family="DejaVu Sans,sans-serif">MGGTV</text>',105,30]};
const ROWS=[[79,'FR| CARTOON NETWORK HD','cn',1,1],[81,'FR| DREAM WORKS HD','dw',1,1],[84,'FR| TOONAMI HD','tn',1,1],[86,'FR| NATIONAL GEOGRAPHIC HD','ng',1,1],
 [88,'FR| CANAL+ 4K','cp',1,1],[15,'FR| ACTION 4K','ac',0,1],[9,'FR| W9 4K','w9',0,0],[82,'FR| MGG TV RAW','mg',0,0]];
/* geometry of a logo's slot, in dp: [width, height, corner, inset around the picture, how much larger the picture is drawn] */
const GEO={a:[26,13.6,7,0,1.05],b:[32,16.5,3,1.8,1],c:[32,16.5,3,1.8,1]};
function svg(key,w,h){const [asp,body,vw,vh]=L[key]; return `<svg width="${w}" height="${h}" viewBox="0 0 ${vw} ${vh}" preserveAspectRatio="xMidYMid meet">${body}</svg>`;}
function slot(key,mode,plated){
  const [W,H,R,I,Z]=GEO[mode];
  const iw=W-2*I*1.3, ih=H-2*I;               /* the room the picture has */
  const [asp]=L[key];
  let w=iw,h=iw/asp; if(h>ih){h=ih;w=ih*asp;}  /* fitted */
  const z = plated&&mode!=='a'?1:Z;
  return `<span class="slot ${plated?'plate':''}" style="width:${W}px;height:${H}px;border-radius:${plated?R:0}px"><span style="display:block;transform:scale(${z})">${svg(key,w,h)}</span></span>`;
}
function panel(mode){
  let h='';
  ROWS.forEach(([no,nm,k,platedNow,platedB],i)=>{
    const plated= mode==='a'?platedNow : mode==='b'?(platedNow||k==='ac') : 1;
    h+=`<div class="lr" style="top:${6+i*30.5}px"><span class="no">${no}</span>${slot(k,mode,plated)}<span class="nm">${nm}</span></div>`;
  });
  return `<div class="panel">${h}</div>`;
}
function closeups(mode){
  const keys=['tn','cp','ac','cn'];
  return `<div class="cell"><div class="big">${keys.map(k=>{const p=mode==='a'?['cn','dw','tn','ng','cp'].includes(k):mode==='b'?true:true;return slot(k,mode,p);}).join('')}</div></div>`;
}
const cols=[['a','<b>أ — كما هو</b> <span class="tag no">الآن</span><br>صفيحة بزوايا كبسولة، والشعار أكبر منها بـ٥٪'],
            ['b','<b>ب — المقترح</b> <span class="tag ok">المقترح</span><br>صفيحة مستطيلة بزوايا صغيرة والشعار كاملًا داخلها، وخانة أكبر بخُمس'],
            ['c','<b>ج — صفيحة لكل شعار</b> <span class="tag no">للمقارنة</span><br>للمقارنة: الشعار الأبيض يضيع على الصفيحة الفاتحة']];
const q=new URLSearchParams(location.search), frame=q.get('frame')||'sheet';
let html=`<div class="cap"><b>ما في صورتك:</b> «TOONAMI» تُقرأ «TOONAM» وطرفا «CANAL+» مقصوصان وكتلتا CN السوداوان وإطار ناشيونال جيوغرافيك خارج الصفيحة، و«ACTION» كلمة رمادية على صندوق أسود على أرضية سوداء فلا تُرى. <b>السبب:</b> الصفيحة بحجم خانة الشعار (٢٦×١٣٫٦dp) وزواياها نصف قطرها ٨dp فهي كبسولة، والشعار الداكن يُرسم عليها أكبر منها بـ٥٪، فما خرج عنها داكن على أرضية داكنة فيختفي. و«ACTION» لا تأخذ صفيحة أصلًا لأن صورتها تملأ صندوقها فتُعدّ «ذات أرضية خاصة».</div>`;
html+=`<div class="cols">${cols.map(([m,t])=>`<div class="col"><h>${t}</h>${panel(m)}</div>`).join('')}</div>`;
html+=`<div class="cap" style="padding-top:12px"><b>عن قرب (×٢٫٢):</b> الصفوف الأربعة الأولى في كل عمود.</div>`;
html+=`<div class="close">${cols.map(([m])=>closeups(m)).join('')}</div>`;
html+=`<div class="cap"><b>ما يتغيّر في الكود (مكان واحد):</b> <code>ProviderArtwork</code> في <code>:core:design</code>، فيسري على صفوف القنوات وصورة المعاينة الكبيرة وبطاقة القناة والراديو و«ما فاتك» معًا. (١) صفيحة <b>مستطيلة نصف قطرها ٣dp</b> بدل ٨dp، والشعار المُصفَّح يُرسم <b>داخلها بهامش وبحجمه الملائم</b> بلا تكبير ٥٪. (٢) خانة الشعار في الصف من ٢٦×١٣٫٦ إلى <b>٣٢×١٦٫٥dp</b> (الصف نفسه لا يكبر، والاسم يخسر ٦dp، أي حرفًا تقريبًا). (٣) الصورة التي تملأ صندوقها وحبرها داكن (ACTION) <b>تأخذ صفيحة أيضًا</b>، فتظهر صندوقًا أسود في إطار فاتح. القاعدة نفسها: متوسط سطوع الحبر أقل من ٠٫٣٠. لا تُضاف صفيحة لباقي الشعارات (W9 وTF1 وSYFY وTEVA تُقرأ كما هي).</div><div style="height:12px"></div>`;
document.write(html);
</script>
</body></html>
