<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Castivio — choosing how to add a playlist</title>
<style>
/* ============================================================================
   Castivio — the source choice, as one screen.

   ---------------------------------------------------------------------------
   Why this file exists

   It did not, and that is how the screen shipped broken. The step was a
   top-anchored column inside `ActivationSurface`'s `verticalScroll`: a header,
   two full-width cards and Back, which on a television came to more than the
   444dp inside the overscan. So it scrolled, and clipped at whichever end the
   user was not looking at -- the title off the top, or Back off the bottom.
   A remote pressing *down* moved the page instead of the focus.

   Nothing about the content was wrong. It had never been drawn at the size it
   had to fit, which is the one thing a mockup is for.

   ---------------------------------------------------------------------------
   The composition

   Three parts, spaced evenly and centred as one group.

   Pinning them to the band's three edges was the first fix and it solved the
   scroll, but it bought the fit with two 32-48dp holes -- one under the header,
   one over Back -- and cards stretched to 244dp to fill what was left. Two lines
   of type in a 244dp pane read as a pane that lost something.

   So the cards are the size of what is in them and the group is centred. The
   leftover, which is the same leftover either way, becomes an even margin above
   and below rather than two gaps inside the composition. Emptiness at the edge
   of a page is margin; the same emptiness between two elements is a hole.

   The cards are side by side. They are a choice between two, and stacking them
   spent the vertical axis -- the scarce one on a 16:9 frame -- while the
   horizontal axis sat empty. On a remote it is also the gesture the hand
   expects: left and right between the options, down to Back.

   No height is written down. Each card is the height of what is in it, the row
   is the height of the taller, and the group is placed by
   `Arrangement.spacedBy(Spacing.xxl, Alignment.CenterVertically)`. There is no
   Spacer and no card height to keep in step with a frame table, so a longer
   translation makes the cards taller and the margins narrower rather than
   pushing Back off the screen.

   No intrinsic pass either. `height(IntrinsicSize.Min)` with `fillMaxHeight` is
   the Compose idiom for equalising siblings, and it was drawn both ways: with
   these strings the two renders are byte-identical, because both cards hold a
   title and one line. It was buying nothing and costing a second measurement of
   the subtree that can only fail at runtime. Where a translation wraps, the two
   cards differ by 20dp and their titles still line up.

     band    864 x 444    inset 48 = Spacing.tvOverscan
     margin       58      what is left over, split evenly
     header       64      headlineMedium 22/32 + Spacing.sm + bodyLarge 15/24
     gap          32      Spacing.xxl
     cards       146      the taller card's own height; two of 420, Spacing.xl apart
     gap          32      Spacing.xxl
     back         56      Sizing.minTvTarget, ButtonWeight.Ghost
     margin       58
     overflow      0

   116dp of headroom over the content as it stands. That is the honest number:
   the layout is not overflow-proof at any conceivable content size, it has room
   for the type to grow by a third. The stress render (?stress=1) doubles both
   lines in each card and the title, and still measures 0.

   ---------------------------------------------------------------------------
   The other frame, which this file did not draw and should have

   What renders below is a television. The screen shipped stacked and scrolling
   on a landscape handset twice, and the reason it could is partly here: the one
   frame that was ever drawn was the roomy one.

   A handset is 873dp of window, and `safeDrawing` spends the display cutout
   before the layout sees anything -- 41dp on the reporter's phone, on the
   leading edge only. So the band is 827 x 393, not 873 x 393, and it is 51dp
   shorter than the television's.

     band    827 x 393    inset 24 = Spacing.screen, no overscan to clear
     margin       36      what is left over, split evenly
     header       64      the same type as above
     gap          32      Spacing.xxl
     cards        96      Spacing.xl of vertical padding, not Spacing.xxxl
     gap          32      Spacing.xxl
     back         48      Sizing.minTouchTarget
     margin       36
     overflow      0

   The card padding is the one figure that differs, and it is not cosmetic:
   `Spacing.xxxl` makes the card 144 and the screen 368, which fits 393 and
   overruns the 360dp frame in `ActivationLayoutTest` by 8dp. The frame no longer
   scrolls, so an overrun does not scroll -- it clips. `SourceChoiceBudgetTest`
   computes both frames from the same tokens and fails on the overrun.

   ---------------------------------------------------------------------------
   The card's own hierarchy

   `titleLarge` 17/24 over `bodySmall` 12.5/20, where it was `titleMedium` 15/22
   over `bodyMedium` 14/22. A sixteenth of a step is not a hierarchy: the two
   lines were the same size and the same weight, and only the colour said which
   was the name of the thing. The source name is what the eye is choosing
   between, so it leads, and the sentence under it explains rather than competes.

   ---------------------------------------------------------------------------
   The glass, and the one value that is not the default

   `InteractiveGlassCard` fills with `glassFillBrush` -- 7.8% of white fading to
   3.9% down the card. That is right for a column of tiles, where the fade is
   what stops them reading as a stack of slabs. It is wrong at this size: the
   fade lands the bottom half of a 244dp pane on 3.9%, the fill of an *inactive*
   surface, so a card the user is being asked to choose looks half switched off.
   These two hold at 7.8% throughout. Same token, no fade.

   Everything else is the system untouched: `glassBorder` at 23.9%, `Radius.lg`,
   and `focusRing` / `focusGlow` for the focused pane.

     ?lang=en   the same composition the other way round
     ?spec=1    the band arithmetic, drawn
     ?stress=1  every string doubled, to spend the headroom on purpose
   ========================================================================= */
@font-face{font-family:"Castivio Sans";font-weight:400;font-style:normal;
  src:url("../../core/design/src/main/res/font/inter_regular.ttf") format("truetype")}
@font-face{font-family:"Castivio Sans";font-weight:500;font-style:normal;
  src:url("../../core/design/src/main/res/font/inter_medium.ttf") format("truetype")}
@font-face{font-family:"Castivio Sans";font-weight:600;font-style:normal;
  src:url("../../core/design/src/main/res/font/inter_semibold.ttf") format("truetype")}
@font-face{font-family:"Castivio Sans";font-weight:700;font-style:normal;
  src:url("../../core/design/src/main/res/font/inter_bold.ttf") format("truetype")}
@font-face{font-family:"Castivio Arabic";font-weight:400;font-style:normal;
  src:url("../../core/design/src/main/res/font/plex_arabic_regular.ttf") format("truetype")}
@font-face{font-family:"Castivio Arabic";font-weight:500;font-style:normal;
  src:url("../../core/design/src/main/res/font/plex_arabic_medium.ttf") format("truetype")}
@font-face{font-family:"Castivio Arabic";font-weight:700;font-style:normal;
  src:url("../../core/design/src/main/res/font/plex_arabic_bold.ttf") format("truetype")}

:root{
  --void:#08071A; --deep:#141031; --violet10:#1B1038; --violet50:#9B6BFF;
  --azure10:#0A1E3D; --azure40:#2E6BFF; --azure60:#6FB2FF;
  --mist:#F2F2F8; --silver:#C9C9DA;
  /* Colour.kt: GlassMid 0x14 is glassFillStrong, GlassLow 0x0A is glassFill,
     GlassEdge 0x3D is glassBorder. */
  --glass-strong:rgba(255,255,255,.078);
  --glass:rgba(255,255,255,.039);
  --glass-border:rgba(255,255,255,.239);
  /* The startup mark's own fill, read out of `Intro.kt` rather than sampled off
     a screenshot: `MARK_COLOURS = listOf(Color(0xFF9B6BFF), Color(0xFF4C9BFF))`
     under a `Brush.horizontalGradient`. The violet is `--violet50` again; the
     azure end is the one value Intro carries that the palette does not, so it
     is named here for what it is rather than rounded to `--azure60`. */
  --mark-a:#9B6BFF; --mark-b:#4C9BFF;
  --r-lg:20px;
  --r-xl:24px;   /* Radius.xl -- one step up, so the container nests the cards */

  /* The handset, which is the frame that decides everything: 873dp of window
     less the 41dp `safeDrawing` spends on the display cutout. `?frame=tv`
     swaps in the television's, which has 44dp more slack than this one. */
  --frame-w:827px; --frame-h:393px;
  --inset:24px;        /* Spacing.screen */
  /* Four cards carrying a description each is what sets these.
     ------------------------------------------------------------------------
     The band is 345 and the fixed parts take 296 of it: header 64, two card
     rows, Back 48, and the two `Spacing.xl` gaps that separate the three
     groups. `Spacing.lg` inside the card leaves 80 per row and 9dp over --
     `Spacing.xl` would leave 96 per row and overrun by 23. */
  --card-pad-y:8px;   /* Spacing.lg */
  --card-pad-x:20px;
  --grid-gap:8px;     /* Spacing.lg, the same figure across and down */
  --panel-pad:8px;     /* Spacing.sm -- what the arithmetic leaves; see the Kotlin */
  --panel-gap:4px;     /* Spacing.sm, grid to Back inside the container */
  --legal-gap:4px;    /* was Spacing.sm 8, +8 as asked */
  /* `Spacing.xxl`, up from `Spacing.xl` when the subtitle went. Deleting it
     freed 32dp, and the whole 32 going into the outer margin would have left
     the title and the footer clinging to a grid they are 24 away from while
     34 of nothing sat above and below. Split between the two gaps instead:
     the three parts separate, and 10.5 is still left over at each end. */
  /* Down from `Spacing.xxl`. The container groups the middle of the screen by
     drawing a surface around it, so the gap no longer has to do that work --
     and 12 is what this composition can afford once the container's own inset
     and the sentence below it are paid for. */
  --group-gap:8px;    /* was Spacing.md 12, +8 as asked */
  --back-h:48px;       /* Sizing.minTouchTarget */
  --ring:36px;         /* Sizing.minTarget - Spacing.md */
  /* The corner mark, and the rule beside Back. Both are decoration, and both
     are sized so that they cost the composition nothing -- see their rules. */
  --mark-size:16px;
  --mark-gap:16px;     /* Spacing.lg, mark to title */
  --rule-gap:16px;     /* Spacing.lg, the same figure at both ends of the rule */
}
/* The shortest frame the project ships to: an ordinary 360dp phone turned
   sideways. It is the same token set as the handset -- only the frame differs --
   and it is drawn because it is the frame with the least of everything. */
html[data-frame="short"]{--frame-w:800px; --frame-h:360px}
html[data-frame="tv"]{
  --frame-w:960px; --frame-h:540px;
  --inset:48px;        /* Spacing.tvOverscan */
  /* 444dp of band and the same seven parts, so every figure goes up one step
     and there is still 44dp spare. */
  --card-pad-y:24px;   /* Spacing.xl */
  --card-pad-x:32px;   /* Spacing.xxl */
  --grid-gap:16px;     /* Spacing.xl */
  --panel-pad:16px;    /* Spacing.lg */
  --panel-gap:16px;    /* Spacing.lg */
  --legal-gap:16px;    /* was Spacing.xl 24, +8 as asked */
  --group-gap:16px;    /* was Spacing.xl 24, +8 as asked */
  --back-h:56px;       /* Sizing.minTvTarget */
  --ring:44px;
  --mark-size:19px;
  --mark-gap:24px;     /* Spacing.xl */
  --rule-gap:24px;     /* Spacing.xl */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
body{font-family:"Castivio Sans","Castivio Arabic","Noto Sans",sans-serif;color:var(--mist);
  -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}

#tv{position:relative;width:var(--frame-w);height:var(--frame-h);
  overflow:hidden;background:var(--void)}

/* The aurora `ActivationSurface` draws, unchanged, mirrored for RTL. */
.backdrop{position:absolute;inset:0;
  background:
    radial-gradient(44% 118% at 79% 54%, rgba(111,178,255,.14) 0%, rgba(111,178,255,0) 66%),
    radial-gradient(58% 78% at 96% 108%, rgba(110,75,216,.30) 0%, rgba(110,75,216,0) 62%),
    radial-gradient(54% 70% at 3% 20%, rgba(46,107,255,.26) 0%, rgba(46,107,255,0) 60%),
    linear-gradient(225deg, var(--deep) 0%, var(--violet10) 48%, var(--azure10) 100%);
}
html[dir="ltr"] .backdrop{
  background:
    radial-gradient(44% 118% at 21% 54%, rgba(111,178,255,.14) 0%, rgba(111,178,255,0) 66%),
    radial-gradient(58% 78% at 4% 108%, rgba(110,75,216,.30) 0%, rgba(110,75,216,0) 62%),
    radial-gradient(54% 70% at 97% 20%, rgba(46,107,255,.26) 0%, rgba(46,107,255,0) 60%),
    linear-gradient(135deg, var(--deep) 0%, var(--violet10) 48%, var(--azure10) 100%);
}
.mesh{position:absolute;inset:0;opacity:.45}

/* Type.kt */
.t-headline-m{font-size:22px;line-height:32px;font-weight:700}
.t-body-l    {font-size:15px;line-height:24px;font-weight:400}
.t-title-l   {font-size:17px;line-height:24px;font-weight:600}
.t-body-s    {font-size:12.5px;line-height:20px;font-weight:500}
.t-label-l   {font-size:14px;line-height:20px;font-weight:600}

/* Centred as one group, as `Alignment.CenterVertically` does.
   ------------------------------------------------------------------------
   The gap is no longer one number. Three children became four, and at
   `Spacing.xxl` throughout the composition came to 344 in the handset's 345 --
   a fit with nothing left, which is the state this screen has twice shipped
   from. `Spacing.xl` between the groups and `Spacing.lg` inside the pair of
   rows says the same thing the sizes say: the two rows are one choice with a
   primary half and a secondary half, not four unrelated things evenly spaced. */
.band{position:absolute;inset:var(--inset);display:flex;flex-direction:column;
  justify-content:flex-start;gap:0}
/* The title's row, which now carries the corner mark as well.
   ------------------------------------------------------------------------
   A row rather than a band of its own, and this is the whole reason the mark
   costs nothing: `t-headline-m` is a 32px line box, the mark is a 32px line box,
   so the head measures 32 either way. `.panel` is `flex:1 1 auto` and absorbs
   whatever the fixed parts leave -- an eyebrow above the title would have taken
   its height out of the container, which is the one thing this change is not
   allowed to do. Sharing the title's line takes it out of nothing.

   `align-items:baseline`, so the mark sits on the title's baseline rather than
   floating in the middle of a taller line. At 11px against 22 it reads as a
   corner mark and not as a second heading, which is the whole brief. */
.head{display:flex;flex-direction:row;align-items:baseline;gap:var(--mark-gap)}
.head h1{flex:1 1 auto;min-width:0}

/* Castivio, in the corner, in Intro's own ink.
   ------------------------------------------------------------------------
   `Intro.kt` draws `MARK = "CASTIVIO"` in `displayLarge` at `FontWeight.Bold`
   under a horizontal `#9B6BFF -> #4C9BFF`, tracked at `MARK_TRACKING / MARK_SIZE`
   = 26/104 = 0.25em. Everything here is that, at a size that belongs in a corner:
   same word, same case, same weight, same gradient, same tracking ratio. Only
   the size differs, and it differs by design -- the startup mark is 104px
   because it is the only thing on the screen, and this one is 11 because it is
   not. No logo beside it: Castivio's mark *is* the word.

   `direction:ltr` and `order` rather than a logical property, because the
   requirement is physical: the mark stays in the left corner in Arabic too. In
   RTL the row runs right to left, so the last child is the leftmost -- which is
   what `order:2` buys, and it is also why the title needs no clearance rule in
   either direction. The row does the clearing.

   `90deg` for the same reason: `Brush.horizontalGradient` is left-to-right in
   pixels whatever the layout direction, so the violet end is on the left on
   every screen Castivio draws, exactly as the startup does it. */
/* `line-height:1`, and it is load-bearing rather than tidy. A baseline-aligned
   row is as tall as its deepest descender below the shared baseline, and a 32px
   line box around an 11px glyph hangs about 12 below it against the title's 10 --
   which grew the head by 3, took 3 off `.panel`, and shortened every card by
   1.5. Measured, not guessed: the first render of this mark did exactly that.
   At `1` the mark's own descent is 2.6 and the title's 10 still decides. */
.brand{flex:0 0 auto;direction:ltr;white-space:nowrap;
  font-size:var(--mark-size);line-height:1;font-weight:700;
  letter-spacing:.25em;
  background:linear-gradient(90deg,var(--mark-a),var(--mark-b));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent;
  user-select:none}

/* The container: one surface holding the four choices and the way back.
   ------------------------------------------------------------------------
   Behind the cards rather than beside them, so it fills at `glassFill` where
   they fill at `glassFillStrong` -- 3.9% under 7.8%. That ordering is the whole
   trick: a container as bright as its contents flattens into one slab and the
   cards stop reading as pressable. Same `glassBorder`, `Radius.xl` against the
   cards' `Radius.lg` so the corners nest instead of tracing each other.

   `--panel-pad` all round, so no card ever touches the edge it sits in. */
.panel{flex:1 1 auto;margin-top:var(--group-gap);border-radius:var(--r-xl);background:var(--glass);
  border:1px solid var(--glass-border);box-shadow:0 10px 30px rgba(0,0,0,.24);
  padding:var(--panel-pad);
  display:flex;flex-direction:column;gap:var(--panel-gap)}

/* Below the container, not inside it, and centred on the frame rather than on
   what Back leaves over -- its margin from each edge is the same number by
   construction, in either direction. */
/* The remainder, with the sentence in the middle of it. Not a fixed gap: the space
   above the sentence and the space below it are half of whatever the container
   leaves, on every frame. */
/* At the bottom of the screen, just under the container -- the reference has it on
   the bottom edge, not floating in a leftover band. */
.legal{flex:0 0 auto;align-self:center;margin-top:var(--legal-gap);
  text-align:center;color:var(--silver);white-space:nowrap;text-decoration:none}
.legal .lead{text-decoration:underline;text-decoration-thickness:1px;
  text-underline-offset:3px;text-decoration-color:rgba(201,201,218,.55)}
.head .sub{color:var(--silver)}

/* `flex-start`, not the `stretch` a flex row defaults to.
   ------------------------------------------------------------------------
   The drawing has to model what Compose does, and a plain `Row` does not
   equalise its children -- each card is the height of its own content and the
   row is the height of the taller. Left on `stretch` this file would draw an
   equal pair that the application does not produce, which is the one way a
   mockup can be worse than no mockup.

   With the strings as they are the two are the same height anyway: both hold a
   title and one line, both come to 146. `?stress=1` is where they diverge. */
/* Two by two, one gap figure in both directions.
   ------------------------------------------------------------------------
   `1fr 1fr` gives the four the same width whatever is in them, and
   `grid-auto-rows: 1fr` gives the two rows the same height as each other. With
   these strings that is already true -- every card is a title over one line, so
   all four measure 80 without being told to. The `1fr` is what holds it when a
   translation wraps one description: the other three grow with it rather than
   one card standing 20dp taller than its neighbours.

   **What that will cost in Compose.** A plain `Row` does not equalise its
   children and two `Row`s do not equalise each other, so this is not free
   there: it needs `height(IntrinsicSize.Min)` on each row and a shared height
   between them, which is a second measurement pass over the subtree. That is a
   real decision for the implementation, not a detail -- the alternative is to
   accept that a wrapped description makes one card taller. */
.choices{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;
  grid-auto-rows:1fr;gap:var(--grid-gap)}
.card{min-width:0;border-radius:var(--r-lg);
  background:var(--glass-strong);border:1px solid var(--glass-border);
  box-shadow:0 10px 30px rgba(0,0,0,.32);
  padding:var(--card-pad-y) var(--card-pad-x);
  display:flex;flex-direction:column;justify-content:center;gap:4px}
.card .detail{color:var(--silver)}
/* focusRing = Azure60, focusGlow = Azure40 at 45%. Drawn on the first pane so
   the D-pad story is visible: left and right along a row, down between them. */
.card.focused{border-color:var(--azure60);
  box-shadow:0 0 0 1px var(--azure60), 0 14px 44px rgba(46,107,255,.45)}

/* The title line carries the icon.
   ------------------------------------------------------------------------
   Beside the words rather than above them, and at the cap height of the title
   it sits on, so it costs the card nothing: the row is `t-title-l`'s own 24px
   line box either way. An icon block above the title would have added 24 plus a
   gap to all four cards, which is 40 of the handset's 17dp of slack. */
.line{display:flex;align-items:center;gap:12px}
.line svg{flex:0 0 auto;width:20px;height:20px;stroke:currentColor;fill:none;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* No second style. Four cards, one card.
   ------------------------------------------------------------------------
   An earlier draft gave the lower pair `glassFill` and no description, so they
   came out 58dp against 98 -- hierarchy carried by size and fill. That is
   rejected: reading order is the only ranking here. Xtream leads because it is
   first in the grid and holds the focus on entry, not because it is bigger. */

/* The bottom bar: Back at the start, Terms at the end, one row.
   ------------------------------------------------------------------------
   A footer on its own line was the obvious reading of the request and it does
   not fit. The band has 2.5dp spare on a handset -- a `bodySmall` line plus the
   gap that would separate it is 36 -- so a third row would overflow by 33 and
   the frame does not scroll. It would clip.

   On Back's row it costs nothing at all: the row is already 48 tall for the
   button and full width, and the link is 20. Nothing above it moves, the cards
   keep their size and position to the dp, and Back keeps its own. It also reads
   as a footer rather than as a fifth choice, which a centred line under the
   grid would have risked. */
/* Back on its own side, the sentence centred on the frame.
   ------------------------------------------------------------------------
   A grid of three equal columns rather than `space-between`: the middle column
   is the width of the row, so the sentence is centred on the *frame* and its
   margin from each edge is the same number by construction. `space-between`
   would have centred it on whatever Back left over, which is a different thing
   that looks the same until Back changes width in another language. */
/* Back alone now, on the starting side, which the direction resolves. */
.foot{display:flex;flex-direction:row;align-items:center;gap:0}

/* ButtonWeight.Ghost: no fill and no border until it is focused. */
.back{display:inline-flex;align-items:center;gap:12px;
  height:var(--back-h);padding:0 24px;color:var(--mist)}
.back .ring{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  width:var(--ring);height:var(--ring);border-radius:50%;
  border:1px solid var(--glass-border)}
html[dir="rtl"] .back .ring svg{transform:scaleX(-1)}
svg.g{flex:0 0 auto;width:20px;height:20px;stroke:currentColor;fill:none;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* The rule beside Back. Decoration, and nothing else.
   ------------------------------------------------------------------------
   Back is a ghost button on a full-width row, so it leaves two thirds of the
   container's last band empty. The emptiness reads as a missing element rather
   than as margin, because it is bounded on all four sides -- the grid above it,
   the container's edge below and beside it. A hairline is the quietest thing
   that can occupy it without claiming to be a control.

   No text, no icon, no target: `aria-hidden` and no pointer, so a screen reader
   and a D-pad both pass straight over it. `flex:1 1 auto` gives it the leftover
   and nothing else -- Back keeps its own width and its own position to the
   pixel, and the row keeps its height, so nothing above or below moves.

   It fades away from Back rather than running at one strength into the corner:
   `--glass-border`, the same 23.9% every edge on this screen is drawn at, at
   full weight where it leaves the button and at nothing where it would have met
   the container. A hairline that stops dead needs a reason to stop there, and
   there is no reason -- so it does not stop, it ends. `--rule-gap` at both ends
   keeps it off Back and off the container's inner edge by the same figure. */
.rule{flex:1 1 0;min-width:0;height:1px}
.rule.a{background:linear-gradient(to right,rgba(255,255,255,0),var(--glass-border))}
.rule.b{background:linear-gradient(to right,var(--glass-border),rgba(255,255,255,0))}
html[dir="rtl"] .rule.a{
  background:linear-gradient(to left,rgba(255,255,255,0),var(--glass-border))}
html[dir="rtl"] .rule.b{
  background:linear-gradient(to left,var(--glass-border),rgba(255,255,255,0))}

/* Quiet, and unmistakably a link.
   ------------------------------------------------------------------------
   `bodySmall` in `onBackgroundVariant`, which is what every secondary line on
   this screen already uses, so it does not introduce a colour. The underline is
   what makes it a link rather than a caption -- offset off the baseline so the
   Arabic descenders clear it, and hairline so it stays quiet. No icon and no
   sentence beside it: the words are the whole control. */
/* One control, and only the two words that name it are underlined. The rest of
   the sentence is context; a partially-pressable line is unusable with a D-pad. */
.terms{color:var(--silver);text-decoration:none;white-space:nowrap}
.terms .lead{text-decoration:underline;text-decoration-thickness:1px;
  text-underline-offset:3px;text-decoration-color:rgba(201,201,218,.55)}

/* The stress render says so, on the render.
   ------------------------------------------------------------------------
   `?stress=1` doubles every string, and a doubled string is indistinguishable
   from a screen with a duplication bug -- which is exactly how it was read the
   first time this file was shown to anyone. A diagnostic that can be mistaken
   for the product is worse than no diagnostic: it costs a round trip and it
   spends trust. So it labels itself, in a colour nothing in Castivio uses. */
.stress-flag{display:none;position:absolute;z-index:11;top:0;inset-inline:0;
  height:26px;align-items:center;justify-content:center;direction:ltr;
  font-family:"Liberation Mono",monospace;font-size:11px;font-weight:700;
  letter-spacing:.6px;color:#08071A;background:#FFB020}
html[data-stress="1"] .stress-flag{display:flex}
html[data-stress="1"] #tv{outline:3px solid #FFB020;outline-offset:-3px}

.spec{display:none}
html[data-spec="1"] .spec{display:block}
.spec-safe{position:absolute;inset:var(--inset);z-index:8;pointer-events:none;
  border:1px dashed rgba(255,176,32,.55)}
.spec-note{position:absolute;z-index:9;left:6px;bottom:6px;direction:ltr;
  font-family:"Liberation Mono",monospace;font-size:9px;line-height:13px;
  color:#FFB020;background:rgba(8,7,26,.86);padding:3px 6px;border-radius:4px}
</style>
</head>
<body>

<section id="tv">
  <div class="backdrop"></div>
  <svg class="mesh" viewBox="0 0 960 540" preserveAspectRatio="none">
    <g fill="none" stroke="#9B6BFF" stroke-opacity=".07" stroke-width="1">
      <path d="M0,392 C160,352 320,432 480,392 C640,352 800,432 960,392"/>
      <path d="M0,428 C160,388 320,468 480,428 C640,388 800,468 960,428"/>
      <path d="M0,464 C160,424 320,504 480,464 C640,424 800,504 960,464"/>
      <path d="M0,500 C160,462 320,534 480,500 C640,462 800,534 960,500"/>
    </g>
  </svg>

  <div class="band">
    <!-- The title alone.
         ------------------------------------------------------------------
         There was a subtitle here -- "كلاهما يصل إلى النتيجة نفسها.", "both end
         up in the same place" -- and two cards became four, which made it
         false. It is deleted rather than reworded: with four named options
         carrying a description each, a sentence above them explaining that
         they are alternatives is telling the reader what the grid already
         shows.

         It also bought the layout 32dp, which is the difference between a
         screen with 2.5dp of slack and one with room to breathe. -->
    <div class="head">
      <!-- Last in the row, so it lands on the end side: the left corner in Arabic,
           the right corner in English. Unified with the media source screen. -->
      <h1 class="t-headline-m" data-s="title"></h1>
      <span class="brand" aria-hidden="true">CASTIVIO</span>
    </div>

    <!-- Source order, not visual order: a Row lays its children out start to
         end, so Xtream is on the right in Arabic and on the left in English
         without either being written down. -->
    <div class="panel" id="panel">
      <div class="choices" id="grid">
      <div class="card focused">
        <div class="line t-title-l">
          <!-- A server: two stacked units and a status light. Xtream is an
               address, a name and a password -- a machine you sign in to. -->
          <svg viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="7" rx="2"/>
            <rect x="3" y="13" width="18" height="7" rx="2"/>
            <path d="M7 7.5h.01M7 16.5h.01"/>
          </svg>
          <span data-s="xtream"></span>
        </div>
        <div class="detail t-body-s" data-s="xtreamDetail"></div>
      </div>
      <div class="card">
        <div class="line t-title-l">
          <!-- A link. The playlist is one long URL and nothing else. -->
          <svg viewBox="0 0 24 24">
            <path d="M10 13.5a4 4 0 0 0 5.7.4l2.6-2.6a4 4 0 0 0-5.7-5.7l-1.5 1.5"/>
            <path d="M14 10.5a4 4 0 0 0-5.7-.4l-2.6 2.6a4 4 0 0 0 5.7 5.7l1.5-1.5"/>
          </svg>
          <span data-s="m3u"></span>
        </div>
        <div class="detail t-body-s" data-s="m3uDetail"></div>
      </div>
      <div class="card">
        <div class="line t-title-l">
          <!-- A sheet with a folded corner and a play mark: the file idea from
               the reference, drawn in Castivio's stroke rather than borrowed as
               a solid glyph. A file the device already holds. -->
          <svg viewBox="0 0 24 24">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
            <path d="M14 3v5h5"/>
            <path d="M10.5 12.5v4l3.5-2z"/>
          </svg>
          <span data-s="local"></span>
        </div>
        <div class="detail t-body-s" data-s="localDetail"></div>
      </div>
      <div class="card">
        <div class="line t-title-l">
          <!-- A person and the entries beside them: the subscriptions saved on
               this box, which is all this card claims to be. -->
          <svg viewBox="0 0 24 24">
            <circle cx="8" cy="8.5" r="2.75"/>
            <path d="M3.5 18.5a4.5 4.5 0 0 1 9 0"/>
            <path d="M15.5 8.5H21M15.5 13H21M15.5 17.5H21"/>
          </svg>
          <span data-s="users"></span>
        </div>
        <div class="detail t-body-s" data-s="usersDetail"></div>
      </div>
      </div>

      <div class="foot">
        <span class="rule a" aria-hidden="true"></span>
        <span class="back t-label-l">
          <span class="ring" aria-hidden="true">
            <svg class="g" viewBox="0 0 24 24">
              <path d="M20 12H5"/><path d="M11.5 5.5L5 12l6.5 6.5"/>
            </svg>
          </span>
          <span data-s="back"></span>
        </span>
        <span class="rule b" aria-hidden="true"></span>
      </div>
    </div>

    <a class="legal t-body-s" href="#"><span class="lead" data-s="terms"></span><span data-s="termsNote"></span></a>
  </div>

  <div class="stress-flag">STRESS RENDER — EVERY STRING DOUBLED ON PURPOSE. NOT THE SCREEN.</div>

  <div class="spec">
    <div class="spec-safe"></div>
    <div class="spec-note" id="note"></div>
  </div>
</section>

<script>
var S = {
  ar: { dir:"rtl", title:"اختر طريقة الإضافة",
        xtream:"Xtream Codes", xtreamDetail:"عنوان سيرفر واسم مستخدم وكلمة مرور.",
        m3u:"قائمة M3U", m3uDetail:"رابط واحد طويل، يُرسَل عادةً بالبريد.",
        local:"تشغيل فيديو من الجهاز", localDetail:"تشغيل ملف فيديو محفوظ على الجهاز.",
        users:"قائمة المستخدمين", usersDetail:"أضف وبدّل بين اشتراكات Xtream وM3U.",
        back:"رجوع", terms:"شروط الخدمة",
        termsNote:" — باستخدام التطبيق، فإنك توافق على شروط الاستخدام." },
  en: { dir:"ltr", title:"What did your provider give you?",
        xtream:"Xtream Codes", xtreamDetail:"A server address, a username and a password.",
        m3u:"M3U playlist", m3uDetail:"A single long link, usually sent by e-mail.",
        local:"Play a video from this device",
        localDetail:"Play a video file stored on this device.",
        /* Short enough to hold one line in 341dp of card. The first draft ran
           to "Add and switch between Xtream and M3U subscriptions.", which
           wrapped -- and a wrap here is not a taller card, it is 4dp of
           overflow and a Back button crushed to 20dp. See the note on the
           band. */
        users:"Saved users", usersDetail:"Add or switch between Xtream and M3U.",
        back:"Back", terms:"Terms of Service",
        termsNote:" — By using this app, you agree to the Terms of Service." },
};

var q = new URLSearchParams(location.search);
var s = S[q.get("lang")] || S.ar;
/* The handset is the default because it is the frame that decides everything.
   `?frame=tv` draws the television, which has 44dp more room than this one. */
var f = q.get("frame");
if (f === "tv" || f === "short") document.documentElement.dataset.frame = f;
document.documentElement.dir = s.dir;
document.documentElement.lang = s.dir === "rtl" ? "ar" : "en";
if (q.get("spec")) document.documentElement.dataset.spec = "1";
/* Not a language, a load test: every string doubled, so the headroom the
   comment above claims is a number this file can be made to prove. */
if (q.get("stress")) {
  document.documentElement.dataset.stress = "1";
  Object.keys(s).forEach(function (k) {
    if (k !== "dir") s[k] = s[k] + " " + s[k];
  });
}
document.querySelectorAll("[data-s]").forEach(function (n) {
  n.textContent = s[n.getAttribute("data-s")];
});

/* The band's arithmetic, measured rather than asserted in a comment. If this
   ever reports an overflow, the screen has gone back to scrolling. */
window.addEventListener("load", function () {
  var band = document.querySelector(".band");
  var r = band.getBoundingClientRect();
  var head = document.querySelector(".head").getBoundingClientRect();
  var grid = document.getElementById("grid").getBoundingClientRect();
  var foot = document.querySelector(".foot").getBoundingClientRect();
  var panel = document.getElementById("panel").getBoundingClientRect();
  var back = document.querySelector(".back").getBoundingClientRect();
  var terms = document.querySelector(".legal").getBoundingClientRect();
  var frame = document.getElementById("tv").getBoundingClientRect();
  var brand = document.querySelector(".brand").getBoundingClientRect();
  var ruleA = document.querySelector(".rule.a").getBoundingClientRect();
  var ruleB = document.querySelector(".rule.b").getBoundingClientRect();
  var cards = [].map.call(document.querySelectorAll("#grid .card"), function (n) {
    var b = n.getBoundingClientRect();
    return { w: Math.round(b.width * 10) / 10, h: Math.round(b.height * 10) / 10,
             x: Math.round(b.left * 10) / 10, y: Math.round(b.top * 10) / 10 };
  });
  /* Four equal cards is the requirement, so it is measured rather than trusted
     to the grid: the widest minus the narrowest, and the tallest minus the
     shortest, both of which have to be zero. */
  var w = cards.map(function (c) { return c.w; });
  var h = cards.map(function (c) { return c.h; });
  window.__fit = {
    frame: frame.width + "x" + frame.height,
    head: head.height,
    gapTop: grid.top - head.bottom,
    grid: grid.height,
    gapBottom: foot.top - grid.bottom,
    back: back.height,
    foot: foot.height,
    /* The link costs the row nothing: it is 20 inside Back's 48. Reported so a
       future change to either is caught by the number rather than by eye. */
    terms: Math.round(terms.width * 10) / 10 + "x" + terms.height,
    ruleA: Math.round(ruleA.width * 10) / 10 + "x" + Math.round(ruleA.height * 10) / 10,
    ruleB: Math.round(ruleB.width * 10) / 10 + "x" + Math.round(ruleB.height * 10) / 10,
    ruleSpread: Math.round(Math.abs(ruleA.width - ruleB.width) * 10) / 10,
    backLeadIn: Math.round((back.left - panel.left -
      parseFloat(getComputedStyle(document.getElementById("panel")).borderLeftWidth) -
      parseFloat(getComputedStyle(document.getElementById("panel")).paddingLeft)) * 10) / 10,
    backTrailIn: Math.round((panel.right -
      parseFloat(getComputedStyle(document.getElementById("panel")).borderRightWidth) -
      parseFloat(getComputedStyle(document.getElementById("panel")).paddingRight) -
      back.right) * 10) / 10,
    termsInside: terms.left >= frame.left + parseFloat(getComputedStyle(band).paddingLeft || 0) - 0.5 &&
      terms.right <= frame.right && terms.bottom <= frame.bottom,
    termsAtEnd: document.documentElement.dir === "rtl"
      ? terms.left < back.left : terms.left > back.left,
    topSlack: head.top - r.top,
    bottomSlack: r.bottom - foot.bottom,
    /* The mark: its size, and the two claims made about where it is. It is in
       the left corner of the safe area *physically*, so the check is against
       the band's left edge in both directions rather than against its start. */
    brand: Math.round(brand.width * 10) / 10 + "x" + Math.round(brand.height * 10) / 10,
    brandAtLeft: Math.round((brand.left - r.left) * 10) / 10,
    brandInBand: brand.left >= r.left - 0.5 && brand.top >= r.top - 0.5,
    /* It shares the title's line box rather than sitting above it, which is why
       the head is still 32 and the container is still the height it was. */
    brandSharesTitleLine: Math.round(head.height * 10) / 10,
    /* The rule: how long, how far from Back, how far from the container's inner
       edge. Both gaps are `--rule-gap` by construction; measured so that a
       change to Back's padding shows up here rather than on a device. */
    ruleTouchesBack: Math.round(Math.max(
      Math.abs(back.left - Math.min(ruleA.right, ruleB.right)),
      Math.abs(Math.max(ruleA.left, ruleB.left) - back.right)) * 10) / 10,
    cards: cards,
    cardW: Math.max.apply(null, w), widthSpread: Math.max.apply(null, w) - Math.min.apply(null, w),
    cardH: Math.max.apply(null, h), heightSpread: Math.max.apply(null, h) - Math.min.apply(null, h),
    gapX: Math.round((cards[1].x > cards[0].x
      ? cards[1].x - (cards[0].x + cards[0].w)
      : cards[0].x - (cards[1].x + cards[1].w)) * 10) / 10,
    gapY: Math.round((cards[2].y - (cards[0].y + cards[0].h)) * 10) / 10,
    overflow: band.scrollHeight - band.clientHeight,
  };
  document.getElementById("note").textContent =
    "band " + window.__fit.frame + " | margin " + window.__fit.topSlack +
    " | head " + window.__fit.head + " | gap " + window.__fit.gapTop +
    " | grid " + window.__fit.grid + " | gap " + window.__fit.gapBottom +
    " | foot " + window.__fit.foot + " (back " + window.__fit.back +
    ", terms " + window.__fit.terms + ") | margin " + window.__fit.bottomSlack +
    " || card " + window.__fit.cardW + "x" + window.__fit.cardH +
    " | spread " + window.__fit.widthSpread + "/" + window.__fit.heightSpread +
    " | gaps " + window.__fit.gapX + "/" + window.__fit.gapY +
    " || mark " + window.__fit.brand + " @" + window.__fit.brandAtLeft +
    " | rules " + window.__fit.ruleA + " / " + window.__fit.ruleB +
    " spread " + window.__fit.ruleSpread +
    " | OVERFLOW " + window.__fit.overflow;
});
document.fonts.ready.then(function () { window.__fontsReady = true; });
</script>
</body>
</html>
