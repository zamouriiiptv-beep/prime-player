name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          attempt=0
          until ./gradlew assembleDebug --no-daemon --stacktrace; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "Build failed after $attempt attempts."
              exit 1
            fi
            echo "Attempt $attempt failed (possibly a transient network error). Retrying in $((attempt * 20))s..."
            sleep $((attempt * 20))
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: castivio-tv-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
