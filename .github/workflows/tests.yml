name: Unit tests

# Runs on every commit. The pure-Kotlin modules hold the logic that decides
# whether the app survives a 400,000 item library — classification, import
# batching, parsing — so they are tested without an Android SDK and in seconds.
#
# Android-module verification happens in "Build APK"; these tasks are listed
# explicitly because `./gradlew test` would drag in the Android plugin and its
# SDK download for no benefit here.
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  # Grep over the tree, no Gradle, no SDK -- so the rules that can be mechanised
  # are answered in seconds rather than after a seven-minute build.
  invariants:
    name: Design invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check design invariants
        run: |
          chmod +x ./scripts/check-invariants.sh
          ./scripts/check-invariants.sh

  jvm:
    name: JVM unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: |
          ./gradlew --no-daemon --console=plain \
            :core:common:test \
            :core:navigation:test \
            :domain:test \
            :data:parsing:test \
            :playback:engine-api:test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: "**/build/reports/tests/test/**"
          if-no-files-found: warn
