<!DOCTYPE html>
<!-- The approved block, with NOW moved to the right end of its line. Phone geometry,
     833x385dp, one px per dp; the page is rendered at 3x purely so it can be read. -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>الدليل — النسخة المعتمدة</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0D0B22;color:#fff;font-family:"DejaVu Sans",system-ui,sans-serif;
     padding:18px;direction:rtl;display:inline-block}
.cap{font-size:11px;color:#8FE8D2;margin-bottom:10px;line-height:1.8;max-width:270px}
.cap b{color:#fff}
.frame{background:#20223A;border:1px solid rgba(172,180,214,.14);border-radius:6px;padding:8px}
.well{display:flex;flex-direction:column;align-items:center}
.pic{background:linear-gradient(150deg,#3E3466,#241F3C);border:1px solid rgba(255,255,255,.20);
     position:relative;flex:none;overflow:hidden}
.live{position:absolute;bottom:5px;left:5px;background:#2FBF9F;color:#062B23;font-weight:700;
      white-space:nowrap;border-radius:999px}
.facts{width:100%;border:1px solid rgba(172,180,214,.10);display:flex;flex-direction:column;
       flex:1;justify-content:space-between;color:#D6D3E8;overflow:hidden}
.idr{display:flex;align-items:center}
.logo{background:rgba(255,255,255,.04);border:1px solid rgba(172,180,214,.10);flex:none;
      display:flex;align-items:center;justify-content:center;color:#6B6B85;border-radius:3px;font-size:9px}
.wname{flex:1;direction:ltr;text-align:left;color:#fff;font-weight:600;white-space:nowrap;
       overflow:hidden;text-overflow:ellipsis}
.qb{background:rgba(155,107,255,.22);color:#B694FF;flex:none;font-weight:700;border-radius:999px}
.rule{height:1px;background:rgba(172,180,214,.28);flex:none}
.grp{display:flex;flex-direction:column}
.ln{display:flex;align-items:baseline;overflow:hidden}
.ln2{display:flex;gap:7px;align-items:baseline;overflow:hidden}
.ttl{flex:1;direction:ltr;unicode-bidi:plaintext;text-align:start;color:#fff;white-space:nowrap;
     overflow:hidden;text-overflow:ellipsis}
.ttl.big{font-weight:600}
.now{color:#2FBF9F;font-weight:700;flex:none}
.num{direction:ltr;color:#9FA0BC;font-variant-numeric:tabular-nums;flex:none;white-space:nowrap}
.meta{display:flex;align-items:center;gap:7px}
.mtxt{flex:none;display:flex;gap:5px;align-items:baseline;color:#8C8CA8}
.dot{color:#5B5B78}
.bar{height:2px;background:rgba(255,255,255,.13);flex:1}
.bar>i{display:block;height:100%;width:22%;background:#2FBF9F}
.strip{width:100%;display:flex;flex:none}
.btn{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(172,180,214,.10);
     display:flex;align-items:center;justify-content:center;color:#D6D3E8;white-space:nowrap}
</style></head><body>
<div class="cap"><b>833×385dp — بحجمه الحقيقي</b><br>
«الآن» في أقصى اليمين · الشعار واسم القناة كما كانا · لا انعكاس</div>
<div class="frame"><div class="well" style="width:266.28px;height:331.00px;
  gap:4.00px">
  <div class="pic" style="width:260.31px;height:146.43px;
       border-radius:10.00px">
    <span class="live" style="font-size:11.00px;
          padding:2.00px 4.00px">مباشر&nbsp;&nbsp;2</span></div>
  <div class="facts" dir="ltr" style="border-radius:10.00px;
   padding:2.00px 5.00px;font-size:12.00px">
 <div class="idr" style="gap:5.00px">
   <span class="logo" style="width:26.00px;height:19.50px">&#8416;</span>
   <span class="wname" style="font-size:13.00px">FR| TF1</span>
   <span class="qb" style="font-size:10.08px;padding:1.00px 4.00px">UHD</span>
 </div>
 <div class="rule"></div>
 <div class="grp" style="padding-top:2.00px;gap:2.00px">
   <div class="ln"><span class="ttl big">EuroMillions</span></div>
   <div class="meta"><span class="bar"><i></i></span>
     <span class="mtxt"><span class="num">00:00 – 00:05</span>
     <span class="dot">·</span><span class="now">الآن</span></span></div></div>
 <div class="rule"></div>
 <div class="grp" style="padding-top:2.00px;gap:2.00px">
   <div class="ln2"><span class="num" style="width:50.40px;text-align:left">00:05</span>
     <span class="ttl">Programmes de nuit - TF1</span></div>
   <div class="ln2"><span class="num" style="width:50.40px;text-align:left">03:50</span>
     <span class="ttl">Tfou</span></div></div>
</div>
  <div class="strip" dir="ltr" style="height:48.00px;gap:4.00px">
  <div class="btn" style="border-radius:6.00px;padding:0 5.00px;font-size:11.00px">الدليل</div><div class="btn" style="border-radius:6.00px;padding:0 5.00px;font-size:11.00px">المفضلة</div><div class="btn" style="border-radius:6.00px;padding:0 5.00px;font-size:11.00px">قفل</div><div class="btn" style="border-radius:6.00px;padding:0 5.00px;font-size:11.00px">إخفاء</div>
  </div></div></div>
</body></html>
