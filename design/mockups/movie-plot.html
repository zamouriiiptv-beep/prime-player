<!doctype html>
<!--
  A film's plot, whole: how a plot the page has to cut is read to the end. Drawn before code.

  The film page does not scroll, so the plot takes the lines the height has left and is cut with an
  ellipsis where it runs on -- three lines on a handset. A plot of five lines lost its end, and nothing
  on the page said there was more.

  Two things, and only when the plot is really cut (a plot that fits shows neither):

    1. "Show all" at the end of the Plot heading's row. The heading's row has nothing at its end, so the
       link costs the page no height and the plot keeps its lines. It is a text link, not a pill: a pill
       would make the row taller than the heading and take half a line from the plot. A remote reaches it
       with Down from the buttons and Up from the cast line; a thumb can press it, or the plot itself,
       which is the large target.
    2. A small dialog that holds the plot. The app's own modal (CastivioDialog: scrim, raised panel,
       hairline), at its own width -- not a page. The film's name is its title, the plot is its body, and
       one button, Close, takes focus, so the remote's centre key that opened it also closes it. Back and
       a press on the scrim close it too. The body shows up to five lines on a handset and seven on a
       television; a longer plot scrolls inside that, with a fade at the foot and a thin bar at the end
       that says there is more. The dialog is as tall as its text and never taller than 72% of the screen.

  Geometry is Dialog.kt's: panel 58% of the width between 400 and 560, padding 3.3% between 20 and 36,
  corner 5.6% of the height between 20 and 32, title 3.3% of the height between 15 and 20, buttons the
  control floor (48dp on a handset, 56 on a television). Fade in 120ms, none when motion is off.
  Colours are Color.kt tokens. The film's data is the provider's own; the long plots are examples.

    ?frame=<name>      one frame at its device size
    ?frame=sheet       every frame stacked with its caption, for review
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Film plot</title>
<style>
:root{
  --ground:#111327; --panel:#20223A; --edge:rgba(172,180,214,.10); --edgeSoft:rgba(255,255,255,.08);
  --glass:rgba(255,255,255,.06); --glassBorder:rgba(255,255,255,.14); --violet:#9B6BFF; --violetEdge:#B694FF;
  --azure:#4C9BFF; --azureDeep:#2F6FE0; --ring:#6FB2FF; --gold:#F5C518; --ink:#D6D3E8; --strong:#FFFFFF;
  --muted:#8C8CA8; --scrim:rgba(5,4,14,.72); --elevated:#20223A;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05040E;color:var(--strong);font-family:"Noto Sans Arabic","DejaVu Sans",sans-serif}
body.sheet{padding:20px;width:max-content}
svg{display:block;flex:none}
.cap{font:13px/1.45 "DejaVu Sans",sans-serif;color:#9a9ab8;margin:18px 0 8px;max-width:900px}

.screen{position:relative;overflow:hidden;direction:ltr;
  background:radial-gradient(120% 90% at 85% 0%,#1B1F3F 0%,rgba(27,31,63,0) 60%),linear-gradient(160deg,#13152D,var(--ground))}

/* ---------- the film page, as the app draws it (always left to right) ---------- */
.page{position:absolute;inset:0;display:flex;gap:28px;padding:17px 40px}
.poster{flex:none;border-radius:10px;border:1px solid var(--edgeSoft);overflow:hidden;
  background:linear-gradient(170deg,#7a2f2f 0%,#c0713a 38%,#2a2f6b 70%,#10112a 100%);position:relative}
.poster b{position:absolute;left:0;right:0;bottom:9%;text-align:center;font:italic 900 30px/1 "DejaVu Sans",sans-serif;color:#fff;
  letter-spacing:-1px;text-shadow:0 2px 0 #b3232b}
.info{flex:1;min-width:0;display:flex;flex-direction:column;font-family:"DejaVu Sans",Roboto,sans-serif}
.trow{display:flex;align-items:center;gap:8px}
.name{flex:1;font-weight:700;font-size:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{flex:none;width:40px;height:40px;border-radius:10px;background:var(--glass);border:1px solid var(--glassBorder);
  display:flex;align-items:center;justify-content:center}
.back svg{width:20px;height:20px;fill:var(--azure)}
.facts{margin-top:8px;height:32px;border-radius:16px;background:var(--glass);border:1px solid var(--edgeSoft);
  display:flex;align-items:center;padding:0 14px;font-size:13px;white-space:nowrap;overflow:hidden}
.facts i{flex:none;width:1px;height:16px;background:var(--glassBorder);margin:0 10px}
.facts svg{width:16px;height:16px;fill:var(--ink);margin-right:6px}
.facts span{display:flex;align-items:center;flex:none}
.facts span:last-child{flex:0 1 auto;min-width:0}
.facts em{font-style:normal;min-width:0;overflow:hidden;text-overflow:ellipsis}
.btns{margin-top:12px;display:flex;gap:10px}
.btn{height:50px;border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 26px;font:600 15px "Noto Sans Arabic","DejaVu Sans";}
.btn svg{width:20px;height:20px}
.btn.p{background:linear-gradient(180deg,#4C9BFF,#2F6FE0);color:#fff} .btn.p svg{fill:#fff}
.btn.s{background:var(--glass);border:1px solid var(--glassBorder);color:var(--ink)} .btn.s svg{fill:var(--ink)}
.rrow{margin-top:12px;display:flex;gap:10px;align-items:center}
.imdb{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;border:1.5px solid var(--gold);
  background:rgba(245,197,24,.12);font-weight:700;font-size:14px}
.imdb u{text-decoration:none;background:var(--gold);color:#0B0B14;border-radius:4px;padding:1px 5px;font-weight:900}
.imdb svg{width:15px;height:15px;fill:var(--gold)}
.added{height:30px;display:flex;align-items:center;padding:0 12px;border-radius:15px;background:var(--glass);border:1px solid var(--edgeSoft);
  font-size:13px;color:var(--ink)}
.hrow{margin-top:10px;display:flex;align-items:center;justify-content:space-between;height:18px}
.hrow h3{font-size:13px;font-weight:700}
.more{display:flex;align-items:center;gap:2px;font:700 12.5px "Noto Sans Arabic","DejaVu Sans";color:var(--azure);
  border-radius:6px;padding:0 4px 0 6px;height:18px}
.more svg{width:16px;height:16px;fill:var(--azure)}
.more.ring{outline:2px solid var(--ring);outline-offset:2px;background:rgba(76,155,255,.14)}
.plot{margin-top:8px;font-size:13px;line-height:18.3px;color:var(--ink);display:-webkit-box;-webkit-box-orient:vertical;
  -webkit-line-clamp:3;overflow:hidden}
.cred{margin-top:9px;font-size:13px;line-height:18px;color:var(--ink);display:flex;gap:8px;white-space:nowrap}
.cred span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.cred b{color:#fff} .cred svg{width:16px;height:16px;fill:#fff;margin-top:1px}

.dim{position:absolute;inset:0;background:var(--scrim)}

/* ---------- the dialog ---------- */
.stagebox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.panel{position:relative;background:var(--elevated);border:1px solid var(--edgeSoft);display:flex;flex-direction:column;overflow:hidden}
.ttl{font-weight:700;color:var(--strong);line-height:1.44;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;
  font-family:"DejaVu Sans",Roboto,sans-serif}
.txt{position:relative;overflow:hidden;color:var(--ink);font-family:"DejaVu Sans",Roboto,sans-serif}
.txt p{unicode-bidi:plaintext;text-align:start}
.txt.long{-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 26px),transparent)}
.bar{position:absolute;inset-inline-end:0;width:3px;border-radius:2px;background:rgba(255,255,255,.30)}
.close{align-self:flex-end;background:var(--glass);border:1px solid var(--glassBorder);border-radius:12px;color:var(--strong);
  font-weight:600;display:flex;align-items:center;padding:0 26px}
.close.ring{border-color:var(--ring);box-shadow:0 0 0 2px rgba(111,178,255,.45);background:rgba(76,155,255,.20)}

/* ---------- the chip states ---------- */
.states{padding:18px 22px;display:flex;flex-direction:column;gap:14px;font-family:"DejaVu Sans",Roboto,sans-serif}
.states .line{display:flex;align-items:center;gap:18px}
.states .lab{width:260px;font-size:12px;color:#9a9ab8}
.states .hrow{margin:0;width:491px}
</style>
</head>
<body>
<script>
const I={
  back:'<svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  heart:'<svg viewBox="0 0 24 24"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg>',
  star:'<svg viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>',
  chev:'<svg viewBox="0 0 24 24"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>',
  chevL:'<svg viewBox="0 0 24 24"><path d="M14 6l1.41 1.41L10.83 12l4.58 4.59L14 18l-6-6z"/></svg>',
  person:'<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14v11z"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>',
  cat:'<svg viewBox="0 0 24 24"><path d="M12 2 6.5 11h11zM17.5 13a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zM3 13.5h8v8H3z"/></svg>',
  mask:'<svg viewBox="0 0 24 24"><path d="M2 5c3-1 6-1 9 0v6a4.5 4.5 0 0 1-9 0zm11 1c3-1 6-1 9 0v6a4.5 4.5 0 0 1-9 0z"/></svg>'
};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* The provider's own words (the screenshot's film) and two longer plots written for this drawing. */
const FILM='EN - They Live (1988)';
const SHORT='A lone drifter stumbles upon a unique pair of sunglasses that reveal aliens are systematically gaining control of the Earth by masquerading as humans and lulling the public into submission.';
const MID='A lone drifter stumbles upon a unique pair of sunglasses that reveal aliens are systematically gaining control of the Earth by masquerading as humans and lulling the public into submission. Drifting from one construction site to the next in a city that has stopped counting its unemployed, he finds that the signs, the screens and the faces of the powerful all say the same two words, and that the few people who can see them are being hunted. With nowhere to hide and nobody left to trust, he must decide whether to throw the glasses away or hand them to a stranger.';
const MID2=SHORT+' Nowhere to hide and nobody left to trust, he must decide whether to throw the glasses away or hand them to a stranger.';
const LONG=MID+' A late alliance with a night-shift welder and a pirate television engineer takes the three of them to a warehouse where the broadcast that keeps the city asleep is made, and where the price of switching it off turns out to be higher than any of them has agreed to pay. What they see when the signal finally drops is not the end of the story but the first honest picture of the city, and it leaves each of them with a choice about what to do with it.';

const TEXT={
  ar:{more:'عرض الكل',close:'إغلاق',play:'تشغيل الفيلم',fav:'إضافة إلى المفضلة',plot:'Plot'},
  en:{more:'Show all',close:'Close',play:'Play',fav:'Add to favourites',plot:'Plot'}
};

function moreLink(lang,ring){return `<div class="more${ring?' ring':''}">${TEXT[lang].more}${lang==='ar'?I.chevL:I.chev}</div>`;}

function page(w,h,lang,opts){
  const ph=h-34, pw=Math.round(ph*2/3);
  const cut=opts.cut;
  return `<div class="page" style="padding:17px ${w>900?48:40}px;gap:${w>900?32:28}px">
    <div class="poster" style="width:${pw}px;height:${ph}px"><b>THEY LIVE</b></div>
    <div class="info" style="${w>900?'zoom:1.12':''}">
      <div class="trow"><div class="name">${FILM}</div><div class="back">${I.back}</div></div>
      <div class="facts" style="margin-top:8px"><span>${I.cat}TOP IMDB/OSCAR MOVIES</span><i></i><span>${I.cal}1988</span><i></i><span>${I.clock}1h 34m</span><i></i><span>${I.mask}<em>Science Fiction | Action | Thriller</em></span></div>
      <div class="btns"><div class="btn p">${I.play}${TEXT[lang].play}</div><div class="btn s">${I.heart}${TEXT[lang].fav}</div></div>
      <div class="rrow"><div class="imdb"><u>IMDb</u>7.3${I.star}</div><div class="added">Added 15/02/2026</div></div>
      <div class="hrow"><h3>${TEXT[lang].plot}</h3>${cut?moreLink(lang,opts.chipRing):''}</div>
      <div class="plot" style="-webkit-line-clamp:${opts.lines||3}">${opts.plot}</div>
      <div class="cred">${I.person}<span><b>Director:</b> John Carpenter</span></div>
      <div class="cred">${I.person}<span><b>Cast:</b> Roddy Piper, Keith David, Meg Foster, George Buck Flower, Peter Jason, Raymond…</span></div>
    </div></div>`;
}

/* Dialog.kt's shares, and this dialog's own: its text is as tall as it is, up to five lines (seven on a television). */
function dialog(w,h,tv,lang,text,opts){
  const pw=Math.min(clamp(w*746.7/1280,400,560),w), pad=(h<320)?12:clamp(w*42.7/1280,20,36);
  const rad=clamp(h*40/720,20,32), ttl=clamp(h*24/720,15,20), body=14*(tv?1.15:1), lh=body*1.45;
  const key=tv?56:48, maxLines=tv?7:5;
  // lines the text would need at the panel's text width (about 7.2dp a character at 14sp in this face)
  const chars=Math.floor((pw-2*pad)/(body*0.53)), need=Math.ceil(text.length/chars*1.04);
  const shown=Math.min(need,maxLines), long=need>maxLines;
  const th=Math.round(shown*lh);
  const bar=long?`<div class="bar" style="top:${Math.round(th*opts.scroll)}px;height:${Math.round(th*maxLines/need)}px"></div>`:'';
  const inner=long?`<div style="transform:translateY(-${Math.round((need*lh-th)*opts.scroll)}px)"><p dir="auto" style="font-size:${body}px;line-height:${lh}px">${text}</p></div>`
                  :`<p dir="auto" style="font-size:${body}px;line-height:${lh}px">${text}</p>`;
  return `<div class="panel" style="width:${pw}px;border-radius:${rad}px;padding:${pad}px;gap:14px;max-height:${Math.round(h*.72)}px" dir="${lang==='ar'?'rtl':'ltr'}">
    <div class="ttl" style="font-size:${ttl*(tv?1.1:1)}px">${FILM}</div>
    <div class="txt${long?' long':''}" style="height:${th}px">${inner}${bar}</div>
    <div class="close ring" style="height:${key}px;font-size:${body}px">${TEXT[lang].close}</div></div>`;
}

const FR={
  'page-phone':[833,385,false,()=>page(833,385,'ar',{cut:true,plot:MID2,lines:3})],
  'dialog-phone':[833,385,false,()=>page(833,385,'ar',{cut:true,plot:MID2,lines:3})+'<div class="dim"></div><div class="stagebox">'+dialog(833,385,false,'ar',MID2,{scroll:0})+'</div>'],
  'dialog-long-phone':[833,385,false,()=>page(833,385,'ar',{cut:true,plot:LONG,lines:3})+'<div class="dim"></div><div class="stagebox">'+dialog(833,385,false,'ar',LONG,{scroll:.38})+'</div>'],
  'dialog-tv':[960,540,true,()=>page(960,540,'ar',{cut:true,plot:LONG,lines:4})+'<div class="dim"></div><div class="stagebox">'+dialog(960,540,true,'ar',LONG,{scroll:0})+'</div>'],
  'dialog-en':[833,385,false,()=>page(833,385,'en',{cut:true,plot:MID2,lines:3})+'<div class="dim"></div><div class="stagebox">'+dialog(833,385,false,'en',MID2,{scroll:0})+'</div>'],
  'states':[833,215,false,()=>`<div class="states">
    <div class="line"><div class="lab">A plot that fits: nothing added</div><div class="hrow"><h3>Plot</h3></div></div>
    <div class="line"><div class="lab">A plot that is cut: the link, at rest</div><div class="hrow"><h3>Plot</h3>${moreLink('ar',false)}</div></div>
    <div class="line"><div class="lab">Reached with the remote (Down from the buttons)</div><div class="hrow"><h3>Plot</h3>${moreLink('ar',true)}</div></div>
    <div class="line"><div class="lab">English interface</div><div class="hrow"><h3>Plot</h3>${moreLink('en',false)}</div></div></div>`]
};
const CAP={
  'page-phone':'1. The film page when the plot is cut: "Show all" at the end of the Plot heading\'s row. The row is as tall as before, so the plot keeps its three lines. 833x385.',
  'dialog-phone':'2. Pressed: the plot in a small dialog (a plot that fits the five lines). The film\'s name is its title, up to five lines of the plot, one button, Close, with focus. The panel is 486dp wide and 257dp tall, two thirds of the screen.',
  'dialog-long-phone':'3. A plot longer than five lines scrolls inside the same panel: fade at the foot, a thin bar at the end for how much is left. The panel does not grow.',
  'dialog-tv':'4. Television 960x540: the same dialog at the television\'s step -- 560dp wide, seven lines, 56dp button.',
  'dialog-en':'5. English interface: the panel mirrors (Close at the right), the plot is left to right as the provider wrote it.',
  'states':'6. The link\'s states, on the Plot row (491dp, the info column at 833dp).'
};
const q=new URLSearchParams(location.search), f=q.get('frame')||'sheet';
function draw(name){
  const [w,h,tv,html]=FR[name];
  return `<div class="screen" style="width:${w}px;height:${h}px">${html()}</div>`;
}
if(f==='sheet'){document.body.className='sheet';document.body.innerHTML=Object.keys(FR).map(n=>`<div class="cap">${CAP[n]}</div>${draw(n)}`).join('');}
else document.body.innerHTML=draw(f);
</script>
</body>
</html>
