<!doctype html>
<!--
  The channel list inside the full-screen player, as a split and not an overlay. Approved by the owner and built
  (LOCAL_CHANGES §104); this file is the record of what was approved and of what the build changed on a television.

  What changes from `player-channels.html`: the list no longer lies over the picture. It takes 35% of a handset's width
  at the end edge, and the picture -- all of it, in its own proportions, never stretched -- is given the other 65%. The
  viewer asked for the list a little narrower (32 to 35%) and the picture 65 to 68%; the two figures are one decision,
  because what the list gives up the picture is given.

  Why 35% and not 32% on a handset: a row is a number, a logo, a name and the green disc of the channel that plays. At
  35% of an 851dp handset (298dp) the longest name the playlists in use carry, `FR| CANAL+ CINEMA 4K`, still fits in the
  name's 152dp; at 32% (272dp) it would be cut. The floor the overlay kept (340dp) is lowered to 298dp for the same
  reason it was set -- a number, a logo and a name -- and no more. On a television 35% of 960dp is 336dp, under the
  floor a row there needs (340dp), and the names are cut; the owner chose 40% for a television instead: 384dp, between
  340 and 400dp, and the picture the other 60% (576dp, a 16:9 picture of 576x324dp).

  What the split gives that the overlay did not: nothing of the picture is covered, so the channel's own logo in the
  corner of its picture stays visible; the bars of the picture (the heart, the volume, the gear, and the "next" button)
  are no longer under a panel that ghosts them -- on the overlay the "next" button was cut by the panel's edge; and the
  controls the viewer can reach are the controls he can see.

  What it costs: while the list is open the picture is smaller -- on this handset it goes from 699x393dp to 553x311dp --
  and is letterboxed top and bottom, because 65% of a 20:9 screen is a wider frame than 16:9 needs height for.

  Where the bars live: in the picture's area, full height, and not inside the letterboxed picture. A 311dp-high picture
  could not hold a 48dp back button, the title and its chips above, and the bar, the transport and the pill below, and
  leave a picture to look at; in the area the bars keep the clear middle they have today (128dp) and use the black above
  and below the picture as well. The controls keep their sizes, which come from the window, as everywhere in the player.

  Side: the end edge, as every other panel of the player (settings, tracks), and as the overlay was. The player is left
  to right whatever the language, so the list is at the right, the back button at the left, and the two are as far apart
  as the screen allows.

  Frames: `phone-now` is the overlay as it was, for comparison; `phone-split` and `tv-split` are what was built.

  What the build changes from the drawing, on a television: the head of the top bar also carries the stream-quality mark
  (26dp, not drawn here), so with the list open the title has about 78dp and only the LIVE chip fits under it -- a long
  name is cut with an ellipsis; and the transport's end group (fill, lock) needs more than half of the room the two ends
  share, so the play control sits about 35dp to the start side of the centre line, and where the pill that takes the
  viewer back to the live edge is there too the gaps close to make room (`TransportPlan`). Neither is drawn below.

    ?frame=<name>      one frame at its device size
    ?frame=sheet       every frame stacked with its caption and its ruler, for review

  Colours are Color.kt tokens; names, logos and figures are examples.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Player channel list, split</title>
<style>

:root{

.r .no{flex:none;border-radius:8px;background:var(--glass);border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;color:var(--strong);font-weight:600}
.r .lg{flex:none;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:-.2px;overflow:hidden}

</style>

<body>
<script>
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const I=(d,s,extra='')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const ICON={
  back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
  heart:'<path d="M12 21s-7-4.6-9.3-9.2C1.2 8.6 3 5 6.4 5c2 0 3.4 1.1 4.2 2.4h2.8C14.2 6.1 15.600 5 17.600 5 21 5 22.800 8.600 21.300 11.800 19 16.400 12 21 12 21z"/>',
  vol:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.500 8.500a5 5 0 0 1 0 7M19 6a8.500 8.500 0 0 1 0 12"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.400 15a1.700 1.700 0 0 0 .3 1.800l.1.1a2 2 0 1 1-2.800 2.800l-.1-.1a1.700 1.700 0 0 0-1.800-.3 1.700 1.700 0 0 0-1 1.500V21a2 2 0 1 1-4 0v-.1a1.700 1.700 0 0 0-1.100-1.500 1.700 1.700 0 0 0-1.800.3l-.1.1a2 2 0 1 1-2.800-2.800l.1-.1a1.700 1.700 0 0 0 .3-1.800 1.700 1.700 0 0 0-1.500-1H3a2 2 0 1 1 0-4h.1a1.700 1.700 0 0 0 1.500-1.100 1.700 1.700 0 0 0-.3-1.800l-.1-.1a2 2 0 1 1 2.800-2.800l.1.1a1.700 1.700 0 0 0 1.800.3H9a1.700 1.700 0 0 0 1-1.500V3a2 2 0 1 1 4 0v.1a1.700 1.700 0 0 0 1 1.500 1.700 1.700 0 0 0 1.800-.3l.1-.1a2 2 0 1 1 2.800 2.800l-.1.1a1.700 1.700 0 0 0-.3 1.800V9a1.700 1.700 0 0 0 1.500 1H21a2 2 0 1 1 0 4h-.1a1.700 1.700 0 0 0-1.500 1z"/>',
  dots:'<circle cx="12" cy="5" r="1.600" fill="#fff"/><circle cx="12" cy="12" r="1.600" fill="#fff"/><circle cx="12" cy="19" r="1.600" fill="#fff"/>',
  list:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/>',
  aspect:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  prev:'<path d="M6 5v14" /><path d="M19 5L9 12l10 7z" fill="#fff"/>',
  next:'<path d="M18 5v14"/><path d="M5 5l10 7-10 7z" fill="#fff"/>',
  pause:'<path d="M9 5v14M15 5v14" stroke-width="3.200"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  tri:'<path d="M8 5l11 7-11 7z" fill="#04130e" stroke="none"/>'
};
const T={title:'قائمة التشغيل',count:n=>`${n} قناة`,playlist:'قائمة التشغيل',live:'مباشر'};
const ROWS=[
  [18,'FR| RTL 9 4K','rtl9',1],
  [19,'FR| CANAL+ 4K','canal',0],
  [20,'FR| CANAL+ CINEMA 4K','canal',0],
  [21,'FR| CANAL+ KIDS 4K','canal',0],
  [22,'FR| CANAL+ SPORT 4K','canal',0],
  [23,'FR| CANAL+ PL 4K','canal',0],
  [24,'FR| CANAL+ DOCS 4K','canal',0]
];
function metrics(W,H,tv){
  // the player's own sizes: the target for the device, the play control, the circles round it, the gap between the
  // groups of the transport (barGapLarge) and between controls inside one (barGap), and the stream-quality mark
  return tv
    ? {t:56,inset:Math.round(W*0.048),ring:80,step:58,gap:24,bg:16,qual:26,row:56,plateW:46,plateH:28,lgW:44,lgH:22,head:64,pad:16,fs:16,nm:16,ttl:22,disc:28}
    : {t:48,inset:40,ring:64,step:48,gap:21,bg:14,qual:20,row:48,plateW:30,plateH:24,lgW:34,lgH:17,head:56,pad:12,fs:15,nm:13,ttl:16,disc:24};
}
function rowHtml(r,m,focusIdx,i){
  const [n,name,logo,play]=r;
  const lg=logo==='rtl9'?'RTL9':'CANAL+';
  return `<div class="r" style="height:${m.row}px">
    <span class="no" style="width:${m.plateW}px;height:${m.plateH}px;font-size:${m.nm-1}px">${n}</span>
    <span class="lg ${logo}" style="width:${m.lgW}px;height:${m.lgH}px;font-size:${logo==='rtl9'?m.lgH*0.62:m.lgH*0.5}px">${lg}</span>
    <span class="nm" style="font-size:${m.nm}px;font-weight:500">${name}</span>
    ${play?`<span class="disc" style="width:${m.disc}px;height:${m.disc}px">${I(ICON.tri,m.disc*0.55)}</span>`:''}
  </div>`;
}
// TransportPlan (feature/player): how the three groups of the transport share their row.
const SLACK=3;                          // TRANSPORT_SLACK: what each end is planned for beyond what it asks, for whole pixels
function planRow(room,middle,count,start,end,gap,minGap){
  const gaps=count+1,ws=start>0?start+SLACK:start,we=end>0?end+SLACK:end,shared=room-middle-gap*gaps,half=shared/2;
  if(half>=ws&&half>=we)return {s:1,e:1,gap};                                       // as drawn
  if(shared>=ws+we){const atEnd=we>half?we:shared-ws;return {s:shared-atEnd,e:atEnd,gap};}            // unequal
  const fit=(room-middle-ws-we)/gaps;return {s:ws,e:we,gap:Math.min(gap,Math.max(fit,minGap))};         // closer
}
function chrome(aw,H,m,o){
  const t=m.t,i=m.inset,ring=m.ring,bg=m.bg;
  const cy=H-i-ring/2;                  // the transport's centre line
  const barY=cy-ring/2-39;              // the bar sits 39dp above the play ring's top

  // the transport: the list's pill, the steps and the play control, the screen's two controls
  const room=aw-2*i,middle=m.step*2+ring,pl=planRow(room,middle,3,t,2*t+bg,m.gap,4);
  const spare=room-middle-pl.gap*4,startShare=spare*pl.s/(pl.s+pl.e);
  const prevL=i+startShare+pl.gap,ringL=prevL+m.step+pl.gap,nextL=ringL+ring+pl.gap;
  const startLabelled=startShare>=t+64;                                             // PILL_LABEL_ROOM
  const end=[[ICON.aspect,'ملء'],[ICON.lock,'قفل']];
  let right=i;const bot=end.slice().reverse().map(([d])=>{
    const h=`<span class="abs round" style="width:${t}px;height:${t}px;right:${right}px;top:${cy-t/2}px">${I(d,t*0.42)}</span>`;
    right+=t+bg;return h;}).join('');
  const startPill=startLabelled
    ?`<span class="abs pill" style="left:${i}px;height:${t}px;top:${cy-t/2}px;font-size:${m.nm}px;padding:0 10px;gap:6px">${I(ICON.list,m.nm+5)}<span>${T.playlist}</span></span>`
    :`<span class="abs pill iconly" style="left:${i}px;width:${t}px;height:${t}px;top:${cy-t/2}px;padding:0;justify-content:center">${I(ICON.list,t*0.42)}</span>`;

  // the top bar: the back button, the title with what is under it, and the head of the controls -- the stream-quality
  // mark (not drawn) and four buttons. The title has what they leave, and the chips are cut between two chips.
  const topIcons=[ICON.heart,ICON.vol,ICON.gear,ICON.dots];
  const tops=topIcons.map((d,k)=>`<span class="abs round" style="width:${t}px;height:${t}px;right:${i+(topIcons.length-1-k)*(t+bg)}px;top:${i}px">${I(d,t*0.46)}</span>`).join('');
  const cluster=m.qual+4*t+4*bg,titleW=Math.max(0,aw-2*i-t-2*bg-cluster-8);
  const chipW=c=>c==='live'?64:c==='FHD'?54:c.length*8+24;
  let used=0;const shown=[];
  for(const c of o.chips){const w=chipW(c),next=shown.length?used+8+w:w;if(next>titleW)break;used=next;shown.push(c);}
  const chips=shown.map(c=>c==='live'?`<span class="chip live">${T.live}</span>`:c==='FHD'?`<span class="chip hd">FHD</span>`:`<span class="chip">${c}</span>`).join('');
  return `
   <span class="abs round" style="width:${t}px;height:${t}px;left:${i}px;top:${i}px">${I(ICON.back,t*0.5)}</span>
   <div class="abs" style="left:${i+t+bg+4}px;top:${i-2}px;width:${titleW}px">
     <div class="ttl" style="font-size:${m.ttl}px;line-height:${t*0.5}px;overflow:hidden;text-overflow:ellipsis">FR| RTL 9 4K</div>
     <div style="display:flex;gap:8px;margin-top:6px">${chips}</div>
   </div>
   ${tops}
   <div class="abs track" style="left:${i}px;right:${i}px;top:${barY-3}px"><i></i></div>
   ${startPill}
   <span class="abs round" style="width:${m.step}px;height:${m.step}px;left:${prevL}px;top:${cy-m.step/2}px">${I(ICON.prev,m.step*0.42)}</span>
   <span class="abs play" style="width:${ring}px;height:${ring}px;left:${ringL}px;top:${cy-ring/2}px">${I(ICON.pause,ring*0.42)}</span>
   <span class="abs round" style="width:${m.step}px;height:${m.step}px;left:${nextL}px;top:${cy-m.step/2}px">${I(ICON.next,m.step*0.42)}</span>
   ${bot}`;
}
function panelHtml(W,H,m,pw,mode){
  const rows=ROWS.map((r,i)=>rowHtml(r,m,0,i)).join('');
  return `<div class="panel ${mode==='overlay'?'over':'split'}" style="width:${pw}px">
    <div class="head" style="height:${m.head}px;padding:${m.pad}px ${m.pad}px 0 ${m.pad+4}px;margin-bottom:${m.pad/2}px">
      <div class="t"><b style="font-size:${m.fs+2}px">${T.title}</b><span style="font-size:${m.fs-3}px">${T.count(28)}</span></div>
      <span class="x" style="width:${m.t}px;height:${m.t}px">${I(ICON.close,22)}</span>
    </div>
    <div class="list" style="padding:0 ${m.pad}px ${m.pad}px">${rows}</div>
  </div>`;
}
function frame(s){
  const {W,H,tv,mode}=s,m=metrics(W,H,tv);
  let pw,ax,aw,px,py,fw,fh;
  if(mode==='overlay'){
    pw=clamp(W*0.40,340,400);
    fw=Math.min(W,H*16/9);fh=fw*9/16;ax=(W-fw)/2;aw=fw;px=0;py=(H-fh)/2;
  }else{
    pw=tv?clamp(W*0.40,340,400):clamp(W*0.35,280,400);
    aw=W-pw;ax=0;fw=Math.min(aw,H*16/9);fh=fw*9/16;px=(aw-fw)/2;py=(H-fh)/2;
  }
  return {pw,aw,html:`<div class="screen" style="width:${W}px;height:${H}px">
    <div class="area" style="left:${ax}px;width:${aw}px;height:${H}px">
      <div class="pic" style="left:${px}px;top:${py}px;width:${fw}px;height:${fh}px"><i></i></div>
      ${chrome(aw,H,m,s.bars)}
    </div>
    ${panelHtml(W,H,m,pw,mode)}
  </div>`};
}
const FR={
  'phone-now':{W:851,H:393,tv:false,mode:'overlay',bars:{chips:['live','FHD','H.264','16:9'],startLabelled:true,endLabelled:true},cap:'<b>الحالي</b> — هاتف <bdi dir="ltr">851×393dp</bdi>: القائمة <b><bdi dir="ltr">40% (340dp)</bdi></b> فوق الفيديو، فالفيديو 699×393 يغطّي منه نحو 38%، وزر «التالي» مقطوع بحافتها وأيقونات القلب والصوت والترس تظهر خافتة تحتها.'},
  'phone-split':{W:851,H:393,tv:false,mode:'split',bars:{chips:['live','FHD'],startLabelled:true,endLabelled:false},cap:'<b>المعتمد</b> — هاتف <bdi dir="ltr">851×393dp</bdi>: القائمة <b><bdi dir="ltr">35% (298dp)</bdi></b> والفيديو <b><bdi dir="ltr">65% (553dp)</bdi></b> بنسبته 16:9 كاملًا غير مشوَّه (553×311، شريطان أسودان فوقه وتحته). لا شيء منه مغطّى، وأزرار الفيديو كلها ظاهرة بأحجامها.'},
  'tv-split':{W:960,H:540,tv:true,mode:'split',bars:{chips:['live'],startLabelled:false,endLabelled:false},cap:'<b>المعتمد</b> — تلفاز <bdi dir="ltr">960×540dp</bdi>: القائمة <b><bdi dir="ltr">40% (384dp)</bdi></b> بحدّ أدنى 340dp وأقصى 400dp، والفيديو <b><bdi dir="ltr">60% (576dp)</bdi></b> بنسبته 16:9 كاملًا (576×324، شريطان أسودان فوقه وتحته). الاسم والشارات أضيق مما يظهر هنا، كما في التعليق أعلاه.'}
};
const p=new URLSearchParams(location.search),f=p.get('frame')||'sheet';
function block(k,withCap){
  const s=FR[k],r=frame(s);
  const pct=Math.round(r.aw/s.W*1000)/10,pp=Math.round(r.pw/s.W*1000)/10;
  const ruler=s.mode==='split'
    ?`<div class="ruler" style="width:${s.W}px"><span class="a" style="width:${r.aw}px">الفيديو <bdi dir="ltr">${pct}%</bdi></span><span class="b" style="width:${r.pw}px">القائمة <bdi dir="ltr">${pp}%</bdi></span></div>`
    :`<div class="ruler" style="width:${s.W}px"><span class="a" style="width:${s.W-r.pw}px">الفيديو يبقى تحت القائمة</span><span class="b" style="width:${r.pw}px">القائمة <bdi dir="ltr">${pp}%</bdi> فوقه</span></div>`;
  return (withCap?`<div class="cap">${k} — ${s.cap}</div>`:'')+r.html+ruler;
}
if(f==='sheet'){document.body.className='sheet';document.body.innerHTML=Object.keys(FR).map(k=>block(k,true)).join('');}
else{document.body.innerHTML=block(f,false);}
</script>
</body>
